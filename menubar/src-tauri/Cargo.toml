[package]
name = "sanctuary-menubar"
version = "0.1.0"
description = "Sanctuary menubar app. Castle Layer 3 surface that surfaces fortress state in the operator menubar."
authors = ["Erik Newton"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sanctuary_menubar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "=2.3.3"
tauri-plugin-http = "=2.5.8"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
keyring = "=3.6.3"
log = "=0.4.29"
env_logger = "=0.11.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
