title: Sanctuary Protocol
description: A kernel-level firewall and sovereignty substrate for AI agents. Real egress enforcement, encrypted state, approval gates, and portable receipts. One MCP server, runnable with npx.
url: "https://sanctuaryprotocol.ai"
baseurl: ""

# Build settings
markdown: kramdown
theme: null
plugins:
  - jekyll-seo-tag

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

# Defaults
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      author: "Erik Newton"
