title: Sanctuary Protocol
description: Open-source security and privacy for AI agents. Explore the full product story, current capabilities and the fleet direction.
url: "https://sanctuaryprotocol.ai"
baseurl: ""

# Build settings
markdown: kramdown
theme: null
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Jekyll skips dotfolders unless they are listed here. .well-known carries
# security.txt (RFC 9116) and the MCP registry namespace verification file;
# both must publish at https://sanctuaryprotocol.ai/.well-known/.
include:
  - ".well-known"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  # The March-2026 review sprint artifacts that used to be excluded here were
  # removed from the tree on 2026-10-02 (AGENTS.md MUST-NEVER #9); private copies
  # live in the coordinator archive. Do not re-add review findings under docs/.
  # Detailed internal security-posture page (branch-protection specifics,
  # dependency-debt board, maintainer decisions). Owner-directed takedown
  # 2026-08-31 (INC-009): unpublished pending a review of whether the
  # open-security-debt board says more than a public page should.
  - audit/SECURITY_POSTURE.md

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      author: "Erik Newton"
