title: Sanctuary Protocol
description: Security for AI agents with no vendor in the path. Kernel-enforced egress control on macOS, keys only the operator holds, hash-chained audit. One command protects Claude Code, Cursor, or any MCP harness.
url: "https://sanctuaryprotocol.ai"
baseurl: ""

# Build settings
markdown: kramdown
theme: null
plugins:
  - jekyll-seo-tag

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

# Defaults
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      author: "Erik Newton"
