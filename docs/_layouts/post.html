<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Sanctuary Protocol</title>
  <meta name="description" content="{{ page.excerpt | strip_html | truncatewords: 50 }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.excerpt | strip_html | truncatewords: 50 }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="article:author" content="Erik Newton">
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="site-title">Sanctuary Protocol</a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/blog' | relative_url }}">Blog</a>
        <a href="https://github.com/eriknewton/sanctuary-framework">GitHub</a>
        <a href="https://www.npmjs.com/package/@sanctuary-framework/mcp-server">npm</a>
      </div>
    </div>
  </nav>

  <main>
    <article class="post">
      <header class="post-header">
        <h1>{{ page.title }}</h1>
        <div class="post-meta">
          <span class="post-author">{{ page.author | default: "Erik Newton" }}</span>
          <span class="post-date">{{ page.date | date: "%B %-d, %Y" }}</span>
        </div>
      </header>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
    <div class="post-footer">
      <a href="{{ '/blog' | relative_url }}">&larr; All posts</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; {{ 'now' | date: "%Y" }} Erik Newton. Sanctuary Framework is open source under Apache-2.0 (code) and CC-BY-4.0 (specification).</p>
    </div>
  </footer>
</body>
</html>
