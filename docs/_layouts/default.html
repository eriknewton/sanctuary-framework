<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Erik Newton">
  <meta name="theme-color" content="#FFFFFF">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="Sanctuary Protocol">

  <!-- Self-hosted fonts and styles: the site loads nothing from third parties (footer promise on docs/index.html). -->
  <link rel="stylesheet" href="{{ '/assets/home/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/home/journal.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/home/favicon-a2.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% include site-header.html %}

<main id="main">
  <div class="wrap">
    {{ content }}
  </div>
</main>

{% include site-footer.html %}
</body>
</html>
