---
layout: default
title: Blog | Sanctuary Protocol
---

<h1 style="font-family: var(--font-heading); font-size: 2rem; color: var(--color-heading); margin-bottom: 2rem;">Blog</h1>

<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">
      <h2>{{ post.title }}</h2>
      <span class="post-date">{{ post.date | date: "%B %-d, %Y" }}</span>
      {% if post.excerpt %}
      <p class="post-excerpt">{{ post.excerpt | strip_html | truncatewords: 40 }}</p>
      {% endif %}
    </a>
  </li>
  {% endfor %}
</ul>
