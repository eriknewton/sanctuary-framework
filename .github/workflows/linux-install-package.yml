name: Linux Install Package

# No path filters: absence of a required job must not look like a successful run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'
  # PR evidence is for the contributor head, never GitHub's synthetic merge ref.
  INSTALL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  install-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.INSTALL_SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/apt-install-resilient
        with:
          packages: libnetfilter-queue-dev libnfnetlink-dev nftables python3-yaml
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Exact-head Rust and package contracts
        run: |
          [[ "$(git rev-parse HEAD)" == "$INSTALL_SOURCE_SHA" ]]
          python3 castle-wall-daemon/packaging/ubuntu/test-lifecycle-guard.py
          python3 castle-wall-daemon/packaging/ubuntu/test-install-package.py
          python3 castle-wall-daemon/packaging/ubuntu/test-install-r1.py
          python3 castle-wall-daemon/packaging/ubuntu/assert-source-constants.py
          cd castle-wall-daemon
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --lib --bins

  install-agent-manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.INSTALL_SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/apt-install-resilient
        with:
          packages: libnetfilter-queue-dev libnfnetlink-dev nftables gcc
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - name: Require real-manager launch and isolation tests
        run: |
          [[ "$(git rev-parse HEAD)" == "$INSTALL_SOURCE_SHA" ]]
          sudo install -d -m 0700 /root/build
          printf 'disposable\n' | sudo tee /root/.sanctuary-host-role >/dev/null
          cd castle-wall-daemon
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS \
            env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            SANCTUARY_P3_MANAGER_TEST=1 SANCTUARY_P3_EVIDENCE_DIR=/root/build/p4-manager-evidence \
            cargo test --locked --test linux_agent_launch_manager -- --ignored --test-threads=1
      - name: Copy public manager evidence
        if: always()
        run: |
          sudo cp -a /root/build/p4-manager-evidence "$RUNNER_TEMP/manager-evidence"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/manager-evidence"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-install-agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manager-evidence
          if-no-files-found: error
          retention-days: 7

  install-package-build:
    needs: install-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.INSTALL_SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/apt-install-resilient
        with:
          packages: libnetfilter-queue-dev libnfnetlink-dev nftables iproute2 python3-yaml
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - name: Build each closed variant once from the exact clean head
        run: |
          [[ "$(git rev-parse HEAD)" == "$INSTALL_SOURCE_SHA" ]]
          source=castle-wall-daemon/packaging/ubuntu
          bash "$source/build-deb.sh" --variant internal --revision 1 --output "$RUNNER_TEMP/internal"
          bash "$source/assert-structure.sh" --artifact-dir "$RUNNER_TEMP/internal"
          # unshare is privileged on some Ubuntu runners. The builder runs as
          # root in this disposable job so seam tests need no host fallback.
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            python3 "$source/build-install-deb.py" --revision 1 --output "$RUNNER_TEMP/install"
          deb=("$RUNNER_TEMP"/install/*.deb)
          [[ ${#deb[@]} == 1 ]]
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 "$source/test-install-archive.py" "${deb[0]}" "$INSTALL_SOURCE_SHA"
          # Keep the verified package tree root-owned while adding public CI evidence.
          internal=("$RUNNER_TEMP"/internal/*.deb)
          [[ ${#internal[@]} == 1 ]]
          sudo install -d -o root -g root -m 0755 "$RUNNER_TEMP/install/internal"
          sudo install -o root -g root -m 0644 "${internal[0]}" "$RUNNER_TEMP/install/internal/"
          python3 "$source/record-install-ci.py" "$RUNNER_TEMP/build-context.json"
          sudo install -o root -g root -m 0644 "$RUNNER_TEMP/build-context.json" "$RUNNER_TEMP/install/build-context.json"
          (cd "$RUNNER_TEMP/install" && sha256sum --check ./*.deb.sha256)
      - name: Retain exact package bytes for required downstream jobs
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-install-${{ env.INSTALL_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/install
          if-no-files-found: error
          retention-days: 7

  install-package-lifecycle:
    needs: install-package-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [inert, upgrade, provisioned-refusal, internal-conversion]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.INSTALL_SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/apt-install-resilient
        with:
          packages: nftables libnetfilter-queue1 libnfnetlink0 iproute2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.install-package-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/install
          merge-multiple: true
      - name: Assert downloaded bytes and run actual inert lifecycle
        run: |
          [[ "$(git rev-parse HEAD)" == "$INSTALL_SOURCE_SHA" ]]
          cd "$RUNNER_TEMP/install"
          sha256sum --check ./*.deb.sha256
          cd "$GITHUB_WORKSPACE"
          deb=("$RUNNER_TEMP"/install/*.deb)
          [[ ${#deb[@]} == 1 ]]
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf 'disposable\n' | sudo tee /root/.sanctuary-host-role >/dev/null
          # The shipped guard refused /usr/share on a hosted runner. Record its
          # custody, then remove write bits on this disposable CI fixture only.
          [[ ! -L /usr/share && "$(stat -c %u /usr/share)" == 0 ]]
          stat -c 'CI /usr/share before install: owner=%u mode=%a type=%F' /usr/share
          sudo chmod go-w /usr/share
          stat -c 'CI /usr/share after normalization: owner=%u mode=%a type=%F' /usr/share
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS \
            python3 castle-wall-daemon/packaging/ubuntu/ci-install-lifecycle.py \
              --scenario '${{ matrix.scenario }}' --deb "${deb[0]}" --evidence "$RUNNER_TEMP/lifecycle"
      - name: Retain actual-manager lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-install-lifecycle-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lifecycle
          if-no-files-found: error
          retention-days: 7

  # Composition consumes the same downloaded artifact as the lifecycle jobs.
  install-cold-composition:
    needs: install-package-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.INSTALL_SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/apt-install-resilient
        with:
          packages: nftables libnetfilter-queue1 libnfnetlink0 iproute2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.install-package-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/install
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: ./.github/actions/apt-install-resilient
        with:
          packages: python3-cryptography tcpdump
      - name: Build the exact-head workstation signer and public CI inputs
        run: |
          # A tool-cache symlink is runner-writable and must fail the signer's custody check.
          sudo install -o root -g root -m 0755 "$(command -v node)" /usr/bin/node
          cd server
          npm ci
          npm run build
          cd "$GITHUB_WORKSPACE"
          python3 castle-wall-daemon/packaging/ubuntu/prepare-install-composition.py \
            --signer server/bin/sanctuary-linux-policy-sign --output "$RUNNER_TEMP/composition-inputs"
      - name: Require actual-manager composed install witness
        run: |
          [[ "$(git rev-parse HEAD)" == "$INSTALL_SOURCE_SHA" ]]
          [[ "$(cat /proc/1/comm)" == systemd ]]
          systemctl --version | head -1 | grep '^systemd 255 '
          cd "$RUNNER_TEMP/install"
          sha256sum --check ./*.deb.sha256
          cd "$GITHUB_WORKSPACE"
          witness=castle-wall-daemon/packaging/ubuntu/ci-install-composition.py
          [[ -f "$witness" ]] || { echo 'P4 composed install witness is required; package-only evidence is insufficient' >&2; exit 1; }
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf 'disposable\n' | sudo tee /root/.sanctuary-host-role >/dev/null
          [[ ! -L /usr/share && "$(stat -c %u /usr/share)" == 0 ]]
          stat -c 'CI /usr/share before install: owner=%u mode=%a type=%F' /usr/share
          sudo chmod go-w /usr/share
          stat -c 'CI /usr/share after normalization: owner=%u mode=%a type=%F' /usr/share
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS \
            python3 "$witness" --artifact-dir "$RUNNER_TEMP/install" --evidence "$RUNNER_TEMP/composition" \
              --inputs "$RUNNER_TEMP/composition-inputs" --operator-uid "$(id -u)"
      - name: Expose retained composition evidence to the artifact uploader
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/composition" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/composition"
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-install-composition-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/composition
          if-no-files-found: error
          retention-days: 7

  install-package-evidence:
    if: always()
    needs: [install-rust, install-agent-manager, install-package-build, install-package-lifecycle, install-cold-composition]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.INSTALL_SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/apt-install-resilient
        with:
          packages: python3-yaml
      - name: Record service digest and require every package job
        env:
          INSTALL_NEEDS: ${{ toJSON(needs) }}
          INSTALL_ARTIFACT_ID: ${{ needs.install-package-build.outputs.artifact-id }}
          INSTALL_ARTIFACT_DIGEST: ${{ needs.install-package-build.outputs.artifact-digest }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_WORKFLOW_SHA"
          fi
          python3 castle-wall-daemon/packaging/ubuntu/record-install-ci.py "$RUNNER_TEMP/install-ci.json" --require-package-jobs
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-install-ci-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/install-ci.json
          if-no-files-found: error
          retention-days: 7
