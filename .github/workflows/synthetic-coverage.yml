name: Synthetic Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  coverage:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        run: |
          python3 -m venv sidecars/concordia/.venv
          sidecars/concordia/.venv/bin/pip install --upgrade pip
          sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      - name: Run synthetic coverage
        run: npm run synthetic-coverage

      - name: Upload synthetic coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-coverage-${{ matrix.os }}
          path: |
            scripts/synthetic-coverage/.out/report.json
            scripts/synthetic-coverage/.out/report.md
          if-no-files-found: error

      - name: Post PR summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = `<!-- synthetic-coverage:${{ matrix.os }} -->`;
            const report = fs.readFileSync("scripts/synthetic-coverage/.out/report.md", "utf8");
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  parity:
    needs: coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Download Linux synthetic coverage report
        uses: actions/download-artifact@v4
        with:
          name: synthetic-coverage-ubuntu-latest
          path: artifacts/ubuntu

      - name: Download macOS synthetic coverage report
        uses: actions/download-artifact@v4
        with:
          name: synthetic-coverage-macos-latest
          path: artifacts/macos

      - name: Run synthetic coverage parity
        run: npm run synthetic-coverage:parity -- artifacts/ubuntu/report.json artifacts/macos/report.json

      - name: Upload synthetic coverage parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-coverage-parity
          path: |
            scripts/synthetic-coverage/.out/parity.json
            scripts/synthetic-coverage/.out/parity.md
          if-no-files-found: error
          include-hidden-files: true

      - name: Post PR parity summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = `<!-- synthetic-coverage:parity -->`;
            const report = fs.readFileSync("scripts/synthetic-coverage/.out/parity.md", "utf8");
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  gate-a:
    needs: parity
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Download Linux synthetic coverage report
        uses: actions/download-artifact@v4
        with:
          name: synthetic-coverage-ubuntu-latest
          path: artifacts/ubuntu

      - name: Download macOS synthetic coverage report
        uses: actions/download-artifact@v4
        with:
          name: synthetic-coverage-macos-latest
          path: artifacts/macos

      - name: Download synthetic coverage parity report
        uses: actions/download-artifact@v4
        with:
          name: synthetic-coverage-parity
          path: artifacts/parity

      - name: Run synthetic coverage gate (a)
        run: npm run synthetic-coverage:gate-a -- artifacts/ubuntu/report.json artifacts/macos/report.json artifacts/parity/parity.json

      - name: Upload synthetic coverage gate (a) artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-coverage-gate-a
          path: |
            scripts/synthetic-coverage/.out/gate-a-artifact.json
            scripts/synthetic-coverage/.out/gate-a-artifact.md
          if-no-files-found: error
          include-hidden-files: true

      - name: Post PR gate (a) verdict
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = `<!-- synthetic-coverage:gate-a -->`;
            let report = "Gate (a) artifact was not produced.";
            if (fs.existsSync("scripts/synthetic-coverage/.out/gate-a-artifact.md")) {
              report = fs.readFileSync("scripts/synthetic-coverage/.out/gate-a-artifact.md", "utf8");
            }
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
