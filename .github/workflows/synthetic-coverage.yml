name: Synthetic Coverage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  coverage:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        run: |
          python3 -m venv sidecars/concordia/.venv
          sidecars/concordia/.venv/bin/pip install --upgrade pip
          sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      - name: Run synthetic coverage
        run: npm run synthetic-coverage

      - name: Upload synthetic coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-coverage-${{ matrix.os }}
          path: |
            scripts/synthetic-coverage/.out/report.json
            scripts/synthetic-coverage/.out/report.md
          if-no-files-found: error

      # Informational only — best-effort by design. Comment I/O must never
      # decide this job's verdict (2026-06-10 GitHub outage 401s failed
      # otherwise-green jobs when this was the unguarded last step).
      - name: Post PR summary (best-effort)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const upsertPrComment = require("./.github/scripts/upsert-pr-comment.cjs");
            const marker = `<!-- synthetic-coverage:${{ matrix.os }} -->`;
            const report = fs.readFileSync("scripts/synthetic-coverage/.out/report.md", "utf8");
            await upsertPrComment({ github, context, core }, marker, `${marker}\n${report}`);

  parity:
    needs: coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Download Linux synthetic coverage report
        uses: actions/download-artifact@v5
        with:
          name: synthetic-coverage-ubuntu-latest
          path: artifacts/ubuntu

      - name: Download macOS synthetic coverage report
        uses: actions/download-artifact@v5
        with:
          name: synthetic-coverage-macos-latest
          path: artifacts/macos

      - name: Run synthetic coverage parity
        run: npm run synthetic-coverage:parity -- artifacts/ubuntu/report.json artifacts/macos/report.json

      - name: Upload synthetic coverage parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-coverage-parity
          path: |
            scripts/synthetic-coverage/.out/parity.json
            scripts/synthetic-coverage/.out/parity.md
          if-no-files-found: error
          include-hidden-files: true

      # Informational only — best-effort by design (see Post PR summary note).
      - name: Post PR parity summary (best-effort)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const upsertPrComment = require("./.github/scripts/upsert-pr-comment.cjs");
            const marker = `<!-- synthetic-coverage:parity -->`;
            const report = fs.readFileSync("scripts/synthetic-coverage/.out/parity.md", "utf8");
            await upsertPrComment({ github, context, core }, marker, `${marker}\n${report}`);

  gate-a:
    needs: parity
    runs-on: ubuntu-latest
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Download Linux synthetic coverage report
        uses: actions/download-artifact@v5
        with:
          name: synthetic-coverage-ubuntu-latest
          path: artifacts/ubuntu

      - name: Download macOS synthetic coverage report
        uses: actions/download-artifact@v5
        with:
          name: synthetic-coverage-macos-latest
          path: artifacts/macos

      - name: Download synthetic coverage parity report
        uses: actions/download-artifact@v5
        with:
          name: synthetic-coverage-parity
          path: artifacts/parity

      - name: Run synthetic coverage gate (a) (informational on push/PR; gating on release tag)
        id: gate_a
        run: |
          set -o pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Release-tag event detected; gate-a is in GATING mode (will fail on gate_a_red)."
            npm run synthetic-coverage:gate-a -- artifacts/ubuntu/report.json artifacts/macos/report.json artifacts/parity/parity.json
          else
            echo "Non-tag event (${GITHUB_EVENT_NAME} on ${GITHUB_REF}); gate-a is in INFORMATIONAL mode."
            npm run synthetic-coverage:gate-a -- artifacts/ubuntu/report.json artifacts/macos/report.json artifacts/parity/parity.json || {
              EXIT=$?
              echo "::warning::gate-a reported non-green state (exit code ${EXIT}); see artifact + PR comment for violations. Not failing CI in informational mode."
              exit 0
            }
          fi

      - name: Upload synthetic coverage gate (a) artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-coverage-gate-a
          path: |
            scripts/synthetic-coverage/.out/gate-a-artifact.json
            scripts/synthetic-coverage/.out/gate-a-artifact.md
          if-no-files-found: error
          include-hidden-files: true

      # Informational only — best-effort by design. The gate (a) verdict is
      # set exclusively by the "Run synthetic coverage gate (a)" step above;
      # comment I/O failures must never flip this job red (or mask a red).
      - name: Post PR gate (a) verdict comment (best-effort)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const upsertPrComment = require("./.github/scripts/upsert-pr-comment.cjs");
            const marker = `<!-- synthetic-coverage:gate-a -->`;
            let report = "Gate (a) artifact was not produced.";
            if (fs.existsSync("scripts/synthetic-coverage/.out/gate-a-artifact.md")) {
              report = fs.readFileSync("scripts/synthetic-coverage/.out/gate-a-artifact.md", "utf8");
            }
            await upsertPrComment({ github, context, core }, marker, `${marker}\n${report}`);
