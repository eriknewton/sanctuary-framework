name: Linux Arch Package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # No workflow_dispatch: a free-text input would be the only attacker-controlled
  # string in this file, and the .deb gate below needs a base commit the event
  # itself supplies (pull_request.base.sha or push.before). Nothing uses a manual run.

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ARCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  arch-package-build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # The archlinux image ships without git; without it actions/checkout falls back to a
      # REST download with no .git, and the exact-head check below cannot run.
      - name: Install git for checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ARCH_SOURCE_SHA }}
          persist-credentials: false
      - name: Build Arch package from exact head
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$(git rev-parse HEAD)" == "$ARCH_SOURCE_SHA" ]]
          pacman -Syu --noconfirm --needed base-devel git rustup zstd libnetfilter_queue nftables systemd iproute2 util-linux shadow python
          python3 -m unittest discover -s castle-wall-daemon/packaging/arch -p 'test_*.py'
          useradd -m build
          chown -R build:build "$GITHUB_WORKSPACE"
          runuser -u build -- rustup toolchain install 1.95.0 --profile minimal
          runuser -u build -- bash -lc "cd '$GITHUB_WORKSPACE/castle-wall-daemon/packaging/arch' && PATH=\"\$HOME/.cargo/bin:\$PATH\" makepkg --noconfirm --syncdeps --needed"
          install -d "$RUNNER_TEMP/arch-package"
          packages=(castle-wall-daemon/packaging/arch/*.pkg.tar.zst)
          [[ ${#packages[@]} == 1 ]]
          cp -- "${packages[0]}" "$RUNNER_TEMP/arch-package/"
          (cd "$RUNNER_TEMP/arch-package" && sha256sum ./*.pkg.tar.zst > SHA256SUMS)
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-arch-package-${{ env.ARCH_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arch-package
          if-no-files-found: error
          retention-days: 7

  arch-package-lifecycle:
    needs: arch-package-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ARCH_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.arch-package-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/arch-package
          merge-multiple: true
      - name: Run pacman lifecycle under systemd PID 1
        run: |
          cd "$RUNNER_TEMP/arch-package"
          sha256sum --check SHA256SUMS
          pkg=(*.pkg.tar.zst)
          [[ ${#pkg[@]} == 1 ]]
          cid="$(docker run --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$GITHUB_WORKSPACE:/workspace:ro" -v "$RUNNER_TEMP/arch-package:/pkg:ro" -d archlinux:base-devel@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd /usr/lib/systemd/systemd)"
          timeout 120 bash -s -- "$cid" <<'WAIT_SYSTEMD'
          cid="$1"
          until docker exec "$cid" sh -c 'test "$(cat /proc/1/comm)" = systemd'; do
            sleep 2
          done
          WAIT_SYSTEMD
          docker exec "$cid" bash -lc "pacman -Syu --noconfirm --needed base-devel systemd nftables iproute2 util-linux shadow python libnetfilter_queue zstd"
          # Evidence lives outside /tmp: systemd (PID 1 here) mounts a tmpfs on /tmp, and
          # docker cp reads the container's root filesystem, not mounts inside it, so a
          # directory under /tmp is written by the script and then "not found" by the copy
          # (run 37410410188: the whole lifecycle passed and no evidence was uploaded).
          evidence=/var/lib/sanctuary-arch-lifecycle-evidence
          docker exec "$cid" mkdir -p "$evidence"
          rc=0
          docker exec "$cid" bash -lc "EVIDENCE_DIR=$evidence /workspace/castle-wall-daemon/packaging/arch/ci-arch-lifecycle.sh /pkg/${pkg[0]}" || rc=$?
          docker cp "$cid:$evidence" "$RUNNER_TEMP/arch-lifecycle"
          docker stop "$cid"
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-arch-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arch-lifecycle
          if-no-files-found: error
          retention-days: 7

  deb-unchanged-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ARCH_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/apt-install-resilient
        with:
          packages: libnetfilter-queue-dev libnfnetlink-dev nftables iproute2 python3-yaml
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - name: Resolve comparison base
        run: |
          event="${{ github.event_name }}"
          case "$event" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              ;;
            *)
              echo "unsupported event for Arch .deb unchanged gate: $event" >&2
              exit 1
              ;;
          esac
          zero=0000000000000000000000000000000000000000
          if [[ -z "$base" || "$base" == "$zero" || "$base" == "$GITHUB_SHA" ]]; then
            echo "Arch .deb unchanged gate needs a real base commit distinct from head for $event" >&2
            exit 1
          fi
          git fetch --no-tags origin "$base"
          git cat-file -e "$base^{commit}" || {
            echo "Arch .deb unchanged gate cannot resolve base commit: $base" >&2
            exit 1
          }
          echo "ARCH_COMPARE_BASE=$base" >>"$GITHUB_ENV"
          # The gate binds the Arch slice to the proven .deb: a diff that touches the
          # Arch packaging tree or this workflow may not touch any .deb input. A diff
          # that touches neither is not this gate's subject (the .deb inputs have their
          # own workflow), so the two enforcing steps below run only when a slice path
          # changed and the job records "not applicable" otherwise. Without this scope
          # every unrelated PR and every merge to main would fail here (round-2 R1).
          # core.quotePath=false: git otherwise C-quotes any path with a non-ASCII or control
          # byte, and a quoted slice path would match neither alternative below, so the gate
          # would record NOT APPLICABLE on a diff that touched the slice (closure read, both families).
          git -c core.quotePath=false diff --name-only --no-renames "$base"...HEAD >"$RUNNER_TEMP/changed-paths.txt"
          if grep -Eq '^(castle-wall-daemon/packaging/arch/|\.github/workflows/linux-arch-package\.yml$)' "$RUNNER_TEMP/changed-paths.txt"; then
            echo "ARCH_SLICE_TOUCHED=yes" >>"$GITHUB_ENV"
          else
            echo "ARCH_SLICE_TOUCHED=no" >>"$GITHUB_ENV"
          fi
      - name: Enforce slice path allowlist
        if: env.ARCH_SLICE_TOUCHED == 'yes'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          allowed_workflow = ".github/workflows/linux-arch-package.yml"
          bad = []
          for path in Path(__import__("os").environ["RUNNER_TEMP"], "changed-paths.txt").read_text().splitlines():
              if path == allowed_workflow or path.startswith("castle-wall-daemon/packaging/arch/"):
                  continue
              bad.append(path)
          if bad:
              raise SystemExit("outside Arch packaging slice:\n" + "\n".join(bad))
          PY
      - name: Rebuild base and head install debs and compare protected fields
        if: env.ARCH_SLICE_TOUCHED == 'yes'
        run: |
          work="$RUNNER_TEMP/deb-unchanged"
          git worktree add "$work/base" "$ARCH_COMPARE_BASE"
          git worktree add "$work/head" HEAD
          for side in base head; do
            (cd "$work/$side" && sudo git config --global --add safe.directory "$PWD")
            sudo env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
              python3 "$work/$side/castle-wall-daemon/packaging/ubuntu/build-install-deb.py" \
              --revision 1 --output "$work/$side-out"
          done
          base_deb=("$work/base-out"/*.deb)
          head_deb=("$work/head-out"/*.deb)
          python3 castle-wall-daemon/packaging/arch/assert-deb-unchanged.py "${base_deb[0]}" "${head_deb[0]}"
      - name: Record gate disposition
        if: always()
        run: |
          case "${ARCH_SLICE_TOUCHED:-unset}" in
            yes) echo "deb-unchanged gate: ENFORCED (a slice path changed between $ARCH_COMPARE_BASE and $GITHUB_SHA)" ;;
            no) echo "deb-unchanged gate: NOT APPLICABLE (no Arch slice path changed between $ARCH_COMPARE_BASE and $GITHUB_SHA); the .deb inputs are gated by their own workflow" ;;
            *) echo "deb-unchanged gate: base resolution failed; see the Resolve comparison base step" >&2; exit 1 ;;
          esac
