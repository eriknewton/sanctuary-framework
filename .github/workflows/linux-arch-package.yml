name: Linux Arch Package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # No workflow_dispatch: a free-text input would be the only attacker-controlled
  # string in this file, and the .deb gate below needs a base commit the event
  # itself supplies (pull_request.base.sha or push.before). Nothing uses a manual run.

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ARCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  arch-package-build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # The archlinux image ships without git; without it actions/checkout falls back to a
      # REST download with no .git, and the exact-head check below cannot run.
      - name: Install git for checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ARCH_SOURCE_SHA }}
          persist-credentials: false
      - name: Build Arch package from exact head
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$(git rev-parse HEAD)" == "$ARCH_SOURCE_SHA" ]]
          pacman -Syu --noconfirm --needed base-devel git rustup zstd libnetfilter_queue nftables systemd iproute2 util-linux shadow python
          python3 -m unittest discover -s castle-wall-daemon/packaging/arch -p 'test_*.py'
          useradd -m build
          chown -R build:build "$GITHUB_WORKSPACE"
          runuser -u build -- rustup toolchain install 1.95.0 --profile minimal
          runuser -u build -- bash -lc "cd '$GITHUB_WORKSPACE/castle-wall-daemon/packaging/arch' && PATH=\"\$HOME/.cargo/bin:\$PATH\" makepkg --noconfirm --syncdeps --needed"
          install -d "$RUNNER_TEMP/arch-package"
          packages=(castle-wall-daemon/packaging/arch/*.pkg.tar.zst)
          [[ ${#packages[@]} == 1 ]]
          cp -- "${packages[0]}" "$RUNNER_TEMP/arch-package/"
          (cd "$RUNNER_TEMP/arch-package" && sha256sum ./*.pkg.tar.zst > SHA256SUMS)
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-arch-package-${{ env.ARCH_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arch-package
          if-no-files-found: error
          retention-days: 7

  arch-package-lifecycle:
    needs: arch-package-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ARCH_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.arch-package-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/arch-package
          merge-multiple: true
      - name: Run pacman lifecycle under systemd PID 1
        run: |
          cd "$RUNNER_TEMP/arch-package"
          sha256sum --check SHA256SUMS
          pkg=(*.pkg.tar.zst)
          [[ ${#pkg[@]} == 1 ]]
          cid="$(docker run --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$GITHUB_WORKSPACE:/workspace:ro" -v "$RUNNER_TEMP/arch-package:/pkg:ro" -d archlinux:base-devel@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd /usr/lib/systemd/systemd)"
          timeout 120 bash -s -- "$cid" <<'WAIT_SYSTEMD'
          cid="$1"
          until docker exec "$cid" sh -c 'test "$(cat /proc/1/comm)" = systemd'; do
            sleep 2
          done
          WAIT_SYSTEMD
          docker exec "$cid" bash -lc "pacman -Syu --noconfirm --needed base-devel systemd nftables iproute2 util-linux shadow python libnetfilter_queue zstd"
          # Evidence lives outside /tmp: systemd (PID 1 here) mounts a tmpfs on /tmp, and
          # docker cp reads the container's root filesystem, not mounts inside it, so a
          # directory under /tmp is written by the script and then "not found" by the copy
          # (run 37410410188: the whole lifecycle passed and no evidence was uploaded).
          evidence=/var/lib/sanctuary-arch-lifecycle-evidence
          docker exec "$cid" mkdir -p "$evidence"
          rc=0
          docker exec "$cid" bash -lc "EVIDENCE_DIR=$evidence /workspace/castle-wall-daemon/packaging/arch/ci-arch-lifecycle.sh /pkg/${pkg[0]}" || rc=$?
          docker cp "$cid:$evidence" "$RUNNER_TEMP/arch-lifecycle"
          docker stop "$cid"
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-arch-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arch-lifecycle
          if-no-files-found: error
          retention-days: 7

  deb-unchanged-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ARCH_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/apt-install-resilient
        with:
          packages: libnetfilter-queue-dev libnfnetlink-dev nftables iproute2 python3-yaml
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
      - name: Resolve comparison base
        run: |
          event="${{ github.event_name }}"
          case "$event" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              ;;
            *)
              echo "unsupported event for Arch .deb unchanged gate: $event" >&2
              exit 1
              ;;
          esac
          zero=0000000000000000000000000000000000000000
          if [[ -z "$base" || "$base" == "$zero" || "$base" == "$GITHUB_SHA" ]]; then
            echo "Arch .deb unchanged gate needs a real base commit distinct from head for $event" >&2
            exit 1
          fi
          git fetch --no-tags origin "$base"
          git cat-file -e "$base^{commit}" || {
            echo "Arch .deb unchanged gate cannot resolve base commit: $base" >&2
            exit 1
          }
          echo "ARCH_COMPARE_BASE=$base" >>"$GITHUB_ENV"
          # The workflow derives the trigger predicate from is_arch_trigger_path in
          # castle-wall-daemon/packaging/arch/assert-deb-unchanged.py; keep the
          # cross-file contract comment there in sync when this call path changes.
          # A diff that touches an allowed .deb input but no trigger path is not this
          # gate's subject, so the job records "not applicable" rather than failing
          # every unrelated Ubuntu package PR.
          # NUL-separated names: git C-quotes `"`, `\` and control bytes on every
          # line-oriented listing whatever core.quotePath says, so a slice path made of
          # those bytes would match neither alternative and the gate would record NOT
          # APPLICABLE on a diff that touched the slice (binding reads, both families).
          # With -z nothing is quoted; the reader splits on NUL.
          git diff --name-only --no-renames -z "$base"...HEAD >"$RUNNER_TEMP/changed-paths.nul"
          touched="$(python3 - "$RUNNER_TEMP/changed-paths.nul" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          changed = Path(sys.argv[1]).read_bytes().split(b"\0")
          paths = [p.decode("utf-8", "surrogateescape") for p in changed if p]
          spec = importlib.util.spec_from_file_location(
              "deb_gate", "castle-wall-daemon/packaging/arch/assert-deb-unchanged.py"
          )
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          print("yes" if any(gate.is_arch_trigger_path(p) for p in paths) else "no")
          PY
          )"
          [[ "$touched" == yes || "$touched" == no ]]
          echo "ARCH_SLICE_TOUCHED=$touched" >>"$GITHUB_ENV"
      - name: Enforce slice path allowlist
        if: env.ARCH_SLICE_TOUCHED == 'yes'
        run: |
          # The workflow derives the allowlist predicate from is_arch_allowed_path in
          # castle-wall-daemon/packaging/arch/assert-deb-unchanged.py; keep the
          # cross-file contract comment there in sync when this call path changes.
          python3 - "$RUNNER_TEMP/changed-paths.nul" "$GITHUB_ENV" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          changed_path = Path(sys.argv[1])
          github_env = Path(sys.argv[2])
          raw = changed_path.read_bytes()
          paths = [p.decode("utf-8", "surrogateescape") for p in raw.split(b"\0") if p]
          spec = importlib.util.spec_from_file_location(
              "deb_gate", "castle-wall-daemon/packaging/arch/assert-deb-unchanged.py"
          )
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          bad = [p for p in paths if not gate.is_arch_allowed_path(p)]
          verdict = "refused" if bad else "ok"
          with github_env.open("a") as env:
              env.write(f"ARCH_ALLOWLIST={verdict}\n")
              env.write("ARCH_ALLOWLIST_REFUSED<<ARCH_ALLOWLIST_EOF\n")
              env.write("\n".join(bad))
              env.write("\nARCH_ALLOWLIST_EOF\n")
          print(f"allowlist: {verdict}")
          if bad:
              for path in bad:
                  print(f"allowlist refused path: {path}")
          else:
              print(f"allowlist: {len(paths)} changed path(s), all allowed for the Arch slice")
          PY
      - name: Rebuild base and head install debs and compare protected fields
        if: env.ARCH_SLICE_TOUCHED == 'yes'
        run: |
          log="$RUNNER_TEMP/deb-comparator.log"
          set +e
          (
            set -e
            work="$RUNNER_TEMP/deb-unchanged"
            git worktree add "$work/base" "$ARCH_COMPARE_BASE"
            git worktree add "$work/head" HEAD
            for side in base head; do
              (cd "$work/$side" && sudo git config --global --add safe.directory "$PWD")
              sudo env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
                python3 "$work/$side/castle-wall-daemon/packaging/ubuntu/build-install-deb.py" \
                --revision 1 --output "$work/$side-out"
            done
            base_deb=("$work/base-out"/*.deb)
            head_deb=("$work/head-out"/*.deb)
            echo "ARCH_BASE_DEB=${base_deb[0]}" >>"$GITHUB_ENV"
            echo "ARCH_HEAD_DEB=${head_deb[0]}" >>"$GITHUB_ENV"
            python3 castle-wall-daemon/packaging/arch/assert-deb-unchanged.py \
              --base-source-commit "$ARCH_COMPARE_BASE" \
              --head-source-commit "$(git rev-parse HEAD)" \
              --changed-paths-nul "$RUNNER_TEMP/changed-paths.nul" \
              "${base_deb[0]}" "${head_deb[0]}"
          ) 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" == 0 ]]; then verdict=ok; else verdict=refused; fi
          {
            echo "ARCH_COMPARATOR=$verdict"
            echo "ARCH_COMPARATOR_LOG<<ARCH_COMPARATOR_EOF"
            cat "$log"
            echo "ARCH_COMPARATOR_EOF"
          } >>"$GITHUB_ENV"
          exit 0
      - name: Compare inherited published install deb
        if: env.ARCH_SLICE_TOUCHED == 'yes' && env.ARCH_BASE_DEB != '' && env.ARCH_HEAD_DEB != ''
        run: |
          log="$RUNNER_TEMP/deb-inheritance.log"
          set +e
          (
            set -e
            # Update procedure: when a later Ubuntu release is drilled and published,
            # change this tag and SHA-256 in the same PR that updates DECISION.md's
            # inheritance anchor. Never rebuild or replace the 0.1.0-1 asset.
            asset_url="https://github.com/eriknewton/sanctuary-framework/releases/download/castle-wall-linux-0.1.0-1/sanctuary-castle-wall_0.1.0-1_amd64.deb"
            expected="0be0eedb7a3ba3f217a3e580b8d893b884d16291a10e79eb28ece3ac86ef8f5b"
            asset="$RUNNER_TEMP/castle-wall-linux-0.1.0-1.deb"
            curl -fsSL "$asset_url" -o "$asset"
            actual="$(sha256sum "$asset" | cut -d' ' -f1)"
            if [[ "$actual" != "$expected" ]]; then
              echo "published asset SHA-256 mismatch: expected $expected got $actual" >&2
              exit 1
            fi
            root="$RUNNER_TEMP/deb-inheritance"
            mkdir -p "$root/asset/fs" "$root/base/fs" "$root/head/fs"
            dpkg-deb -x "$asset" "$root/asset/fs"
            dpkg-deb -x "$ARCH_BASE_DEB" "$root/base/fs"
            dpkg-deb -x "$ARCH_HEAD_DEB" "$root/head/fs"
          python3 - "$root/asset/fs" "$root/base/fs" "$root/head/fs" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          asset, base, head = [Path(arg) for arg in sys.argv[1:]]
          compared = [
              "usr/local/libexec/sanctuary/castle-wall-daemon",
              "usr/local/libexec/sanctuary/protected-agent-v1",
              "usr/local/libexec/sanctuary/network-agent-standin",
              "usr/sbin/sanctuary-linux",
              "etc/systemd/system/sanctuary-castle-wall.service",
              "etc/systemd/system/sanctuary-agent@.service",
              r"etc/systemd/system/var-lib-sanctuary\x2dagent\x2dworkspace.mount",
              "usr/share/doc/sanctuary-castle-wall/schemas/contract.rs",
          ]
          printed_only = [
              "usr/share/doc/sanctuary-castle-wall/operator-guide.md",
              "usr/share/doc/sanctuary-castle-wall/build-identity",
          ]

          def digest(root: Path, rel: str) -> str | None:
              path = root / rel
              if not path.is_file():
                  return None
              return hashlib.sha256(path.read_bytes()).hexdigest()

          print("inheritance table against castle-wall-linux-0.1.0-1")
          print("path\tbase\thead\tasset")
          failed = False
          for rel in compared:
              asset_hash = digest(asset, rel)
              base_hash = digest(base, rel)
              head_hash = digest(head, rel)
              if asset_hash is None:
                  raise SystemExit(f"published asset missing expected row: {rel}")
              base_state = "MATCH" if base_hash == asset_hash else "DIFFERS"
              head_state = "MATCH" if head_hash == asset_hash else "DIFFERS"
              print(f"{rel}\t{base_state}\t{head_state}\t{asset_hash}")
              if base_state == "MATCH" and head_state != "MATCH":
                  failed = True
          print("printed without comparison")
          for rel in printed_only:
              print(f"{rel}\tbase={digest(base, rel)}\thead={digest(head, rel)}\tasset={digest(asset, rel)}")
          if failed:
              raise SystemExit("head differs from the published asset on a row base still matched")
          PY
          ) 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" == 0 ]]; then verdict=ok; else verdict=refused; fi
          {
            echo "ARCH_INHERITANCE=$verdict"
            echo "ARCH_INHERITANCE_LOG<<ARCH_INHERITANCE_EOF"
            cat "$log"
            echo "ARCH_INHERITANCE_EOF"
          } >>"$GITHUB_ENV"
          exit 0
      - name: Record gate disposition
        if: always()
        run: |
          case "${ARCH_SLICE_TOUCHED:-unset}" in
            yes)
              echo "deb-unchanged gate: ENFORCED (a trigger path changed between $ARCH_COMPARE_BASE and $GITHUB_SHA)"
              echo "allowlist verdict: ${ARCH_ALLOWLIST:-missing}"
              if [[ -n "${ARCH_ALLOWLIST_REFUSED:-}" ]]; then
                echo "allowlist refused paths:"
                printf '%s\n' "$ARCH_ALLOWLIST_REFUSED"
              fi
              echo "comparator verdict: ${ARCH_COMPARATOR:-missing}"
              if [[ -n "${ARCH_COMPARATOR_LOG:-}" ]]; then
                printf '%s\n' "$ARCH_COMPARATOR_LOG"
              fi
              echo "inheritance verdict: ${ARCH_INHERITANCE:-missing}"
              if [[ -n "${ARCH_INHERITANCE_LOG:-}" ]]; then
                printf '%s\n' "$ARCH_INHERITANCE_LOG"
              fi
              if printf '%s\n' "${ARCH_COMPARATOR_LOG:-}" | grep -q '^deb comparator: PASS declared delta:'; then
                declared="$(printf '%s\n' "$ARCH_COMPARATOR_LOG" | sed -n 's/^deb comparator: PASS declared delta: //p' | tail -n 1)"
                echo "deb-unchanged gate: ENFORCED, DECLARED DELTA: $declared"
              fi
              if [[ "${ARCH_ALLOWLIST:-missing}" != ok || "${ARCH_COMPARATOR:-missing}" != ok || "${ARCH_INHERITANCE:-missing}" != ok ]]; then
                exit 1
              fi
              ;;
            no) echo "deb-unchanged gate: NOT APPLICABLE (no Arch slice path changed between $ARCH_COMPARE_BASE and $GITHUB_SHA); the .deb inputs are gated by their own workflow" ;;
            *) echo "deb-unchanged gate: base resolution failed; see the Resolve comparison base step" >&2; exit 1 ;;
          esac
