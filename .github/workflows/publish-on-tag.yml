# Sanctuary npm Publish (manual dispatch)
#
# Copyright 2026 Erik Newton
# SPDX-License-Identifier: Apache-2.0
#
# Publish intent is separate from tag intent. A git tag push is a
# versioning operation (rc cut, audit point, rollback marker); it is
# not a shipping decision. This workflow runs only when a maintainer
# explicitly invokes "Run workflow" from the Actions tab and types
# the version string being published. The input must match the
# version in server/package.json at the checked-out SHA, or the job
# refuses to publish.
#
# History: the earlier on-tag trigger fired twice in the v1.0 rc
# cycle when the maintainer was not ready to ship. Both runs failed
# only because NPM_TOKEN was absent at the time. Once NPM_TOKEN is
# configured on the repo, an on-tag trigger would auto-publish on
# any future tag push, including rc cuts the maintainer did not
# intend to release. Requiring workflow_dispatch closes that gap.
#
# Authentication: npm Trusted Publishing (OIDC). No static NPM_TOKEN
# secret required. The GitHub Actions OIDC token is exchanged for a
# short-lived npm publish token at publish time. Configure the trusted
# publisher link at npmjs.com/package/@sanctuary-framework/mcp-server/access.
#
# See .github/RELEASING.md for the full release procedure.

name: Publish (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being published. Must match server/package.json at HEAD (example 1.0.1 or 1.0.0-rc.2)."
        required: true
        type: string
      ref:
        description: "Git ref to publish from (tag, branch, or SHA). Defaults to the selected branch when blank."
        required: false
        type: string
        default: ""

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # CSO-CICD-02 (supply-chain pin): release-triggered workflows call
      # third-party actions by immutable commit SHA, not a mutable tag, so a
      # hijacked upstream tag cannot inject code into this privileged job.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Verify dispatch input matches server/package.json version.
      #
      # Convention (enforced below):
      #   inputs.version  numeric semver, no `v` prefix (e.g. 1.1.4, 1.0.0-rc.2)
      #   inputs.ref      git ref, conventionally a tag with `v` prefix
      #                   (e.g. v1.1.4); blank defaults to the dispatched
      #                   branch ref. Branch and SHA refs are accepted to
      #                   support pre-release testing dispatches.
      #
      # The `version` vs `package.json` comparison is a strict bash string
      # equality (`[[ "$a" != "$b" ]]`). It is intentionally not a regex,
      # not a glob, and not a version-range comparator: a maintainer typing
      # `v1.1.4` instead of `1.1.4` should hit a loud failure here, not
      # silently publish under a coerced version. The explicit `v`-prefix
      # rejection below produces a clearer error message than relying on
      # the equality check alone.
      - name: Verify dispatch input matches server/package.json version
        id: verify-version
        run: |
          input_version="${{ inputs.version }}"
          pkg_version=$(node -p "require('./server/package.json').version")
          echo "Dispatch input version: ${input_version}"
          echo "Package version:        ${pkg_version}"
          if [[ -z "${input_version}" ]]; then
            echo "::error::Dispatch input 'version' is empty. Refusing to publish."
            exit 1
          fi
          # Reject `v` prefix explicitly so the maintainer gets a clear
          # error message instead of a generic does-not-match comparison.
          if [[ "${input_version}" == v* ]]; then
            echo "::error::Dispatch input 'version' starts with 'v' (got '${input_version}'). The version input must be the numeric form (e.g. 1.1.4), without the 'v' prefix. The 'ref' input is where the 'v'-prefixed tag goes."
            exit 1
          fi
          # Shape check: numeric semver with optional pre-release suffix.
          # Accepts: 1.0.0, 1.1.4, 1.0.0-rc.2, 2.0.0-beta.1, 1.0.0-alpha.10.
          # Rejects: latest, v1.0.0, 1.0, 1.0.0.0, anything with whitespace.
          if ! [[ "${input_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+(\.[0-9]+)?)?$ ]]; then
            echo "::error::Dispatch input 'version' (${input_version}) is not a valid numeric semver. Expected forms: 1.1.4 or 1.0.0-rc.2. Refusing to publish."
            exit 1
          fi
          if [[ "${input_version}" != "${pkg_version}" ]]; then
            echo "::error::Dispatch input version (${input_version}) does not match server/package.json version (${pkg_version}) at the checked-out ref. Refusing to publish."
            exit 1
          fi
          echo "version=${pkg_version}" >> "$GITHUB_OUTPUT"

      # Probe the ACTUAL input the sign step consumes, and fail closed.
      #
      # This runs BEFORE the install/test/build/publish steps so that a
      # missing key aborts the run in seconds — before the irreversible
      # `npm publish` — rather than discovering the gap after the package is
      # already live. The predicate probed here (step-level env
      # RELEASE_SIGNING_KEY, mapped from the repository secret of the same
      # name) reads the identical secrets expression the sign step's
      # SANCTUARY_RELEASE_SIGNING_KEY_B64URL is mapped from, so a pass here
      # means the key genuinely reaches the signing step; there is no
      # separate proxy that can drift. Only presence is probed; the value is
      # never printed (GitHub masks it regardless).
      #
      # CSO-CICD-01 (supply-chain pin): the secret is scoped with a
      # step-level `env:` here, not a job-level one, so it is present ONLY
      # for the duration of this probe step's process. It is out of scope
      # again for every later step until the dedicated "Sign + attach
      # release manifest" step re-declares it at step level. In particular
      # it is never in scope during "Install libsecret + Secret Service
      # backend" below, which runs unpinned-by-default third-party pip
      # installs; a compromised dependency executing there has no path to
      # this secret's value.
      - name: Require release signing key (fail closed)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "${RELEASE_SIGNING_KEY}" ]]; then
            echo "::error::The RELEASE_SIGNING_KEY repository secret is empty or is not reaching this step (checked the step-level env mapped from secrets.RELEASE_SIGNING_KEY). The release-signing key was activated 2026-07-01 and the shipped product pins its public half, so publishing WITHOUT a signed manifest would break the signed self-update path. Refusing to publish. Fix: restore the RELEASE_SIGNING_KEY secret (see .github/RELEASING.md) and re-run."
            exit 1
          fi
          echo "RELEASE_SIGNING_KEY is present in the repository secrets; the sign step will receive it."

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Release dependency pin check
        run: npm run check:release-dependency-pins

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        run: |
          python3 -m venv sidecars/concordia/.venv
          sidecars/concordia/.venv/bin/pip install --upgrade pip
          sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      - name: Type check
        working-directory: server
        run: npm run typecheck

      - name: Install libsecret + Secret Service backend
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-secret-service

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Build
        working-directory: server
        run: npm run build

      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          version="${{ steps.verify-version.outputs.version }}"
          # Pre-release versions (anything with a hyphen, e.g. 1.0.0-rc.1)
          # publish under the "next" dist-tag so `npx @sanctuary-framework/
          # mcp-server` keeps resolving to the stable release.
          if [[ "$version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        working-directory: server
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.tag }}"

      # Sign the release manifest and attach it to the GitHub Release.
      #
      # Custody = Option B (ratified 2026-07-01): the Ed25519 signing seed is a
      # GitHub Actions secret (RELEASE_SIGNING_KEY), base64url of the 32-byte
      # seed. The sign script reads it via SANCTUARY_RELEASE_SIGNING_KEY_B64URL,
      # never logs it, and zeroes it after signing.
      #
      # FAIL-CLOSED (2026-07-25): the release-signing key was ACTIVATED
      # 2026-07-01 and the product pins its public half
      # (PINNED_RELEASE_SIGNING_PUBLIC_KEY_B64URL in
      # server/src/release-manifest.ts). From activation onward, a publish
      # without a signed manifest is a DEFECT, so this step has no `if:` guard:
      # if the RELEASE_SIGNING_KEY secret is empty or stops reaching the job
      # (rotation, repo transfer, env-mapping regression), the sign script
      # exits non-zero and the run goes RED instead of green-with-a-skip.
      #
      # History: the original pre-activation design skipped this step when the
      # secret was empty, via a companion step NAMED "Signed manifest skipped
      # (no signing key configured)". After activation that companion step was
      # the one being skipped, so every healthy run's step list showed a
      # skipped row whose name read as "the signing was skipped" — a false
      # defect report generated by a step NAME asserting a condition it did not
      # probe. Both the skip step and the conditional are gone; a structural
      # test (server/test/structure/publish-workflow-signing-gate.test.ts)
      # keeps them gone.
      - name: Sign + attach release manifest
        working-directory: server
        env:
          SANCTUARY_RELEASE_SIGNING_KEY_B64URL: ${{ secrets.RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          npm run sign-release -- "$VERSION" --out release-manifest.json
          # Determine the release tag. Prefer the v-prefixed tag matching the
          # version; fall back to the checked-out ref if it is already a tag.
          tag="v${VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag not found; creating it."
            gh release create "$tag" --title "$tag" --notes "Automated release. Signed manifest attached." --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" release-manifest.json --clobber
          echo "Attached signed release-manifest.json to release $tag."
