# Sanctuary npm Publish (manual dispatch)
#
# Publish intent is separate from tag intent. A tag push never publishes. A
# maintainer must dispatch this workflow with the exact package version. Source
# is always the matching immutable v-prefixed tag. The artifact is packed ONCE and its bytes cross every
# trust zone unchanged: build -> sign -> stage -> npm publish -> finalize.

name: Publish (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric version to publish (for example 1.1.4 or 1.2.0-rc.1). Must match server/package.json."
        required: true
        type: string

env:
  # User-controlled dispatch data crosses into shell contexts only through this
  # env var, never through expression interpolation in a run script. After
  # validate-intent, pinned actions also receive it in typed `with:` inputs.
  RELEASE_VERSION: ${{ inputs.version }}
  # This value must match PINNED_RELEASE_SIGNING_PUBLIC_KEY_B64URL in
  # server/src/release-manifest.ts. The signer derives the public key from the
  # secret seed and refuses to sign if they differ.
  RELEASE_PUBLIC_KEY_B64URL: 61YBfiq_zlbTP5rl_r_msbPk40IXJL-_PuAxlpBVeF0

concurrency:
  group: sanctuary-npm-release
  cancel-in-progress: false

jobs:
  validate-intent:
    name: validate maintainer release intent
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Validate version shape without source code
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+(\.[A-Za-z0-9]+)*)?$ ]]; then
            echo "::error::version must be numeric semver without a v prefix"
            exit 1
          fi

  build-release:
    name: build exact release artifact
    needs: validate-intent
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false

      # The tag contains the product source being released. The workflow
      # definition that is actually executing can be newer, so inspect its
      # action refs independently instead of trusting only the tag's history.
      - name: Checkout executing workflow pin surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-workflow
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            .github/workflows
            scripts/check-release-action-pins.mjs
          sparse-checkout-cone-mode: false

      - name: Record immutable source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Validate release metadata
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./server/package.json').version")
          if [[ "$RELEASE_VERSION" != "$package_version" ]]; then
            echo "::error::input version ($RELEASE_VERSION) does not match server/package.json ($package_version)"
            exit 1
          fi

      # These stdlib-only checks run before npm or pip lifecycle code can
      # mutate the checkout. The inline comparison binds the currently
      # executing workflow's key to the product source at the release tag.
      - name: Release trust checks before dependency execution
        run: |
          npm run check:release-dependency-pins
          npm run check:release-action-pins
          npm run check:release-key-parity
          node trusted-workflow/scripts/check-release-action-pins.mjs --workflows-dir trusted-workflow/.github/workflows
          node -e 'const s=require("fs").readFileSync("server/src/release-manifest.ts","utf8"); const matches=[...s.matchAll(/^export const PINNED_RELEASE_SIGNING_PUBLIC_KEY_B64URL\s*=\s*\n\s*"([A-Za-z0-9_-]+)";\s*$/gm)]; if(matches.length!==1 || matches[0][1]!==process.env.RELEASE_PUBLIC_KEY_B64URL) { console.error("executing workflow key differs from tagged product key or product declaration is ambiguous"); process.exit(1); }'

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        run: |
          python3 -m venv sidecars/concordia/.venv
          sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      - name: Type check
        working-directory: server
        run: npm run typecheck

      - name: Install libsecret and Secret Service backend
        uses: ./.github/actions/setup-linux-secret-service

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Build
        working-directory: server
        run: npm run build

      - name: Pack once
        working-directory: server
        run: |
          set -euo pipefail
          npm pack --json --ignore-scripts > pack-result.json
          expected="sanctuary-framework-mcp-server-${RELEASE_VERSION}.tgz"
          node -e "const p=require('./pack-result.json'); if(p.length!==1 || p[0].filename!==process.argv[1]) process.exit(1)" "$expected"
          test -f "$expected"

      - name: Upload exact release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ github.run_id }}
          path: server/sanctuary-framework-mcp-server-${{ inputs.version }}.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 2

  sign-release:
    name: sign exact artifact in isolated job
    needs: build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # This job never installs or executes package dependencies. It checks out
      # the reviewed workflow commit only to obtain the two Node-stdlib scripts.
      - name: Checkout trusted release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release-artifact-lib.mjs
            scripts/sign-release-artifact.mjs
            scripts/verify-release-artifact.mjs
          sparse-checkout-cone-mode: false

      - name: Use pinned Node.js for isolated signing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-release-${{ github.run_id }}
          path: release

      - name: Sign artifact and prove pinned-key custody
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          node scripts/sign-release-artifact.mjs \
            --tarball "release/sanctuary-framework-mcp-server-${RELEASE_VERSION}.tgz" \
            --version "$RELEASE_VERSION" \
            --out release/release-manifest.json \
            --expected-public-key "$RELEASE_PUBLIC_KEY_B64URL"

      - name: Verify signed artifact before crossing trust zone
        run: |
          node scripts/verify-release-artifact.mjs \
            --tarball "release/sanctuary-framework-mcp-server-${RELEASE_VERSION}.tgz" \
            --manifest release/release-manifest.json \
            --version "$RELEASE_VERSION" \
            --expected-public-key "$RELEASE_PUBLIC_KEY_B64URL"

      - name: Upload signed release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ github.run_id }}
          path: release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  stage-release:
    name: stage private GitHub release
    needs: [build-release, sign-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ needs.build-release.outputs.source_sha }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Checkout trusted artifact verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release-artifact-lib.mjs
            scripts/verify-release-artifact.mjs
          sparse-checkout-cone-mode: false

      - name: Use pinned Node.js for staged artifact verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0

      - name: Download signed release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ github.run_id }}
          path: release

      - name: Verify tag still names the built commit
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tag_object=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha') || {
            echo "::error::GitHub API failed to resolve $TAG"
            exit 1
          }
          read -r object_type resolved <<< "$tag_object"
          for _ in {1..16}; do
            [[ "$object_type" == tag ]] || break
            tag_object=$(gh api "repos/${GH_REPO}/git/tags/${resolved}" --jq '.object.type + " " + .object.sha') || {
              echo "::error::GitHub API failed while peeling $TAG"
              exit 1
            }
            read -r object_type resolved <<< "$tag_object"
          done
          [[ "$object_type" == commit && "$resolved" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$resolved" != "$SOURCE_SHA" ]]; then
            echo "::error::$TAG moved after build (built $SOURCE_SHA, now $resolved)"
            exit 1
          fi

      - name: Verify exact artifact before staging
        run: |
          node scripts/verify-release-artifact.mjs \
            --tarball "release/sanctuary-framework-mcp-server-${RELEASE_VERSION}.tgz" \
            --manifest release/release-manifest.json \
            --version "$RELEASE_VERSION" \
            --expected-public-key "$RELEASE_PUBLIC_KEY_B64URL"

      - name: Create or reuse draft release and upload signed set
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > draft-state 2>/dev/null; then
            if [[ "$(cat draft-state)" != "true" ]]; then
              echo "::error::release $TAG is already public; refusing to overwrite it"
              exit 1
            fi
          else
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              prerelease_flag=--prerelease
            else
              prerelease_flag=
            fi
            gh release create "$TAG" --draft $prerelease_flag --verify-tag --target "$SOURCE_SHA" --title "$TAG" --notes "Release staged by the hardened publish workflow."
          fi
          gh release upload "$TAG" \
            release/release-manifest.json \
            "release/sanctuary-framework-mcp-server-${RELEASE_VERSION}.tgz" \
            --clobber
          expected_assets="release-manifest.json,sanctuary-framework-mcp-server-${RELEASE_VERSION}.tgz"
          actual_assets=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | sort | join(",")')
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "::error::draft release assets are not the exact two-file signed release set (got: $actual_assets)"
            exit 1
          fi
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "::error::release $TAG became public while assets were being staged"
            exit 1
          fi
          tag_object=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha') || {
            echo "::error::GitHub API failed to resolve $TAG after staging"
            exit 1
          }
          read -r object_type post_stage_sha <<< "$tag_object"
          for _ in {1..16}; do
            [[ "$object_type" == tag ]] || break
            tag_object=$(gh api "repos/${GH_REPO}/git/tags/${post_stage_sha}" --jq '.object.type + " " + .object.sha') || {
              echo "::error::GitHub API failed while peeling $TAG after staging"
              exit 1
            }
            read -r object_type post_stage_sha <<< "$tag_object"
          done
          [[ "$object_type" == commit && "$post_stage_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$post_stage_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::$TAG moved while the draft release was being staged"
            exit 1
          fi

  publish-release:
    name: publish exact tarball to npm
    needs: [build-release, sign-release, stage-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      # The only checked-out repository file is the reviewed, stdlib-only
      # verifier from the immutable workflow commit. No package source or
      # dependency is present in this OIDC-authorized job.
      - name: Checkout trusted artifact verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release-artifact-lib.mjs
            scripts/verify-release-artifact.mjs
          sparse-checkout-cone-mode: false

      - name: Use pinned Node.js for artifact verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0

      - name: Download signed release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ github.run_id }}
          path: release

      - name: Verify exact artifact before npm publication
        run: |
          node scripts/verify-release-artifact.mjs \
            --tarball "release/sanctuary-framework-mcp-server-${RELEASE_VERSION}.tgz" \
            --manifest release/release-manifest.json \
            --version "$RELEASE_VERSION" \
            --expected-public-key "$RELEASE_PUBLIC_KEY_B64URL"

      - name: Use Node.js 24 with npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          registry-url: "https://registry.npmjs.org"

      - name: Publish or verify already-published exact tarball
        run: |
          set -euo pipefail
          tarball="release/sanctuary-framework-mcp-server-${RELEASE_VERSION}.tgz"
          package="@sanctuary-framework/mcp-server@${RELEASE_VERSION}"
          local_integrity=$(node -e "const fs=require('fs'),c=require('crypto'); process.stdout.write('sha512-'+c.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$tarball")
          existing_integrity=$(npm view "$package" dist.integrity 2>/dev/null || true)
          if [[ -n "$existing_integrity" ]]; then
            if [[ "$existing_integrity" != "$local_integrity" ]]; then
              echo "::error::$package already exists but its registry integrity does not match the signed tarball"
              exit 1
            fi
            echo "$package is already published with the exact signed integrity; continuing idempotently."
          else
            if [[ "$RELEASE_VERSION" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
            npm publish "$tarball" --ignore-scripts --provenance --access public --tag "$dist_tag"
          fi

  finalize-release:
    name: make signed GitHub release visible
    needs: [build-release, publish-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ needs.build-release.outputs.source_sha }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Checkout trusted artifact verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release-artifact-lib.mjs
            scripts/verify-release-artifact.mjs
          sparse-checkout-cone-mode: false

      - name: Use pinned Node.js for final artifact verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0

      - name: Download and verify draft release bytes
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" \
            --pattern release-manifest.json \
            --pattern "sanctuary-framework-mcp-server-${RELEASE_VERSION}.tgz" \
            --dir release-assets
          node scripts/verify-release-artifact.mjs \
            --tarball "release-assets/sanctuary-framework-mcp-server-${RELEASE_VERSION}.tgz" \
            --manifest release-assets/release-manifest.json \
            --version "$RELEASE_VERSION" \
            --expected-public-key "$RELEASE_PUBLIC_KEY_B64URL"

      - name: Verify tag still names the built commit
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tag_object=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha') || {
            echo "::error::GitHub API failed to resolve $TAG before finalization"
            exit 1
          }
          read -r object_type resolved <<< "$tag_object"
          for _ in {1..16}; do
            [[ "$object_type" == tag ]] || break
            tag_object=$(gh api "repos/${GH_REPO}/git/tags/${resolved}" --jq '.object.type + " " + .object.sha') || {
              echo "::error::GitHub API failed while peeling $TAG before finalization"
              exit 1
            }
            read -r object_type resolved <<< "$tag_object"
          done
          [[ "$object_type" == commit && "$resolved" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$resolved" != "$SOURCE_SHA" ]]; then
            echo "::error::$TAG moved after build (built $SOURCE_SHA, now $resolved)"
            exit 1
          fi

      - name: Publish staged GitHub release
        run: |
          set -euo pipefail
          [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == "true" ]]
          expected_assets="release-manifest.json,sanctuary-framework-mcp-server-${RELEASE_VERSION}.tgz"
          actual_assets=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | sort | join(",")')
          [[ "$actual_assets" == "$expected_assets" ]]
          tag_object=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha') || {
            echo "::error::GitHub API failed to resolve $TAG immediately before publication"
            exit 1
          }
          read -r object_type final_sha <<< "$tag_object"
          for _ in {1..16}; do
            [[ "$object_type" == tag ]] || break
            tag_object=$(gh api "repos/${GH_REPO}/git/tags/${final_sha}" --jq '.object.type + " " + .object.sha') || {
              echo "::error::GitHub API failed while peeling $TAG immediately before publication"
              exit 1
            }
            read -r object_type final_sha <<< "$tag_object"
          done
          [[ "$object_type" == commit && "$final_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$final_sha" == "$SOURCE_SHA" ]]
          if [[ "$RELEASE_VERSION" != *-* ]]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false
          fi
          [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == "false" ]]
