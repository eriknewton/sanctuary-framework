name: Stranded fix report

# Branch-accumulation prevention, part 3.
# Part 1: `delete_branch_on_merge` (merged heads auto-delete).
# Part 2: `stale-branch-report.yml` (no-PR branches idle 60+ days).
# Part 3 (this): branches carrying a FIX that never shipped.
#
# Why part 2 was not enough. On 2026-08-04 a `fix(audit): align macos producer
# chain hash` commit was found on an unmerged drill branch from 2026-06-26. It was
# half the root cause of a HIGH durability defect (audit trail dead, daemon leaking
# to OOM) that cost a full session to re-diagnose six weeks later. The stale-branch
# report WOULD have listed that branch - and it did not help, because "stale
# branch" is a housekeeping signal people scroll past, while "unshipped fix" is a
# defect signal people act on. Same data, different question, very different
# response rate.
#
# The failure mode this targets: a fix authored during a drill has no owner once
# the drill ends. The drill answers its question, the branch looks finished, and
# the fix on it silently never ships. Age-based scanning is structurally blind to
# it - a four-day-old drill branch looks healthy while already orphaned.
#
# Report-only: never deletes or modifies a branch. Findings open/update a tracking
# ISSUE rather than a step summary, because the 2026-08-04 miss proved a summary
# on a scheduled run is not a control.

on:
  schedule:
    - cron: "31 8 * * 1" # Mondays 08:31 UTC, just after the stale-branch report
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: stranded-fix-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git cherry needs full history on both sides

      - name: Fetch all branches
        run: git fetch --quiet --prune origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Detect stranded fixes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=$(bash scripts/stranded-fix-report.sh "${{ github.repository }}")
          printf '%s\n' "$out" > /tmp/stranded.txt
          if [ "$(head -1 /tmp/stranded.txt)" = "CLEAN" ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Stranded fix report ($(date -u +%F))"
            echo
            if [ "$(head -1 /tmp/stranded.txt)" = "CLEAN" ]; then
              echo "_No unshipped fixes on unmerged branches._"
            else
              echo "Fix-type commits that exist on a branch but **not on main**, where the"
              echo "branch has no open PR and no merged PR. Each line is a correctness or"
              echo "security change that is still in the wild."
              echo
              tail -n +2 /tmp/stranded.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the tracking issue
        if: steps.detect.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Stranded fixes: unshipped fix commits on unmerged branches"
          body_file=/tmp/issue_body.md
          {
            echo "Each entry is a \`fix\`/\`harden\`/\`sec\`/\`perf\` commit that exists on a branch"
            echo "but **not on main**, where the branch has no open PR and no merged PR."
            echo "These are correctness or security changes that never shipped."
            echo
            tail -n +2 /tmp/stranded.txt
            echo
            echo "**Each line needs one of three dispositions:**"
            echo "1. Still wanted → rebase onto main and open a PR."
            echo "2. Superseded → confirm the fix landed by another route, then delete the branch."
            echo "3. Abandoned → delete the branch, and say why in the PR or here."
            echo
            echo "Do not close this issue by deleting branches without checking (2) first."
            echo "The precedent: a macOS audit chain-hash fix sat unmerged for six weeks and"
            echo "cost a full session to re-diagnose."
            echo
            echo "_Generated by \`.github/workflows/stranded-fix-report.yml\` on $(date -u +%F). Report-only._"
          } > "$body_file"

          existing=$(gh issue list --repo "$REPO" --state open --limit 50 \
            --search "in:title \"$title\"" --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | .[0].number // empty")

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body-file "$body_file"
            gh issue comment "$existing" --repo "$REPO" \
              --body "Refreshed $(date -u +%F): $(head -1 /tmp/stranded.txt | sed 's/FINDINGS://') stranded fix(es) still unshipped."
          else
            gh issue create --repo "$REPO" --title "$title" --body-file "$body_file"
          fi

      - name: Close the tracking issue when clean
        if: steps.detect.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Stranded fixes: unshipped fix commits on unmerged branches"
          existing=$(gh issue list --repo "$REPO" --state open --limit 50 \
            --search "in:title \"$title\"" --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" \
              --comment "No stranded fixes as of $(date -u +%F). Reopens automatically if any reappear."
          fi
