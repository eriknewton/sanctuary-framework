# Sanctuary Secret Scan
#
# Copyright 2026 Erik Newton
# SPDX-License-Identifier: Apache-2.0
#
# SECRETS-POLICY-001: run gitleaks against every PR and every push to main so a
# leaked credential is caught in CI, not only by GitHub's after-the-fact secret
# scanning. The same policy file (.gitleaks.toml at repo root) is runnable
# locally — `gitleaks detect --config .gitleaks.toml --no-banner` (install with
# `brew install gitleaks`) — so contributors catch secrets BEFORE pushing.
#
# Findings fail the job (gitleaks exits non-zero), making this a real gate.
# It is NOT yet wired as a required status check in branch protection; that is
# a separate decision for the maintainer.
#
# Note on licensing: gitleaks-action is free for repos owned by a personal
# account (this repo, eriknewton/sanctuary-framework). No GITLEAKS_LICENSE
# secret is required. If the repo ever moves under an organization account, a
# free license key from gitleaks.io must be added as the GITLEAKS_LICENSE
# secret. See https://github.com/gitleaks/gitleaks-action#readme.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: gitleaks only needs to read the checked-out repo. PR
# commenting is disabled below (GITLEAKS_ENABLE_COMMENTS=false), so no
# pull-requests:write is granted.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so push-event scans cover the whole pushed range, not
          # just the tip commit.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the repo-root policy that also runs locally.
          GITLEAKS_CONFIG: .gitleaks.toml
          # Keep the job read-only: do not post PR comments (would need
          # pull-requests:write). The job-failure + run logs are the signal.
          GITLEAKS_ENABLE_COMMENTS: "false"
