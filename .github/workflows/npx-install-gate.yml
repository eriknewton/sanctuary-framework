# Sanctuary npx Install Gate
#
# Copyright 2026 Erik Newton
# SPDX-License-Identifier: Apache-2.0
#
# Recurrence gate for the v1.4.0..v1.6.0 install-path regression: bare
# `npx @sanctuary-framework/mcp-server` failed with "could not determine
# executable to run" for three consecutive releases because nothing in CI
# ever exercised the literal install command users are told to run.
#
# npm's multi-bin resolution auto-selects an executable only when all bin
# values point at the same file (the alias rule that carried v1.3.x) or
# when a bin name matches the package's unscoped name (`mcp-server`).
# v1.4.0 broke the former by adding a bin with a distinct target. This job packs
# the server exactly as `npm publish` would, then runs the packed tarball
# through `npx` with a guaranteed-cold npm cache and asserts that the
# bare form resolves, exits 0, and prints the package version on stdout.
# It fails on the pre-fix bin map and passes with it (verified locally by
# stashing the fix).

name: npx install gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bare-npx-resolves:
    name: bare-npx-resolves
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Build dist
        working-directory: server
        run: npm run build

      - name: Pack the publishable tarball
        id: pack
        working-directory: server
        run: |
          tgz=$(npm pack --silent | tail -1)
          if [[ ! -f "$tgz" ]]; then
            echo "::error::npm pack did not produce a tarball (got: '$tgz')"
            exit 1
          fi
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "Packed: $tgz"

      - name: Bare npx resolves and reports the version (cold cache)
        working-directory: server
        run: |
          expected=$(node -p "require('./package.json').version")
          # Fresh cache dir so npx cannot satisfy the run from a warm
          # cache; this is the cold-resolution path real users hit.
          cold_cache=$(mktemp -d)
          set +e
          out=$(npm_config_cache="$cold_cache" npx -y "./${{ steps.pack.outputs.tgz }}" --version)
          status=$?
          set -e
          echo "exit status: $status"
          echo "stdout: $out"
          if [[ $status -ne 0 ]]; then
            echo "::error::bare npx run of the packed tarball failed (exit $status). The bin map no longer resolves for the bare package name; see .github/workflows/npx-install-gate.yml header."
            exit 1
          fi
          if [[ "$out" != *"$expected"* ]]; then
            echo "::error::bare npx run succeeded but did not print the package version. expected substring: '$expected', stdout: '$out'"
            exit 1
          fi
          echo "OK: bare npx resolved and printed version $expected"
