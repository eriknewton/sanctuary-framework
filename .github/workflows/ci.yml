name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Release dependency pin check
        run: npm run check:release-dependency-pins

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        # --require-hashes enforces that every dependency in requirements.txt is
        # pinned with a SHA256 hash. A compromised PyPI release that replaces the
        # tarball under the same version is rejected at install time. Regenerate
        # hashes on Concordia version bump per sidecars/concordia/README.md.
        run: |
          python3 -m venv sidecars/concordia/.venv
          sidecars/concordia/.venv/bin/pip install --upgrade pip
          sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      - name: Type check
        working-directory: server
        run: npm run typecheck

      - name: Console-discipline gate (no unannotated console.* in src/)
        working-directory: server
        # Closes full-sweep #97. Asserts every console.log/warn/error/etc.
        # in non-test TypeScript under server/src/ is either annotated with
        # a `// SAFETY:` comment or lives inside a template literal
        # (browser-side JS embedded in HTML). Doc:
        # server/docs/logging-discipline.md.
        run: npx tsx scripts/check-no-raw-console.ts

      - name: Build (populates dist/templates for tarball tests)
        working-directory: server
        run: npm run build

      - name: Run SDW memory-provider sidecar tests (cross-agent isolation gate)
        # Gates the sanctuary-memory provider's pytest suite in CI so the
        # cross-agent memory isolation test (and the no-unselected-persistence
        # + content-hash + delete-pending-approval tests) guard future changes.
        # Runs once (node 24 only); the provider is pure-stdlib so pytest is the
        # only dependency. Tests use the in-process stub layer (no live server,
        # no keychain).
        if: matrix.node-version == 24
        run: |
          cd sidecars/sanctuary-memory
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pytest==8.4.2
          .venv/bin/python -m pytest -q

      - name: Install libsecret + Secret Service backend
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-secret-service

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Run security tests
        working-directory: server
        run: npm run test:security

      - name: Zero-PII regression gate
        working-directory: server
        run: npm run test:zero-pii-regression

      - name: QLA performance budget gate
        working-directory: server
        run: npm run test:qla-perf-budget

  lint:
    # ESLint was wired and the floating-promise backlog driven to zero, but no
    # workflow ran it, so an error-level regression could land silently. This
    # lightweight job (no sidecar/build needed) locks in "zero eslint warnings"
    # on every PR: `npm run lint` runs `eslint src/ --max-warnings 0`, so a NEW
    # warning (not just an error) fails the required `lint` check. The 3 prior
    # deferred warnings were cleared (real fixes for the no-explicit-any and
    # no-useless-assignment items; a scoped, security-justified inline-disable
    # for the FIXED_DENIAL_MESSAGE preserve-caught-error item that must not
    # thread the caught error through `cause`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: ESLint (src/)
        working-directory: server
        run: npm run lint
