name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        run: |
          python3 -m venv sidecars/concordia/.venv
          sidecars/concordia/.venv/bin/pip install --upgrade pip
          sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        working-directory: server
        # Step-level `timeout-minutes` is the fail-fast backstop. A cold
        # `--with-deps chromium webkit` install (browser download plus apt
        # system libs) runs about 8 to 12 minutes, so 18 leaves healthy
        # headroom while killing the kind of CDN hang that ran 110+ min on the
        # 2026-05-29 run (workflow run 26653595266). On a cache hit the browser
        # download is skipped and this finishes in seconds. No inner retry: a
        # healthy install must not be cut short, and the cache plus a re-run
        # cover a transient CDN blip.
        timeout-minutes: 18
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright e2e tests
        working-directory: server
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: server/playwright-report/
          retention-days: 14
