name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        run: |
          python3 -m venv sidecars/concordia/.venv
          sidecars/concordia/.venv/bin/pip install --upgrade pip
          sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        working-directory: server
        # `timeout-minutes` is the hard backstop; the per-attempt `timeout`
        # plus a single retry recover from a stuck CDN without waiting out the
        # ~6h job limit (this step hung 110+ min on the 2026-05-29 run,
        # workflow run 26653595266). On a cache hit the browser download is
        # skipped, so the command finishes in seconds.
        timeout-minutes: 14
        run: |
          set -e
          for attempt in 1 2; do
            if timeout -k 30 360 npx playwright install --with-deps chromium webkit; then
              echo "Playwright browsers installed (attempt $attempt)."
              exit 0
            fi
            echo "::warning::Playwright install attempt $attempt failed or timed out; retrying in 10s..."
            sleep 10
          done
          echo "::error::Playwright install failed after 2 attempts."
          exit 1

      - name: Run Playwright e2e tests
        working-directory: server
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: server/playwright-report/
          retention-days: 14
