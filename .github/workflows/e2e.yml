name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read @playwright/test version from server/package.json
        id: detect
        run: |
          RAW="$(node -p "require('./server/package.json').devDependencies['@playwright/test']")"
          # Strip any semver range prefix (^, ~) defensively; the value should
          # already be an exact pin, but dependabot or a manual edit could
          # reintroduce a range.
          VERSION="${RAW#^}"
          VERSION="${VERSION#~}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: playwright-version
    runs-on: ubuntu-22.04
    # Run inside the official Playwright image so chromium/webkit are pre-baked
    # and version-matched to @playwright/test. The image tag is derived above
    # from server/package.json's devDependencies["@playwright/test"] (the
    # playwright-version job), not hardcoded, so a dependabot bump to the
    # package version automatically pulls the matching image on the next run.
    # This eliminates the cdn.playwright.dev browser download that reliably
    # stalled in CI (3x480s all timed out on the chromium zip), so there is no
    # install or cache step: the browsers ship in the image and Playwright
    # finds them via the image's PLAYWRIGHT_BROWSERS_PATH. If a bump lands
    # before Microsoft has published a matching tag, the container pull fails
    # loud (image-not-found) rather than silently mismatching versions.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # CI-APT-RESILIENCE-01: both pip installs are routed through the
      # shared retry-with-timeout.sh wrapper (same fix applied to every
      # apt-get site after the 2026-08-19 hang incident, extended here to
      # pip since an unbounded network install can hang the same way).
      - name: Provision Concordia sidecar venv
        timeout-minutes: 20
        run: |
          python3 -m venv sidecars/concordia/.venv
          scripts/ci/retry-with-timeout.sh "pip upgrade (concordia venv)" -- \
            sidecars/concordia/.venv/bin/pip install --upgrade pip
          scripts/ci/retry-with-timeout.sh "pip install (concordia venv, hash-pinned)" -- \
            sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      - name: Run Playwright e2e tests
        working-directory: server
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: server/playwright-report/
          retention-days: 14
