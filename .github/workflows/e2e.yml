name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-22.04
    # Run inside the official Playwright image so chromium/webkit are pre-baked
    # and version-matched to @playwright/test 1.59.1. This eliminates the
    # cdn.playwright.dev browser download that reliably stalled in CI (3x480s
    # all timed out on the chromium zip), so there is no install or cache step:
    # the browsers ship in the image and Playwright finds them via the image's
    # PLAYWRIGHT_BROWSERS_PATH. Keep this tag in lockstep with the
    # @playwright/test version in server/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        run: |
          python3 -m venv sidecars/concordia/.venv
          sidecars/concordia/.venv/bin/pip install --upgrade pip
          sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      - name: Run Playwright e2e tests
        working-directory: server
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: server/playwright-report/
          retention-days: 14
