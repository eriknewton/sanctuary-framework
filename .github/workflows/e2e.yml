name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        run: |
          python3 -m venv sidecars/concordia/.venv
          sidecars/concordia/.venv/bin/pip install --upgrade pip
          sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        working-directory: server
        # CDN stalls on the webkit/chromium download are transient. Each attempt
        # gets its own 480s (8 min) hard timeout so a single hung download is
        # killed and retried instead of consuming the whole step budget; the
        # earlier no-retry version failed the job on one transient hang. Three
        # attempts at 8 min each = 24 min worst case, under the 26-min step cap
        # and the 30-min job cap. The browser cache makes a warm run finish in
        # seconds, so the retry budget is only ever spent on a genuine cold stall.
        timeout-minutes: 26
        run: |
          for attempt in 1 2 3; do
            echo "Playwright install attempt ${attempt}/3"
            if timeout 480 npx playwright install --with-deps chromium webkit; then
              echo "Playwright install succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt} timed out or failed (up to 480s); retrying"
          done
          echo "Playwright install failed after 3 attempts"
          exit 1

      - name: Run Playwright e2e tests
        working-directory: server
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: server/playwright-report/
          retention-days: 14
