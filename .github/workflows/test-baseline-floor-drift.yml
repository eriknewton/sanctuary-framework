# Sanctuary fallback-floor decay backstop
#
# Copyright 2026 Erik Newton
# SPDX-License-Identifier: Apache-2.0
#
# The floor a pull request is held to is normally the count the default branch
# published to the Actions cache. `.test-baseline` in the tree is the FALLBACK:
# the floor used when no cached count is available (a first run, an evicted
# entry, a restricted fork pull request). It is slow-moving by design and humans
# update it rarely.
#
# A fallback nobody looks at decays. This job watches it, and it is the only
# thing that does. Two states are news:
#
#   - the fallback sitting ABOVE a fresh count on the default branch, which
#     would red every pull request that falls back to it with a regression that
#     is not one, and
#   - a gap below a fresh count that is both large and old, which means the
#     fallback would protect almost nothing on the day the cache is missing.
#
# An ordinary gap is not news. Alarming on every gap would train everyone to
# ignore this check, and the fallback is meant to lag.
#
# BOUND, so nobody reads this as more than it is: this job compares one count
# taken on one day. It says nothing about the days between runs, and it does not
# observe the cached floor at all, which is the floor actually in force almost
# always.
#
# It is deliberately not a required status check and gates no merge. It is an
# alarm, and an alarm that blocks work gets disabled.

name: Test Baseline Floor Drift

on:
  schedule:
    # Daily, mid-morning UTC. The cadence and the grace window below are a pair;
    # changing one without the other either pages on drift that is about to fix
    # itself or lets real drift sit for an extra day.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  floor-drift:
    name: floor-drift
    runs-on: ubuntu-latest

    env:
      # How long the committed fallback may lag before its gap counts as decay.
      # A week, because the fallback is a floor of last resort that humans touch
      # rarely; anything shorter turns this into a weekly chore rather than an
      # alarm.
      FALLBACK_MAX_AGE_HOURS: "168"
      # How far below a fresh count the fallback may sit before its size counts
      # as decay, independent of age. This is exactly the number of deletions
      # that would pass unnoticed on a day the cached floor is unavailable, so
      # it is the quantity worth capping.
      FALLBACK_MAX_GAP: "250"

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          # The drift age is read from commit history. A shallow clone reports
          # an age of zero, which reads as "no drift" and would make this alarm
          # silently useless while continuing to pass.
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        # --require-hashes enforces that every dependency in requirements.txt is
        # pinned with a SHA256 hash, matching the guard workflow. A sidecar that
        # fails to install silently removes the tests that need it, which would
        # show up here as drift rather than as an install failure if this step
        # were allowed to continue.
        run: |
          python3 -m venv sidecars/concordia/.venv
          sidecars/concordia/.venv/bin/pip install --upgrade pip
          sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      - name: Build
        working-directory: server
        run: npm run build

      - name: Install libsecret + Secret Service backend
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-secret-service

      - name: Run the suite and capture output
        working-directory: server
        # Must match the capture environment in test-baseline-guard.yml: the
        # shared parser in scripts/test-baseline-floor.sh reads an ANSI-free
        # summary line, and a coloured run would make it refuse.
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/vitest-output.log
          exit "${PIPESTATUS[0]}"

      - name: Compare the committed fallback against a fresh count
        run: |
          # 3600 seconds per hour; the window itself is named in env above.
          max_age_seconds=$(( FALLBACK_MAX_AGE_HOURS * 3600 ))
          fallback="$(scripts/test-baseline-floor.sh read-floor .test-baseline)"
          observed="$(scripts/test-baseline-floor.sh parse-count /tmp/vitest-output.log)"
          age="$(scripts/test-baseline-floor.sh drift-age-seconds .test-baseline)"
          echo "Committed fallback: $fallback"
          echo "Fresh count:        $observed"
          echo "Fallback age:       ${age}s (max ${max_age_seconds}s, max gap $FALLBACK_MAX_GAP)"
          set +e
          verdict="$(scripts/test-baseline-floor.sh fallback-drift-verdict "$fallback" "$observed" "$age" "$max_age_seconds" "$FALLBACK_MAX_GAP" 2>&1)"
          status=$?
          set -e
          echo "$verdict"
          if [[ "$status" -ne 0 ]]; then
            echo "::error::The committed fallback floor needs attention. See the run log for the counts."
            exit "$status"
          fi
