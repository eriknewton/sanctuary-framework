name: Castle Wall macOS

# Builds and unit-tests the Castle Wall macOS system extension. Alpha-1
# shipped the foundation scaffold (NEFilterProvider subclass + UDS IPC
# client + Ed25519 handshake verification). Alpha-2 (this build) adds the
# packet filter logic + manifest sync + flow cache + new IPC notifications.
# Loaded-extension scenarios CANNOT be exercised in CI because Apple's
# sysextd requires interactive user approval; those tests land in Alpha-3
# alongside the audit-emit pipeline.
#
# Per the spawn prompt: no code signing in CI. Real signing happens
# during local development (Apple Developer ID YFQSWQ9BJN) and in the
# Alpha-4 release flow.

on:
  push:
    branches: [main]
    paths:
      - "castle-wall-macos/**"
      - "server/src/castle-wall/**"
      - "server/src/cli/castle-wall.ts"
      - ".github/workflows/castle-wall-macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "castle-wall-macos/**"
      - "server/src/castle-wall/**"
      - "server/src/cli/castle-wall.ts"
      - ".github/workflows/castle-wall-macos.yml"

permissions:
  contents: read

jobs:
  castle-wall-macos:
    # The enforcement package (sysext, host app, packet filter, IPC library)
    # has a macOS-13 floor and NO Apple Containerization dependency (that VM
    # runtime now lives in the sibling `castle-wall-vmm` package, built on
    # macos-26 by castle-wall-vmm.yml). Building here on macos-latest is the
    # regression guard for the floor itself: it proves the shipped sysext still
    # compiles on the Xcode/Swift toolchain operators actually run, so the
    # macOS-26-only build bug (A1 drill, 2026-06-04) cannot recur.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # Compile-check via SwiftPM (lesson #77: swift build --build-tests + swift
      # test is the canonical gate; xcodebuild scheme builds are not used —
      # SwiftPM auto-generated executable schemes are not test-action-configured,
      # and the 6.2 tools version needs Xcode 26's toolchain anyway).
      - name: swift build (compile all targets + tests)
        working-directory: castle-wall-macos
        run: swift build --build-tests

      - name: swift test (run XCTest suites via SwiftPM)
        working-directory: castle-wall-macos
        # SwiftPM auto-generated schemes for executable targets are NOT
        # configured for the test action; xcodebuild test refuses with
        # "Scheme is not currently configured for the test action."
        # `swift test` is the canonical SwiftPM test runner and works
        # against the same Package.swift on macos-latest. Running without
        # a filter exercises CastleWallIPCTests (Alpha-1 wire vectors) +
        # CastleWallExtensionTests (Alpha-2 manifest store + allowlist
        # evaluator + flow cache + IPC bridge notifications + filter
        # provider verdict glue + Alpha-3 ExtensionDispatcher).
        run: swift test

      - name: assemble unsigned .app bundle (CI parity with operator build)
        working-directory: castle-wall-macos
        # The build-signed.sh script's signing path is intentionally
        # skipped in CI: macos-26 runners do not have the operator's
        # Developer-ID Application cert in their keychain, and shipping
        # the cert into CI would expose it to the workflow's broad
        # action permissions. CI runs only assembly + structure checks;
        # codesign verification happens in operator-side release builds
        # via build-signed.sh.
        run: |
          swift build -c release
          BUILT_EXEC="$(swift build -c release --show-bin-path)/CastleWallExtension"
          test -x "$BUILT_EXEC" || { echo "missing built executable" >&2; exit 1; }
          mkdir -p build/CastleWallExtension.app/Contents/MacOS
          cp "$BUILT_EXEC" build/CastleWallExtension.app/Contents/MacOS/CastleWallExtension
          cp Sources/CastleWallExtension/Info.plist build/CastleWallExtension.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable CastleWallExtension" \
            build/CastleWallExtension.app/Contents/Info.plist || true

      - name: verify .app bundle structure + entitlements + adhoc sign
        working-directory: castle-wall-macos
        # Structure invariants the operator can run independently:
        # Info.plist parses, executable is Mach-O, the NetworkExtension
        # entitlement is on disk for the signing step the operator's
        # release build performs. Adhoc-signing the assembled bundle
        # exercises the structural codesign invariants (CodeResources
        # presence, _CodeSignature layout) in CI without exposing any
        # operator signing material to the workflow.
        run: |
          plutil -lint build/CastleWallExtension.app/Contents/Info.plist
          file build/CastleWallExtension.app/Contents/MacOS/CastleWallExtension | grep -q "Mach-O" \
            || { echo "executable is not Mach-O" >&2; exit 1; }
          plutil -lint Sources/CastleWallExtension/CastleWallExtension.entitlements
          /usr/libexec/PlistBuddy -c \
            "Print :com.apple.developer.networking.networkextension" \
            Sources/CastleWallExtension/CastleWallExtension.entitlements | \
            grep -q "content-filter-provider-systemextension" \
            || { echo "missing content-filter-provider-systemextension entitlement" >&2; exit 1; }
          codesign --force --sign - --timestamp=none build/CastleWallExtension.app
          codesign --verify --deep --strict --verbose=2 build/CastleWallExtension.app
