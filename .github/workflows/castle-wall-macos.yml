name: Castle Wall macOS

# Builds and unit-tests the Castle Wall macOS system extension. Alpha-1
# shipped the foundation scaffold (NEFilterProvider subclass + UDS IPC
# client + Ed25519 handshake verification). Alpha-2 (this build) adds the
# packet filter logic + manifest sync + flow cache + new IPC notifications.
# Loaded-extension scenarios CANNOT be exercised in CI because Apple's
# sysextd requires interactive user approval; those tests land in Alpha-3
# alongside the audit-emit pipeline.
#
# Per the spawn prompt: no code signing in CI. Real signing happens
# during local development (Apple Developer ID YFQSWQ9BJN) and in the
# Alpha-4 release flow.

on:
  push:
    branches: [main]
    paths:
      - "castle-wall-macos/**"
      - "server/src/castle-wall/**"
      - ".github/workflows/castle-wall-macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "castle-wall-macos/**"
      - "server/src/castle-wall/**"
      - ".github/workflows/castle-wall-macos.yml"

jobs:
  castle-wall-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: xcodebuild list (verify SwiftPM scheme generation)
        working-directory: castle-wall-macos
        run: xcodebuild -list

      - name: xcodebuild build (CastleWallExtension scheme)
        working-directory: castle-wall-macos
        run: |
          xcodebuild build \
            -scheme CastleWallExtension \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: swift test (run XCTest suites via SwiftPM)
        working-directory: castle-wall-macos
        # SwiftPM auto-generated schemes for executable targets are NOT
        # configured for the test action; xcodebuild test refuses with
        # "Scheme is not currently configured for the test action."
        # `swift test` is the canonical SwiftPM test runner and works
        # against the same Package.swift on macos-latest. Running without
        # a filter exercises both CastleWallIPCTests (Alpha-1) and
        # CastleWallExtensionTests (Alpha-2 manifest store + allowlist
        # evaluator + flow cache + IPC bridge notifications + filter
        # provider verdict glue).
        run: swift test
