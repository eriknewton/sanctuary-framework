# Sanctuary Test Baseline Guard
#
# Copyright 2026 Erik Newton
# SPDX-License-Identifier: Apache-2.0
#
# One job, one read-only token, and a number that travels between runs through
# the Actions cache instead of through the repository:
#
#   On a pull request  Restore the count the default branch last published and
#                      use it as the floor. The observed passing count must not
#                      be BELOW it, alongside the unchanged gates (typecheck, no
#                      transform or collection error, no silent test-file drop,
#                      zero failures). A count above the floor is the normal
#                      resting state of a change that adds tests, and it passes.
#
#   On a push to main  Publish the observed count to that cache after the suite
#                      runs. No commit, no branch write, no pull request, no
#                      ruleset interaction, and nothing beyond the default token.
#
# WHY A PULL REQUEST DOES NOT CARRY THE INTEGER: the floor is the passing count
# on Linux CI, which an author on macOS cannot compute. Asking every pull request
# to state it made the number a guess; on 2026-08-19 three of three open pull
# requests guessed it wrong, and the remedy each time was to read the number out
# of a failed run and push it back.
#
# THE HONEST BOUND, which must not be softened anywhere it is repeated: a pull
# request fails when its count is below THE FLOOR IN FORCE. The floor in force is
# main most recent completed CI count when a cache entry is available, and the
# committed fallback in .test-baseline otherwise. While a floor is stale by D, a
# change can delete up to D passing tests and still pass. Publishing happens on
# every push to main, so D is normally zero once that run completes, but it is
# not zero by construction. Do not describe the regression property as
# "unchanged" from the old rule; it is not.
#
# THE FALLBACK IS NEVER SILENT. When no usable cached count is available (a first
# run, an evicted entry, a restricted fork pull request), the committed integer
# in .test-baseline is used and the job log says so in as many words. That file
# stays in the tree precisely so there is always a floor, and humans update it
# rarely rather than every pull request. The scheduled check in
# .github/workflows/test-baseline-floor-drift.yml reports when it has decayed far
# enough to be worth little.
#
# CACHE SCOPE, verified in this repository rather than assumed: a run triggered
# by pull_request restores caches created on the default branch. Pull request
# 1281 restored node-cache-Linux-x64-npm-7efea387..., a key that exists under
# refs/heads/main and not under that pull request's own ref.
#
# This job is DELIBERATELY separate from the `test` matrix in ci.yml so it can be
# named as a distinct required status check. See
# docs/audit/branch-protection-setup.md and
# docs/audit/test-baseline-hardening-plan.md. The local convenience copy of the
# pull-request side is .githooks/pre-commit.

name: Test Baseline Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only, everywhere, with no job-level override anywhere in this file. The
# floor mechanism needs no write authority at all: the count travels through the
# Actions cache, which the default token may write without any permission grant,
# and the cache is scoped to the branch that wrote it. The self-test at
# scripts/test-baseline-floor-self-test.sh asserts that no `write` permission
# appears here, because a future edit that reintroduces one would also
# reintroduce the whole class of question this design exists to avoid.
#
# External actions stay pinned to immutable commit SHAs even though this
# workflow is no longer privileged. A tag is a mutable pointer, and re-floating
# these would be a silent downgrade.
permissions:
  contents: read

jobs:
  test-baseline-guard:
    name: test-baseline-guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the deliberate-lowering annunciation below diffs
          # against the base branch, and a shallow clone cannot.
          fetch-depth: 0

      # Runs before the Node setup on purpose: it drives the floor script
      # against disposable fixtures, needs no dependencies, takes seconds, and a
      # broken floor guard should red before two minutes of install.
      #
      # This step is the self-test's only consumer. A harness nothing invokes is
      # a harness that cannot notice its own guard being reverted.
      - name: Self-test the floor decision logic
        run: bash scripts/test-baseline-floor-self-test.sh

      # The shared locations, read from the script so no workflow spells them
      # out. A prefix that agrees on only one side is a floor that silently
      # never loads: the restore misses, the fallback quietly takes over, and
      # everything stays green while asserting less than it should.
      - name: Resolve the shared cache locations
        id: cachedef
        run: |
          {
            echo "prefix=$(scripts/test-baseline-floor.sh cache-key-prefix)"
            echo "dir=$(scripts/test-baseline-floor.sh cache-dir)"
            echo "file=$(scripts/test-baseline-floor.sh cache-file)"
          } >> "$GITHUB_OUTPUT"

      # Restore the count the default branch last published. The primary key is
      # deliberately one that is never written, so this always falls through to
      # the prefix match, which returns the most recently created entry.
      #
      # Failure mode note: a miss here is NOT an error and does not fail the
      # step. It routes the gate to the committed fallback, which the next step
      # announces in the log. Silence would be the bug.
      - name: Restore the published floor
        id: floorcache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ${{ steps.cachedef.outputs.dir }}
          key: baseline-floor-main-lookup-only-never-written
          restore-keys: ${{ steps.cachedef.outputs.prefix }}

      - name: Determine the floor in force
        id: baseline
        env:
          CACHE_FILE: ${{ steps.cachedef.outputs.file }}
        run: |
          cached=""
          if [[ -f "$CACHE_FILE" ]]; then
            cached="$(tr -d '[:space:]' < "$CACHE_FILE")"
          fi
          fallback="$(scripts/test-baseline-floor.sh read-floor .test-baseline)"
          # effective-floor prints the number on stdout and its reasoning on
          # stderr, which the runner shows in the log. The reasoning is the part
          # that keeps a fallback from ever being preferred silently.
          baseline="$(scripts/test-baseline-floor.sh effective-floor "$fallback" "$cached")"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "Committed fallback: $fallback"
          echo "Cached count:       ${cached:-<none>}"
          echo "Floor in force:     $baseline"

      # A pull request that changes .test-baseline is the deliberate-lowering
      # path, which is human and reviewed. Since routine pull requests no longer
      # touch the file at all, its appearance in a diff is now a review signal
      # rather than background noise. This annunciates; the gate is the reviewer.
      - name: Annunciate a deliberate floor change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" -- .test-baseline | grep -q .; then
            echo "::warning::This pull request changes .test-baseline by hand. That is the deliberate-lowering path: it is legitimate only when tests were removed on purpose, and it needs a written justification in the pull request. Routine pull requests never touch this file."
          else
            echo "This pull request does not touch .test-baseline, which is the normal case."
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        # --require-hashes enforces that every dependency in requirements.txt is
        # pinned with a SHA256 hash. A compromised PyPI release that replaces the
        # tarball under the same version is rejected at install time. Regenerate
        # hashes on Concordia version bump per sidecars/concordia/README.md.
        run: |
          python3 -m venv sidecars/concordia/.venv
          sidecars/concordia/.venv/bin/pip install --upgrade pip
          sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      # ── Gate 0: build (populates dist/templates for tarball tests) ─
      - name: Gate 0 — build
        working-directory: server
        run: npm run build

      # ── Gate 1: typecheck ──────────────────────────────────────────
      - name: Gate 1 — typecheck
        working-directory: server
        run: npm run typecheck

      - name: Install libsecret + Secret Service backend
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-secret-service

      # ── Gate 2: npm test + transform/collection error detection ───
      #
      # Captures vitest output in one invocation so all three checks
      # (transform errors, silent file drop, floor comparison) parse the
      # same run. If `npm test` exits non-zero the step fails immediately
      # and the parsing checks below do not run — that is correct
      # behaviour, a test failure is a merge-blocker regardless of the
      # passing count.
      - name: Gate 2 — run tests and capture output
        id: run_tests
        working-directory: server
        # NO_COLOR / FORCE_COLOR=0 keep vitest's output ANSI-free so the
        # grep-based gates 2b and 2c can parse the summary lines without
        # tripping over color escape codes. Without this, vitest emits
        # e.g. `Tests \e[1m\e[32m1328 passed\e[22m` which breaks the
        # `Tests[[:space:]]+[0-9]+ passed` regex the floor script uses.
        # Must match the parser in scripts/test-baseline-floor.sh.
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          # tee to both the GitHub Actions log and a file we parse
          npm test 2>&1 | tee /tmp/vitest-output.log
          exit "${PIPESTATUS[0]}"

      - name: Gate 2a — transform/collection error detection
        run: |
          # Patterns match the vitest / vite:esbuild failure signatures
          # for the commit 4ac95830 class. Case-insensitive.
          #
          #   "transform failed"      — vite:esbuild plugin
          #                             ("Transform failed with N error")
          #   "transform error"       — alternate vitest message
          #   "failed to parse"       — esbuild / swc
          #   "failed to collect"     — vitest collection failure
          #   "failed to load source" — vitest source load
          #   "cannot find module"    — missing import
          #   "Failed Suites"         — vitest summary header for
          #                             suite-level failures
          #
          # Note: if `npm test` already exited non-zero in the previous
          # step, this step would not run (steps short-circuit on
          # failure), so reaching this step means vitest exited zero.
          # Still, we run this as defense-in-depth in case a future
          # vitest version emits a transform error without failing
          # the run.
          PATTERNS='(transform failed|transform error|failed to parse|failed to collect|failed to load source|cannot find module|failed suites)'
          # A vite 8 SSR "Failed to load source MAP for X" warning is benign:
          # tests still run, it is NOT the 4ac95830 transform/collection class,
          # but it matches "failed to load source". Exclude that one benign line
          # before the gate so it cannot false-positive (vite 8 emits it when a
          # test imports the TypeScript compiler API). A real
          # "failed to load source <module>" (no "map") still trips the gate.
          HITS="$(grep -Ei "$PATTERNS" /tmp/vitest-output.log | grep -viE 'failed to load source map' || true)"
          if [ -n "$HITS" ]; then
            echo "::error::Transform/collection error detected in vitest output. This is the specific failure class from commit 4ac95830 (see docs/audit/commit-4ac95830-postmortem.md)."
            echo "$HITS" | head -20
            exit 1
          fi
          echo "✓ No transform/collection errors detected."

      - name: Gate 2b — silent test file drop detection
        run: |
          expected_files=$(find server/test -name "*.test.ts" -not -path "*/node_modules/*" | wc -l | tr -d '[:space:]')
          actual_total=$(grep -oE "Test Files[[:space:]]+.*\([0-9]+\)" /tmp/vitest-output.log | grep -oE "\([0-9]+\)" | tr -d '()' | tail -1)
          if [[ -z "$actual_total" ]]; then
            actual_total=$(grep -oE "Test Files[[:space:]]+[0-9]+ passed" /tmp/vitest-output.log | grep -oE "[0-9]+" | head -1)
          fi
          if [[ -z "$actual_total" ]]; then
            echo "::error::Could not parse 'Test Files' count from vitest output."
            tail -30 /tmp/vitest-output.log
            exit 1
          fi
          echo "Files on disk:       $expected_files"
          echo "Files vitest loaded: $actual_total"
          if (( actual_total < expected_files )); then
            echo "::error::Silent test file drop detected: $expected_files files on disk, $actual_total loaded by vitest. Missing $((expected_files - actual_total)) file(s). This is the exact failure class from commit 4ac95830 (see docs/audit/commit-4ac95830-postmortem.md)."
            exit 1
          fi
          echo "✓ All $expected_files test files loaded by vitest."

      # ── Gate 2c: the floor ─────────────────────────────────────────
      #
      # INVARIANT: this asserts a FLOOR and nothing more. It does not demand
      # equality and it does not ask the author to record anything, because the
      # number it compares against is published by CI on the default branch.
      #
      # The floor in force came from the cache when one was available and from
      # the committed fallback otherwise, and the step above said which in the
      # log. Both paths land here identically on purpose: there is one gate, and
      # it is the same gate whichever floor is in force.
      - name: Gate 2c — passing count is not below the floor in force
        id: floor_gate
        env:
          FLOOR_IN_FORCE: ${{ steps.baseline.outputs.baseline }}
        run: |
          passing="$(scripts/test-baseline-floor.sh parse-count /tmp/vitest-output.log)"
          echo "passing=$passing" >> "$GITHUB_OUTPUT"
          scripts/test-baseline-floor.sh assert-not-below "$FLOOR_IN_FORCE" "$passing"

      # ── Publish, on the default branch only ────────────────────────
      #
      # This is the entire "recording" mechanism now: write the observed count
      # into a file and let the cache action carry it to later runs. No commit,
      # no branch, no pull request, no ruleset interaction, and no credential
      # beyond the default token, which may write a cache with no permission
      # grant at all.
      #
      # INVARIANT: only the run whose commit is still the tip publishes. Two
      # pushes can finish out of order, and the restore side takes the most
      # recently CREATED entry, so ordering has to be decided here. A run that
      # is no longer the tip declines and the newer push publishes its own count.
      # Failure mode note: a decline is a normal, expected outcome and is not an
      # error; it prints and the step succeeds.
      - name: Decide whether to publish this count
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          git fetch --quiet origin main
          tip="$(git rev-parse origin/main)"
          set +e
          scripts/test-baseline-floor.sh publish-decision "$REF" "$GITHUB_SHA" "$tip"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 1 ]]; then
            echo "::notice::Not publishing a floor from this run; see the reason above."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Stage the observed count
        if: steps.publish.outputs.proceed == 'true'
        env:
          CACHE_DIR: ${{ steps.cachedef.outputs.dir }}
          CACHE_FILE: ${{ steps.cachedef.outputs.file }}
          OBSERVED: ${{ steps.floor_gate.outputs.passing }}
        run: |
          mkdir -p "$CACHE_DIR"
          printf '%s\n' "$OBSERVED" > "$CACHE_FILE"
          echo "Publishing $OBSERVED as the floor for later runs."

      # The key carries the commit, the run and the attempt because a cache
      # entry is immutable: re-running the same commit would otherwise fail on
      # "cache already exists". The restore side matches on the prefix and takes
      # the most recent, so the exact suffix never has to be predicted.
      - name: Publish the observed count
        if: steps.publish.outputs.proceed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: ${{ steps.cachedef.outputs.dir }}
          key: ${{ steps.cachedef.outputs.prefix }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
