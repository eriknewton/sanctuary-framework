# Sanctuary Test Baseline Guard
#
# Copyright 2026 Erik Newton
# SPDX-License-Identifier: Apache-2.0
#
# CI mirror of the pre-commit hook at .githooks/pre-commit. Runs the
# same two gates (typecheck + transform-error detection + baseline
# check) on every PR and every push to main. This is the belt-and-
# suspenders layer that catches:
#
#   - Contributors who ran `git commit --no-verify` locally
#   - Contributors who never installed the hook (fresh clones,
#     one-off environments)
#   - Agents that commit via a pipeline that bypasses .git/hooks
#   - Direct pushes to main from any environment
#
# The job is DELIBERATELY separate from the existing `test` matrix
# in ci.yml so it can be named as a distinct required status check
# in GitHub branch-protection rules. See
# docs/audit/branch-protection-setup.md for the runbook.
#
# This job mirrors the pre-commit hook's logic (see
# .githooks/pre-commit for the authoritative copy and the postmortem
# at docs/audit/commit-4ac95830-postmortem.md for the specific
# failure class it defends against).

name: Test Baseline Guard

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-baseline-guard:
    name: test-baseline-guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check test baseline floor file exists
        run: |
          # Early existence check only, so a missing floor fails before the
          # full suite runs. The floor's bytes are validated in Gate 2c by
          # read_canonical_floor from the trusted helper copy (the pull
          # request's own copy of the helper is never run in this job), with
          # no whitespace strip.
          if [[ ! -f .test-baseline ]]; then
            echo "::error::.test-baseline file missing at repo root. Create it with a single integer: the current passing count."
            exit 1
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        # --require-hashes enforces that every dependency in requirements.txt is
        # pinned with a SHA256 hash. A compromised PyPI release that replaces the
        # tarball under the same version is rejected at install time. Regenerate
        # hashes on Concordia version bump per sidecars/concordia/README.md.
        #
        # CI-APT-RESILIENCE-01: both pip installs are routed through the
        # shared retry-with-timeout.sh wrapper (same fix applied to every
        # apt-get site after the 2026-08-19 hang incident, extended here to
        # pip since an unbounded network install can hang the same way).
        timeout-minutes: 20
        run: |
          python3 -m venv sidecars/concordia/.venv
          scripts/ci/retry-with-timeout.sh "pip upgrade (concordia venv)" -- \
            sidecars/concordia/.venv/bin/pip install --upgrade pip
          scripts/ci/retry-with-timeout.sh "pip install (concordia venv, hash-pinned)" -- \
            sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      - name: Install the system Hermes YAML parser fixture
        uses: ./.github/actions/apt-install-resilient
        with:
          packages: python3-yaml

      - name: Provision the root-owned workstation signer interpreter
        # setup-node's tool cache is runner-writable, so its symlink cannot carry key custody.
        # Copy the selected runtime into the fixed trusted path checked by the real signer.
        run: sudo install -o root -g root -m 0755 "$(command -v node)" /usr/bin/node

      # ── Gate 0: build (populates dist/templates for tarball tests) ─
      - name: Gate 0 - build
        working-directory: server
        run: npm run build

      # ── Gate 1: typecheck ──────────────────────────────────────────
      - name: Gate 1 - typecheck
        working-directory: server
        run: npm run typecheck

      - name: Install libsecret + Secret Service backend
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-secret-service

      - name: Pin the full-suite Python YAML fixture
        # Bare python3 gates the real cases; the product also probes /usr/bin/python3.
        # Secret Service prepends its venv to PATH, so install after that action.
        timeout-minutes: 5
        run: |
          scripts/ci/retry-with-timeout.sh "pip install (Hermes parser fixture, hash-pinned)" -- \
            python3 -m pip install --only-binary=:all: --require-hashes -r scripts/ci/hermes-parity-requirements.txt
          python3 -c "import yaml"

      # ── Gate 2: npm test + transform/collection error detection ───
      #
      # Captures vitest output in one invocation so all three checks
      # (transform errors, silent file drop, baseline regression)
      # parse the same run. If `npm test` exits non-zero the step
      # fails immediately and the parsing checks below do not run -
      # that is correct behaviour, a test failure is a commit-blocker
      # regardless of the passing count.
      - name: Gate 2 - run tests and capture output
        id: run_tests
        working-directory: server
        # NO_COLOR / FORCE_COLOR=0 keep vitest's output ANSI-free so the
        # grep-based gates 2b and 2c can parse the summary lines without
        # tripping over color escape codes. Without this, vitest emits
        # e.g. `Tests \e[1m\e[32m1328 passed\e[22m` which breaks the
        # `Tests[[:space:]]+[0-9]+ passed` regex in Gate 2c.
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          node ../scripts/redact-test-output-self-test.mjs
          # Redact before either the public Actions log or the parsed file sees
          # diagnostic output. Preserve failures from npm, the redactor, or tee.
          npm test 2>&1 | node ../scripts/redact-test-output.mjs | tee /tmp/vitest-output.log
          statuses=("${PIPESTATUS[@]}")
          for status in "${statuses[@]}"; do
            if (( status != 0 )); then
              exit "$status"
            fi
          done

      - name: Gate 2a - transform/collection error detection
        run: |
          # Patterns match the vitest / vite:esbuild failure signatures
          # for the commit 4ac95830 class. Case-insensitive.
          #
          #   "transform failed"      - vite:esbuild plugin
          #                             ("Transform failed with N error")
          #   "transform error"       - alternate vitest message
          #   "failed to parse"       - esbuild / swc
          #   "failed to collect"     - vitest collection failure
          #   "failed to load source" - vitest source load
          #   "cannot find module"    - missing import
          #   "Failed Suites"         - vitest summary header for
          #                             suite-level failures
          #
          # Note: if `npm test` already exited non-zero in the previous
          # step, this step would not run (steps short-circuit on
          # failure), so reaching this step means vitest exited zero.
          # Still, we run this as defense-in-depth in case a future
          # vitest version emits a transform error without failing
          # the run.
          PATTERNS='(transform failed|transform error|failed to parse|failed to collect|failed to load source|cannot find module|failed suites)'
          # A vite 8 SSR "Failed to load source MAP for X" warning is benign:
          # tests still run, it is NOT the 4ac95830 transform/collection class,
          # but it matches "failed to load source". Exclude that one benign line
          # before the gate so it cannot false-positive (vite 8 emits it when a
          # test imports the TypeScript compiler API). A real
          # "failed to load source <module>" (no "map") still trips the gate.
          HITS="$(grep -Ei "$PATTERNS" /tmp/vitest-output.log | grep -viE 'failed to load source map' || true)"
          if [ -n "$HITS" ]; then
            echo "::error::Transform/collection error detected in vitest output. This is the specific failure class from commit 4ac95830 (see docs/audit/commit-4ac95830-postmortem.md)."
            echo "$HITS" | head -20
            exit 1
          fi
          echo "✓ No transform/collection errors detected."

      - name: Gate 2b self-test - prove the drop detector before trusting it
        # A gate that is never itself exercised in CI is an artifact, not a
        # consumer - this step is what makes scripts/gate2b-self-test.sh a
        # real gate on scripts/gate2b-check.sh rather than a script that only
        # ever runs on someone's laptop. Runs BEFORE the real Gate 2b step
        # below so a broken drop detector fails loudly here, on its own
        # planted-divergence proof, rather than silently passing (or
        # silently failing to catch a real drop) in the step that follows.
        run: scripts/gate2b-self-test.sh

      - name: Gate 2b - silent test file drop detection
        # Logic lives in scripts/gate2b-check.sh rather than inline here, so
        # it can be driven against a planted-divergence fixture outside
        # Actions (see the self-test step above). expected_files comes from
        # vitest's OWN file discovery (server/scripts/count-vitest-test-files.mjs,
        # via `vitest list --filesOnly`) rather than a re-implementation of
        # test.include/exclude/dot/root/projects resolution, so there is no
        # second model of vitest.config.ts left to drift out of sync with it.
        run: scripts/gate2b-check.sh /tmp/vitest-output.log

      - name: Gate 2c - passing count >= baseline
        # Expressions go through env, not into the script text, so the run
        # block below is plain bash that server/test/scripts/
        # baseline-guard-trusted-helper.test.ts executes against fixtures.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASELINE_FILE: .test-baseline
          VITEST_LOG: /tmp/vitest-output.log
        run: |
          # INVARIANT: on pull_request the count helper (parser and
          # compare_counts) comes from the PR's BASE commit, never from the
          # checked-out head: this guard judges the head, so a head that edits
          # scripts/parse-vitest-summary.sh (for example to make compare_counts
          # always print "eq") must not get to grade itself. On push (to main or
          # release/**) the pushed commit's own copy is used, because it already
          # merged through review.
          # RESIDUAL (stated, not closed here): this guard is an honesty check
          # against accidental regressions, not a boundary against a pull
          # request's own code. On pull_request, any head-controlled code that
          # runs before this gate can shape the log and the files it reads.
          # Examples, not a complete list: `npm test` and the pull request's
          # test files; npm ci (the head's lockfile), npm run build and npm run
          # typecheck (the head's package scripts); scripts/gate2b-check.sh and
          # scripts/gate2b-self-test.sh; scripts/redact-test-output.mjs and
          # scripts/redact-test-output-self-test.mjs;
          # scripts/ci/retry-with-timeout.sh; the local actions under
          # .github/actions/; and this workflow file itself (GitHub runs the
          # head's workflow on pull_request). Reading the helper from the base
          # commit closes only the helper-substitution path. Review of changes
          # to head-controlled CI code is the control for the rest.
          # FAILURE MODE: a base commit that has no helper, or whose helper
          # predates compare_counts, fails this step closed with a named error;
          # it never falls back to the head's copy or to (( )) arithmetic.
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          trusted_dir="$RUNNER_TEMP/baseline-guard-trusted"
          trusted_helper="$trusted_dir/parse-vitest-summary.sh"
          mkdir -p "$trusted_dir"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # 40 = hex length of a SHA-1 object id, this repository's format.
            if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::pull_request base SHA is missing or malformed: '$BASE_SHA'"
              exit 1
            fi
            # actions/checkout is shallow, so the base commit may be absent.
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
                echo "::error::Could not fetch the pull request base commit $BASE_SHA to read the trusted count helper."
                exit 1
              fi
            fi
            if ! git show "${BASE_SHA}:scripts/parse-vitest-summary.sh" > "$trusted_helper"; then
              echo "::error::The pull request base commit $BASE_SHA has no scripts/parse-vitest-summary.sh; refusing to use the head's copy."
              exit 1
            fi
            helper_source="base commit $BASE_SHA"
          else
            cp scripts/parse-vitest-summary.sh "$trusted_helper"
            helper_source="pushed commit (already reviewed)"
          fi
          echo "Count helper source: $helper_source"
          # Must match the "Shared count helpers" block in .githooks/pre-push
          # (which sources its own working tree, correct for a local push) and
          # the header in scripts/parse-vitest-summary.sh.
          source "$trusted_helper"
          for required_fn in is_canonical_count compare_counts count_difference read_canonical_floor; do
            if ! declare -F "$required_fn" >/dev/null; then
              echo "::error::The count helper from the $helper_source does not define $required_fn; refusing to compare counts without it."
              exit 1
            fi
          done
          # The shared parser strips ANSI, requires exactly one Vitest summary
          # line holding exactly one count, and prints only a canonical count.
          passing=$(VITEST_SUMMARY_ERROR_STYLE=github bash "$trusted_helper" "$VITEST_LOG")
          # Must match read_canonical_floor in scripts/parse-vitest-summary.sh
          # and the hook's floor reads: the raw bytes must be exactly one
          # canonical count plus at most one newline. They are never
          # whitespace-stripped first, which would join "123 4567" into one
          # valid-looking floor.
          if ! baseline=$(VITEST_SUMMARY_ERROR_STYLE=github read_canonical_floor < "$BASELINE_FILE"); then
            echo "::error::.test-baseline is not exactly one canonical integer with at most one trailing newline."
            exit 1
          fi
          # INVARIANT: the counts are compared only through compare_counts,
          # never with (( )): bash arithmetic is signed 64-bit and wraps
          # silently, so a long enough count could compare equal to the floor
          # and print success. The string comparison has no digit ceiling and
          # no overflow; a non-canonical or empty operand is refused.
          if ! relation=$(VITEST_SUMMARY_ERROR_STYLE=github compare_counts "$passing" "$baseline"); then
            echo "::error::Could not compare the passing-test count '$passing' with the baseline floor '$baseline'."
            exit 1
          fi
          echo "Baseline floor: $baseline"
          echo "Passing tests:  $passing"
          if [[ "$relation" == "lt" ]]; then
            echo "::error::Test baseline regression: baseline=$baseline, passing=$passing, missing $(count_difference "$baseline" "$passing") tests. Fix the regression or update .test-baseline in a separate explicitly-scoped commit."
            exit 1
          fi
          # Fail-above (mirror of the pre-commit hook): a passing count
          # higher than the floor must be locked into .test-baseline in
          # the SAME PR. A stale low floor lets a later regression hide
          # under the gap - the extra passing tests mask the loss until
          # the floor is finally bumped. The fix is mechanical: set
          # .test-baseline to the new count in this PR.
          if [[ "$relation" == "gt" ]]; then
            echo "::error::Test baseline drifted above the floor: baseline=$baseline, passing=$passing, $(count_difference "$passing" "$baseline") new tests above floor. Raise .test-baseline to $passing IN THIS PR. A deferred bump lets a future regression hide under the stale floor."
            exit 1
          fi
          if [[ "$relation" != "eq" ]]; then
            echo "::error::compare_counts returned an unknown relation '$relation'; refusing to pass."
            exit 1
          fi
          echo "✓ Baseline guard passed."
