# Sanctuary Test Baseline Guard
#
# Copyright 2026 Erik Newton
# SPDX-License-Identifier: Apache-2.0
#
# Two sides of one mechanism, with the decision logic for both in
# scripts/test-baseline-floor.sh so it can be exercised without a runner:
#
#   test-baseline-guard  Runs on every pull request and every push to main.
#                        Asserts the observed passing count is NOT BELOW the
#                        floor recorded at the repo root, alongside the
#                        unchanged gates (typecheck, no transform or collection
#                        error, no silent test-file drop, zero failures). A
#                        count above the floor is the normal resting state of a
#                        pull request that adds tests, and it passes. This job
#                        holds a read-only token and writes nothing, anywhere.
#
#   record-floor         Runs only on a push to main, after the guard. Records
#                        the observed count into .test-baseline when it differs.
#                        This is the only job in the repository that may write
#                        that file, it may write no other file, and it may write
#                        no other branch.
#
# WHY A PULL REQUEST NO LONGER CARRIES THE INTEGER: the floor is the passing
# count on Linux CI, which an author on macOS cannot compute locally. Asking
# every pull request to state it made the number a guess; on 2026-08-19 three of
# three open pull requests guessed it wrong, and the remedy each time was to
# read the number out of a failed run and push it back. Recording the count on
# main after the merge removes the guess without removing the gate.
#
# THE FAILURE MODE THIS DESIGN INTRODUCES, STATED PLAINLY: if record-floor fails
# or never runs, the floor goes stale LOW and the pull-request gate quietly
# asserts less than it should. A stale floor looks EXACTLY like a healthy floor
# from a pull request's point of view: the check still passes, in the same
# colour, with the same message. That is why the alarm lives outside the
# pull-request path. Two alarms cover it: this job failing on a push to main is
# immediately visible on main, and the scheduled backstop in
# .github/workflows/test-baseline-floor-drift.yml compares the recorded floor
# against a fresh count and reports drift that outlives its window.
#
# The guard job is DELIBERATELY separate from the `test` matrix in ci.yml so it
# can be named as a distinct required status check. See
# docs/audit/branch-protection-setup.md for the runbook, and
# docs/audit/test-baseline-hardening-plan.md for the layered plan this belongs
# to. The local convenience copy of the pull-request side is .githooks/pre-commit.

name: Test Baseline Guard

on:
  push:
    branches: [main]
    # LOOP BOUND ONE OF TWO (structural). A record-floor commit changes nothing
    # but .test-baseline, so it cannot change the passing count, and re-running
    # the whole suite to conclude that would burn a runner to learn nothing. The
    # semantic bound is in scripts/test-baseline-floor.sh guard-record-context,
    # which refuses when the head commit is one of ours; that one is self-tested
    # and survives an edit to this filter.
    #
    # Failure mode note: paths-ignore skips a run only when EVERY changed path
    # matches, so a merge that lowers the floor deliberately alongside real code
    # changes still runs and still records.
    paths-ignore:
      - ".test-baseline"
  pull_request:
    branches: [main]

# Read-only is the workflow-level default so a new job inherits no authority.
# The single write grant is declared on record-floor and nowhere else; the
# self-test at scripts/test-baseline-floor-self-test.sh asserts that this file
# contains exactly one `contents: write` line and that it sits inside that job.
#
# That grant also makes this a PRIVILEGED workflow, which is why every external
# action below is pinned to an immutable 40-character commit SHA rather than a
# tag. `npm run check:release-action-pins` enforces it; a tag is a mutable
# pointer, and a repointed tag on a workflow holding a write token is a supply
# chain into main. Failure mode when a new step is added with a bare `@v7`: the
# `test (22)` and `test (24)` jobs red on the pin check within seconds, which
# reads as an unrelated test failure until you look at the step name.
permissions:
  contents: read

jobs:
  test-baseline-guard:
    name: test-baseline-guard
    runs-on: ubuntu-latest

    outputs:
      # Consumed by record-floor. The count the recorder writes is the count
      # this job's gate compared, never a second measurement.
      passing: ${{ steps.floor_gate.outputs.passing }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the deliberate-lowering annunciation below diffs
          # against the base branch, and a shallow clone cannot.
          fetch-depth: 0

      # Runs before the Node setup on purpose: it drives the floor script
      # against disposable fixtures, needs no dependencies, takes seconds, and a
      # broken floor guard should red before two minutes of install.
      #
      # This step is the self-test's only consumer. A harness nothing invokes is
      # a harness that cannot notice its own guard being reverted.
      - name: Self-test the floor decision logic
        run: bash scripts/test-baseline-floor-self-test.sh

      - name: Read the recorded floor
        id: baseline
        run: |
          baseline="$(scripts/test-baseline-floor.sh read-floor .test-baseline)"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "Recorded floor: $baseline"

      # A pull request that changes .test-baseline is the deliberate-lowering
      # path, which is human and reviewed. Since routine pull requests no longer
      # touch the file at all, its appearance in a diff is now a review signal
      # rather than background noise. This annunciates; the gate is the reviewer.
      - name: Annunciate a deliberate floor change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" -- .test-baseline | grep -q .; then
            echo "::warning::This pull request changes .test-baseline by hand. That is the deliberate-lowering path: it is legitimate only when tests were removed on purpose, and it needs a written justification in the pull request. Routine pull requests never touch this file."
          else
            echo "This pull request does not touch .test-baseline, which is the normal case."
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Set up Python 3.12 for Concordia sidecar
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Provision Concordia sidecar venv
        # --require-hashes enforces that every dependency in requirements.txt is
        # pinned with a SHA256 hash. A compromised PyPI release that replaces the
        # tarball under the same version is rejected at install time. Regenerate
        # hashes on Concordia version bump per sidecars/concordia/README.md.
        run: |
          python3 -m venv sidecars/concordia/.venv
          sidecars/concordia/.venv/bin/pip install --upgrade pip
          sidecars/concordia/.venv/bin/pip install --require-hashes -r sidecars/concordia/requirements.txt

      # ── Gate 0: build (populates dist/templates for tarball tests) ─
      - name: Gate 0 — build
        working-directory: server
        run: npm run build

      # ── Gate 1: typecheck ──────────────────────────────────────────
      - name: Gate 1 — typecheck
        working-directory: server
        run: npm run typecheck

      - name: Install libsecret + Secret Service backend
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-secret-service

      # ── Gate 2: npm test + transform/collection error detection ───
      #
      # Captures vitest output in one invocation so all three checks
      # (transform errors, silent file drop, floor comparison) parse the
      # same run. If `npm test` exits non-zero the step fails immediately
      # and the parsing checks below do not run — that is correct
      # behaviour, a test failure is a merge-blocker regardless of the
      # passing count.
      - name: Gate 2 — run tests and capture output
        id: run_tests
        working-directory: server
        # NO_COLOR / FORCE_COLOR=0 keep vitest's output ANSI-free so the
        # grep-based gates 2b and 2c can parse the summary lines without
        # tripping over color escape codes. Without this, vitest emits
        # e.g. `Tests \e[1m\e[32m1328 passed\e[22m` which breaks the
        # `Tests[[:space:]]+[0-9]+ passed` regex the floor script uses.
        # Must match the parser in scripts/test-baseline-floor.sh.
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          # tee to both the GitHub Actions log and a file we parse
          npm test 2>&1 | tee /tmp/vitest-output.log
          exit "${PIPESTATUS[0]}"

      - name: Gate 2a — transform/collection error detection
        run: |
          # Patterns match the vitest / vite:esbuild failure signatures
          # for the commit 4ac95830 class. Case-insensitive.
          #
          #   "transform failed"      — vite:esbuild plugin
          #                             ("Transform failed with N error")
          #   "transform error"       — alternate vitest message
          #   "failed to parse"       — esbuild / swc
          #   "failed to collect"     — vitest collection failure
          #   "failed to load source" — vitest source load
          #   "cannot find module"    — missing import
          #   "Failed Suites"         — vitest summary header for
          #                             suite-level failures
          #
          # Note: if `npm test` already exited non-zero in the previous
          # step, this step would not run (steps short-circuit on
          # failure), so reaching this step means vitest exited zero.
          # Still, we run this as defense-in-depth in case a future
          # vitest version emits a transform error without failing
          # the run.
          PATTERNS='(transform failed|transform error|failed to parse|failed to collect|failed to load source|cannot find module|failed suites)'
          # A vite 8 SSR "Failed to load source MAP for X" warning is benign:
          # tests still run, it is NOT the 4ac95830 transform/collection class,
          # but it matches "failed to load source". Exclude that one benign line
          # before the gate so it cannot false-positive (vite 8 emits it when a
          # test imports the TypeScript compiler API). A real
          # "failed to load source <module>" (no "map") still trips the gate.
          HITS="$(grep -Ei "$PATTERNS" /tmp/vitest-output.log | grep -viE 'failed to load source map' || true)"
          if [ -n "$HITS" ]; then
            echo "::error::Transform/collection error detected in vitest output. This is the specific failure class from commit 4ac95830 (see docs/audit/commit-4ac95830-postmortem.md)."
            echo "$HITS" | head -20
            exit 1
          fi
          echo "✓ No transform/collection errors detected."

      - name: Gate 2b — silent test file drop detection
        run: |
          expected_files=$(find server/test -name "*.test.ts" -not -path "*/node_modules/*" | wc -l | tr -d '[:space:]')
          actual_total=$(grep -oE "Test Files[[:space:]]+.*\([0-9]+\)" /tmp/vitest-output.log | grep -oE "\([0-9]+\)" | tr -d '()' | tail -1)
          if [[ -z "$actual_total" ]]; then
            actual_total=$(grep -oE "Test Files[[:space:]]+[0-9]+ passed" /tmp/vitest-output.log | grep -oE "[0-9]+" | head -1)
          fi
          if [[ -z "$actual_total" ]]; then
            echo "::error::Could not parse 'Test Files' count from vitest output."
            tail -30 /tmp/vitest-output.log
            exit 1
          fi
          echo "Files on disk:       $expected_files"
          echo "Files vitest loaded: $actual_total"
          if (( actual_total < expected_files )); then
            echo "::error::Silent test file drop detected: $expected_files files on disk, $actual_total loaded by vitest. Missing $((expected_files - actual_total)) file(s). This is the exact failure class from commit 4ac95830 (see docs/audit/commit-4ac95830-postmortem.md)."
            exit 1
          fi
          echo "✓ All $expected_files test files loaded by vitest."

      # ── Gate 2c: the floor ─────────────────────────────────────────
      #
      # INVARIANT: this asserts a FLOOR and nothing more. It does not demand
      # equality and it does not ask the author to record anything, because the
      # recorded value is produced by record-floor after the merge.
      #
      # The floor is read from the pull request's own tree rather than from
      # main. Those are the same value at merge time because the repository
      # ruleset requires a branch to be up to date before it merges, which is
      # what makes reading it here equivalent to reading main. If that
      # requirement is ever relaxed, a stale branch could carry an old low floor
      # into its gate, and this comment is the thread to pull.
      - name: Gate 2c — passing count is not below the recorded floor
        id: floor_gate
        env:
          RECORDED_FLOOR: ${{ steps.baseline.outputs.baseline }}
        run: |
          passing="$(scripts/test-baseline-floor.sh parse-count /tmp/vitest-output.log)"
          echo "passing=$passing" >> "$GITHUB_OUTPUT"
          scripts/test-baseline-floor.sh assert-not-below "$RECORDED_FLOOR" "$passing"

  # ── The recorder ─────────────────────────────────────────────────────────
  #
  # It does NOT push to main. It proposes the recorded floor as an ordinary
  # pull request from a fixed branch and lets auto-merge land it once the
  # required checks pass. That is what keeps this mechanism free of any new
  # authority: the branch ruleset requires a pull request and zero approving
  # reviews, and the repository allows auto-merge, so a machine-authored change
  # can satisfy the rules exactly as a person's does. No bypass actor, no
  # deploy key, no app token, and the pull-request requirement plus every
  # required check stay intact for this change too.
  #
  # Everything this job executes has already been reviewed, gated and merged.
  # There is no fork case, no push to a contributor's branch, and no decision an
  # outsider can influence: it records what the suite counted.
  #
  # KNOWN CONSTRAINT, and the one thing to confirm before relying on this: a
  # pull request opened with the default GITHUB_TOKEN does not itself start new
  # workflow runs, which is GitHub's recursion guard. If the required checks
  # therefore never report on the recorded-floor pull request, auto-merge cannot
  # fire and the pull request waits. That failure is bounded and loud rather than
  # silent: the fixed branch means at most ONE such pull request exists at a
  # time and it always carries the newest count, and the scheduled check in
  # .github/workflows/test-baseline-floor-drift.yml reports a recorded-floor
  # pull request that stays open past its window. Clearing it needs either a
  # token whose events start workflow runs, or one human action on the waiting
  # pull request.
  record-floor:
    name: record-floor
    needs: test-baseline-guard
    # The write token is minted only for a push to main. On a pull request this
    # job does not exist, so no pull-request code ever executes beside it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Narrow on purpose: enough to push ONE branch that is not main and to open
    # one pull request. Nothing here can write main; the ruleset still decides
    # that, which is the entire point of proposing rather than pushing.
    permissions:
      contents: write
      pull-requests: write

    # Two merges in quick succession must not race. cancel-in-progress is false
    # so a queued recorder waits for the running one rather than racing it; the
    # queue is first-in-first-out, so the later tree is recorded last and its
    # count is the one that survives on the shared branch.
    #
    # Failure mode note: GitHub cancels a PENDING job in a group when a newer
    # one queues behind a running one. That is benign here and shows as
    # `cancelled`, not `failure`: the cancelled run's tree is stale by
    # definition, and the newest run records the newest count.
    concurrency:
      group: test-baseline-floor-record
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # A commit pushed on top of a shallow history is refused by the remote
          # with "shallow update not allowed", which reads as a permissions
          # failure and sends the reader hunting in the wrong place.
          fetch-depth: 0

      # The count came from the guard job, which measured GITHUB_SHA. If main
      # has moved since, that count no longer describes the tip, and recording
      # it would propose a number for a tree that no longer exists. The newer
      # push has its own recorder; let that one do it.
      - name: Skip when a newer commit already landed on main
        id: tip
        run: |
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "::notice::main advanced from $GITHUB_SHA to $head while the suite ran; the newer push records the floor."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # LOOP BOUND TWO OF THREE (semantic, and the self-tested one). It matters
      # MORE under the pull-request route, not less: the recorded floor now
      # reaches main by merging, and that merge is itself a push to main that
      # runs this workflow again. The subject it must recognize is the SQUASHED
      # one, which carries a trailing ` (#N)`; the matcher in the floor script
      # accounts for that and the self-test pins the squashed shape.
      #
      # A refusal here is a clean skip, never a failure: a recorder that
      # reddened main every time it correctly declined to record would train
      # everyone to ignore a red main, which is the opposite of the alarm this
      # design needs.
      - name: Refuse to record on our own commit
        id: context
        if: steps.tip.outputs.proceed == 'true'
        env:
          REF: ${{ github.ref }}
        run: |
          subject="$(git log -1 --format=%s)"
          set +e
          scripts/test-baseline-floor.sh guard-record-context "$REF" "$subject"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 1 ]]; then
            echo "::notice::Not recording a floor for this commit; see the refusal above."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      # LOOP BOUND THREE OF THREE, and the one that holds even if both others
      # were removed: if the floor already equals the observed count there is
      # nothing to propose, so the recorded-floor merge that lands N against a
      # floor of N produces no second pull request by arithmetic rather than by
      # recognition.
      - name: Record the observed count
        id: record
        if: steps.context.outputs.proceed == 'true'
        env:
          OBSERVED: ${{ needs.test-baseline-guard.outputs.passing }}
        run: |
          set +e
          scripts/test-baseline-floor.sh record .test-baseline "$OBSERVED"
          status=$?
          set -e
          # 10 is the floor script's "no action needed": the file already holds
          # this count, so there is nothing to propose.
          if [[ "$status" -eq 10 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Propose the recorded floor as a pull request
        if: steps.record.outputs.changed == 'true'
        env:
          OBSERVED: ${{ needs.test-baseline-guard.outputs.passing }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="$(scripts/test-baseline-floor.sh record-branch)"
          subject="$(scripts/test-baseline-floor.sh commit-subject "$OBSERVED")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .test-baseline
          # INVARIANT: one file, checked rather than assumed. The safety argument
          # for this job is that it can propose nothing else, so the claim is
          # asserted here instead of being left to the reader of `git add`.
          staged="$(git diff --cached --name-only)"
          if [[ "$staged" != ".test-baseline" ]]; then
            echo "::error::the recorder staged something other than .test-baseline: $staged"
            exit 1
          fi
          git commit -m "$subject"

          # Force is correct and is the convergence mechanism, not a shortcut.
          # The branch name is fixed, so a second merge landing while an earlier
          # recorded-floor pull request is still open must REPLACE its content
          # with the later count rather than open a competing pull request.
          # Failure mode note: this shows up in the pull request as a normal
          # force-push, and its checks restart. That is the intended behaviour;
          # the older count was already wrong.
          git push --force origin "$branch"

          existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "$subject" \
              --body "Recorded automatically after a merge to main: the observed passing count on Linux CI is ${OBSERVED}. No human needs to compute or type this number. This pull request carries one line and goes through the same required checks as any other change."
            existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          else
            # Idempotent by design: the branch was force-updated above, so the
            # open pull request now carries the later count. Only its title still
            # names the older one, and the title becomes the squashed commit
            # subject, so it has to follow.
            echo "::notice::updating the open recorded-floor pull request #$existing to $OBSERVED"
            gh pr edit "$existing" --title "$subject"
          fi

          if [[ -z "$existing" ]]; then
            echo "::error::could not determine the recorded-floor pull request number"
            exit 1
          fi

          # Auto-merge is what makes this route need no elevated authority: the
          # pull request merges itself when the required checks pass, under the
          # same rules as everything else. Enabling it twice is not an error
          # worth failing the job over, so a second call is tolerated.
          gh pr merge --squash --auto "$existing" \
            || echo "::notice::auto-merge was already enabled on #$existing, or could not be enabled; see the log above"

          echo "::notice::$subject proposed in #$existing"
