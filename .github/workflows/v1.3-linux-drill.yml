name: v1.3 Linux acceptance drill

on:
  workflow_dispatch:
    inputs:
      sanctuary_version:
        description: 'npm dist-tag or version, for example next or 1.3.0-rc.1'
        required: false
        default: 'next'
  push:
    tags:
      - 'v1.3.*-rc.*'
      - 'v1.3.*'

jobs:
  linux-drill:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables libnetfilter-queue-dev libnfnetlink-dev jq
          sudo modprobe nfnetlink_queue || true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Sanctuary
        run: npm install -g @sanctuary-framework/mcp-server@${{ inputs.sanctuary_version || 'next' }}

      - name: Run drill
        env:
          REPORT_PATH: /tmp/v1.3-linux-drill-report.md
          SANCTUARY_VERSION: ${{ inputs.sanctuary_version || 'next' }}
        run: |
          export PS4='+ ${BASH_SOURCE:-workflow}:${LINENO}: '
          set -x
          bash -x scripts/drill/v1.3-linux-drill.sh

      - name: Upload drill report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1.3-linux-drill-report-${{ github.run_id }}
          path: /tmp/v1.3-linux-drill-report.md

      - name: Fail if drill did not pass
        run: |
          if [ ! -f /tmp/v1.3-linux-drill-report.md ]; then exit 1; fi
          grep -q '^overall: pass$' /tmp/v1.3-linux-drill-report.md
