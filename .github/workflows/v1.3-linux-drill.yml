name: v1.3 Linux acceptance drill

on:
  workflow_dispatch:
    inputs:
      sanctuary_version:
        description: 'npm dist-tag or version, for example next or 1.3.0-rc.1'
        required: false
        default: 'next'
  push:
    tags:
      - 'v1.3.*-rc.*'
      - 'v1.3.*'

permissions:
  contents: read

jobs:
  linux-drill:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables libnetfilter-queue-dev libnfnetlink-dev jq
          sudo modprobe nfnetlink_queue || true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Sanctuary
        run: |
          VERSION="${{ inputs.sanctuary_version || 'next' }}"
          if [ "$VERSION" = "local" ]; then
            cd server && npm ci && npm run build && npm install -g .
          else
            npm install -g "@sanctuary-framework/mcp-server@$VERSION"
          fi

      - name: Run drill
        env:
          REPORT_PATH: /tmp/v1.3-linux-drill-report.md
          SANCTUARY_VERSION: ${{ inputs.sanctuary_version || 'next' }}
        run: bash scripts/drill/v1.3-linux-drill.sh

      - name: Upload drill report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3-linux-drill-report-${{ github.run_id }}
          path: /tmp/v1.3-linux-drill-report.md

      - name: Upload drill debug archive
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3-linux-drill-debug-${{ github.run_id }}
          path: /tmp/v1.3-linux-drill-debug.tgz
          if-no-files-found: warn

      - name: Fail if drill did not pass
        run: |
          if [ ! -f /tmp/v1.3-linux-drill-report.md ]; then exit 1; fi
          grep -q '^overall: pass$' /tmp/v1.3-linux-drill-report.md
