name: Castle Wall Linux Integration

# Runs Rust integration tests for the Castle Wall daemon on Linux with
# CAP_NET_ADMIN. Exercises the full NFQUEUE round-trip end-to-end against
# real netfilter, the real daemon, and the real WalWriter.
#
# Per scope-lock section 9 Tier 0/1: these tests run on every PR and every
# push to main. The binding does not count as working until this job passes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# CHOKEPOINT, not a style setting. GitHub Actions' implicit shell for a `run:`
# block is `bash -e {0}` -- WITHOUT `pipefail` -- so the exit status of any
# `cmd | tee ...` step is `tee`'s and a failing `cmd` produces a green step. This
# workflow had that shape twice (the privileged `cargo test`, and the SHA-256
# manifest), and this job is the evidence CI check the README and
# ASSURANCE_MATRIX cite, so an invisible failure here is a false capability claim
# rather than a flake. `shell: bash` is documented as
# `bash --noprofile --norc -eo pipefail {0}`; setting it once at workflow level
# covers every step, including ones added later, instead of relying on each
# author remembering a per-step `set -o pipefail`.
defaults:
  run:
    shell: bash

jobs:
  castle-wall-msrv:
    name: Rust 1.75 minimum-version check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install native build dependencies
        uses: ./.github/actions/apt-install-resilient
        timeout-minutes: 22
        with:
          packages: libnetfilter-queue-dev libnfnetlink-dev

      - name: Install declared minimum Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.75.0

      - name: Check complete locked graph at declared MSRV
        working-directory: castle-wall-daemon
        run: cargo +1.75.0 check --locked --all-targets --all-features

  castle-wall-linux-integration:
    runs-on: ubuntu-24.04
    # Run as root so nftables + NFQUEUE + cgroup operations succeed
    # without additional capability grants. CAP_NET_ADMIN is available
    # to root by default on GitHub Actions Ubuntu runners.
    steps:
      - uses: actions/checkout@v7

      # CI-APT-RESILIENCE-01: routed through the shared apt-install-resilient
      # composite action (bounded, retried apt-get) after the unwrapped
      # shape of this same command hung for 2.5h-80min across four PRs on
      # 2026-08-19 in a sibling workflow; see that action's install.sh for
      # the timeout/retry derivation.
      - name: Install system dependencies
        uses: ./.github/actions/apt-install-resilient
        # Backstop ABOVE install.sh's own ~18.6 min worst case (two retried
        # phases). Lives here because a composite action's steps cannot carry
        # timeout-minutes; a workflow job's `uses:` step can.
        timeout-minutes: 22
        with:
          packages: nftables libnetfilter-queue-dev libnfnetlink-dev

      - name: Load nfnetlink_queue kernel module
        run: |
          sudo modprobe nfnetlink_queue || true
          lsmod | grep nfnetlink || echo "nfnetlink modules may be built-in"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-06-16
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            castle-wall-daemon/target
          key: castle-wall-${{ runner.os }}-cargo-${{ hashFiles('castle-wall-daemon/Cargo.lock', 'castle-wall-daemon/Cargo.toml') }}
          restore-keys: |
            castle-wall-${{ runner.os }}-cargo-

      - name: Verify nft binary available
        run: |
          which nft
          nft --version
          # Verify we can create tables (CAP_NET_ADMIN check)
          sudo nft add table inet test-cap-check
          sudo nft delete table inet test-cap-check
          echo "CAP_NET_ADMIN confirmed"

      - name: Verify cgroup v2 available
        run: |
          mount | grep cgroup2 || mount | grep "type cgroup2"
          ls /sys/fs/cgroup/cgroup.controllers
          echo "cgroup v2 confirmed"

      - name: Verify systemd available
        run: |
          systemctl --version || echo "systemd not available (expected in container)"
          # On GitHub Actions Ubuntu runners, systemd IS PID 1.
          cat /proc/1/comm

      - name: Panic-discipline gate (no unannotated unwrap/expect in src/)
        working-directory: castle-wall-daemon
        # Closes full-sweep #58 by structurally preventing regression of the
        # 5 PR #138 annotations. Test code (#[cfg(test)] mod blocks and the
        # tests/ directory) is excluded by design. Doc and framework at
        # castle-wall-daemon/docs/PANIC_DISCIPLINE.md.
        run: python3 scripts/check-panic-discipline.py

      - name: Panic-discipline gate self-tests
        working-directory: castle-wall-daemon
        run: python3 scripts/test_check_panic_discipline.py

      - name: Stdout-discipline gate (no unannotated println/eprintln in src/)
        working-directory: castle-wall-daemon
        # Closes full-sweep #98 by structurally preventing residual
        # println!/eprintln! from being introduced in production paths.
        # Test code (#[cfg(test)] mod blocks and the tests/ directory) is
        # excluded by design. Doc lives in the Log discipline section of
        # castle-wall-daemon/docs/PANIC_DISCIPLINE.md.
        run: python3 scripts/check-stdout-discipline.py

      - name: Stdout-discipline gate self-tests
        working-directory: castle-wall-daemon
        run: python3 scripts/test_check_stdout_discipline.py

      - name: cargo check
        working-directory: castle-wall-daemon
        # `--all-features` so the Linux-only integration suites (which declare
        # `required-features = ["test-isolation"]`) are actually type-checked here
        # rather than silently skipped.
        run: cargo check --locked --all-targets --all-features

      - name: cargo clippy (warnings as errors)
        working-directory: castle-wall-daemon
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22

      - name: cargo audit (RustSec advisory database)
        working-directory: castle-wall-daemon
        run: cargo audit --deny warnings

      - name: cargo test (lib + integration, as root for kernel access)
        working-directory: castle-wall-daemon
        run: |
          # Run all tests including Linux-gated integration tests.
          # NFQUEUE and nftables tests need root.
          #
          # `--features test-isolation` is REQUIRED, not optional: the Linux
          # integration suites declare it in `required-features`, so without it
          # cargo silently builds ZERO of them and the job passes having tested
          # nothing on the kernel path. The step below fails closed if that
          # happens. The feature also compiles the guard that refuses any `nft`
          # call against the production `sanctuary-castle` table, so these suites
          # cannot touch a runner's (or an operator's) live enforcement state.
          # `pipefail` is LOAD-BEARING here, not hygiene: without it the step's
          # exit status is `tee`'s (always 0) and a FAILING cargo suite produced a
          # green job, which the presence-grep below could not catch either
          # (a failing suite still prints its `Running tests/<suite>.rs` line).
          # The workflow-level `defaults.run.shell: bash` already supplies it;
          # this line is a deliberate local restatement so the invariant survives
          # someone deleting that block, and so the step reads correctly in
          # isolation. Must match the `defaults:` block at the top of this file.
          set -o pipefail
          sudo -E env "PATH=$PATH" cargo test --locked --all-targets --features test-isolation \
            -- --test-threads=1 2>&1 | tee cargo-test.log
          # Two DIFFERENT questions, both required:
          #   1. did cargo exit 0?  -> `pipefail` above
          #   2. did every intended suite actually BUILD and RUN?
          # Question 2 is not implied by question 1: a `required-features` target
          # that is not selected is silently absent from the run, and cargo still
          # exits 0 having tested nothing on that path. Keep this list equal to the
          # gated set in castle-wall-daemon/Cargo.toml; `tests/test_isolation_gate.rs`
          # pins that set from the other side.
          for suite in integration_linux_runtime_activation integration_kernel_binding \
                       integration_dns_bypass integration_failure_modes \
                       integration_manifest_and_drain test_isolation_gate; do
            grep -q "Running tests/$suite.rs" cargo-test.log || {
              echo "FAIL: $suite did not run; the test-isolation feature is required for it"
              exit 1
            }
          done
          # Every suite that ran must also have REPORTED a result line. A binary
          # that aborted (SIGSEGV, a panic in a harness thread, an OOM kill) prints
          # `Running tests/<suite>.rs` and then dies without `test result:`, which
          # the presence-grep alone would accept.
          started=$(grep -cE "^[[:space:]]*Running " cargo-test.log || true)
          finished=$(grep -cE "^test result: ok\." cargo-test.log || true)
          if [ "$started" != "$finished" ]; then
            echo "FAIL: $started test binaries started but only $finished reported \
'test result: ok.'; a suite aborted without reporting"
            exit 1
          fi
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: debug
          # Linux lifecycle tests may skip explicitly on ad-hoc unprivileged
          # hosts, but this job promises root/CAP_NET_ADMIN and must fail if that
          # precondition disappears rather than producing a false green.
          SANCTUARY_EXPECT_PRIVILEGED_LINUX: "1"

      - name: Cleanup nftables state
        if: always()
        run: |
          # The suites run against per-process `sanctuary-castle-test-<pid>` tables
          # (castle-wall-daemon/tests/isolation/mod.rs), so sweep those. The
          # production name is swept too, but only as a belt-and-braces step for a
          # runner that ran an older revision: nothing in this job creates it.
          for t in $(sudo nft list tables inet 2>/dev/null | awk '{print $3}' \
                     | grep -E '^sanctuary-castle(-test-[0-9a-f]+)?$' || true); do
            sudo nft delete table inet "$t" 2>/dev/null || true
          done

  # Static-binary build of the sanctuary-jail shim (B2 static-binary jail
  # delivery). The macOS launcher (SanctuaryGuestJail static-binary mode)
  # bind-mounts the aarch64 artifact into python-less guest images, so the
  # binary MUST be statically linked (libc-less guests) -- the build script
  # fails closed if it is not. The x86_64 artifact gets a functional smoke on
  # the runner itself: confinement install + exec, usage fail-closed, and
  # exec fail-closed.
  sanctuary-jail-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # CI-APT-RESILIENCE-01: routed through the shared apt-install-resilient
      # composite action (bounded, retried apt-get) after the unwrapped
      # shape of this same command hung for 2.5h-80min across four PRs on
      # 2026-08-19 in a sibling workflow; see that action's install.sh for
      # the timeout/retry derivation.
      - name: Install cross/static toolchain packages
        uses: ./.github/actions/apt-install-resilient
        # Backstop ABOVE install.sh's own ~18.6 min worst case (two retried
        # phases). Lives here because a composite action's steps cannot carry
        # timeout-minutes; a workflow job's `uses:` step can.
        timeout-minutes: 22
        with:
          packages: musl-tools gcc-aarch64-linux-gnu file

      - name: Install pinned Rust toolchain with musl targets
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-06-16
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            castle-wall-daemon/target
          key: sanctuary-jail-static-${{ runner.os }}-cargo-${{ hashFiles('castle-wall-daemon/Cargo.lock', 'castle-wall-daemon/Cargo.toml') }}
          restore-keys: |
            sanctuary-jail-static-${{ runner.os }}-cargo-

      - name: Build static sanctuary-jail (x86_64 + aarch64, fail-closed linkage check)
        working-directory: castle-wall-daemon
        run: bash scripts/build-sanctuary-jail-static.sh

      - name: Functional smoke (x86_64 on runner) -- confinement installs, exec works
        working-directory: castle-wall-daemon
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/sanctuary-jail
          # Happy path: shim confines itself then execs the target.
          out=$("$BIN" -- /bin/echo jail-exec-ok 2>stderr.log)
          [ "$out" = "jail-exec-ok" ] || { echo "FAIL: exec through shim did not run target"; exit 1; }
          grep -q 'launcher-applied seccomp-deny-AF_VSOCK installed' stderr.log \
            || { echo "FAIL: [JAIL] marker missing from shim stderr"; cat stderr.log; exit 1; }
          # Fail-closed: no -- separator is a usage error, exit nonzero.
          if "$BIN" /bin/true 2>/dev/null; then
            echo "FAIL: missing -- separator must be rejected"; exit 1
          fi
          # Fail-closed: exec failure exits nonzero (never falls through).
          if "$BIN" -- /nonexistent-program 2>/dev/null; then
            echo "FAIL: exec failure must exit nonzero"; exit 1
          fi
          echo "sanctuary-jail static smoke: PASS"

      # The macOS launcher authenticates the shim by a pinned SHA-256
      # computed on its staged copy (SanctuaryGuestJail static-binary
      # delivery: no hash, no static delivery). This manifest, produced in
      # the same job that built the artifacts, is the authentic source
      # operators pin staticJailBinarySHA256 from. It is printed to the job
      # log AND shipped inside the uploaded artifact.
      - name: Emit SHA-256 manifest (authentic pin source for static delivery)
        working-directory: castle-wall-daemon
        run: |
          sha256sum \
            target/x86_64-unknown-linux-musl/release/sanctuary-jail \
            target/aarch64-unknown-linux-musl/release/sanctuary-jail \
            | tee target/sanctuary-jail.SHA256SUMS

      - name: Upload static artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sanctuary-jail-static
          path: |
            castle-wall-daemon/target/x86_64-unknown-linux-musl/release/sanctuary-jail
            castle-wall-daemon/target/aarch64-unknown-linux-musl/release/sanctuary-jail
            castle-wall-daemon/target/sanctuary-jail.SHA256SUMS
          if-no-files-found: error
