name: Castle Wall macOS Release Build

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag (e.g., v1.4.0)"
        required: true
        type: string
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build-sign-notarize:
    # macOS 26 runner required: castle-wall-macos/Package.swift declares
    # .macOS("26.0") + tools 6.2 and depends on Apple's Containerization library
    # (README: macOS 26). Older runners (macos-15 / Xcode 16.x ship Swift 6.1 +
    # the macOS 15 SDK) fail at toolchain resolution and cannot compile against
    # the macOS 26 SDK, regardless of an installed toolchain. Matches the
    # PR-check workflow (castle-wall-macos.yml, PR #376) and COWORK lesson #78.
    runs-on: macos-26
    steps:
      # Full history is REQUIRED: build-signed.sh derives CFBundleVersion from
      # `git rev-list --count HEAD`, and macOS only replaces an activated system
      # extension when the version INCREASES. A shallow checkout makes the count 1,
      # so a CI-built extension can never upgrade a locally-built install (the
      # v1.7.2 artifact shipped as 0.1.0/1 against an active 0.1.0/1235 for
      # exactly this reason — confirmed 2026-08-05 by reading the artifact plist).
      # CSO-CICD-02 (supply-chain pin): release-triggered workflows call
      # third-party actions by immutable commit SHA, not a mutable tag, so a
      # hijacked upstream tag cannot inject code into this signing/notarizing
      # job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install pinned Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Build self-contained Castle Wall and CLI runtimes
        working-directory: server
        env:
          SANCTUARY_SOURCE_SHA: ${{ github.sha }}
        run: |
          npm ci --ignore-scripts
          npm run build
          test -s dist/boot-runtime/castle-wall-boot-daemon.js
          test -s dist/cli.js
          test -d dist/templates
          test -d dist/reference-plugin
          # npm currently retains viem's optional TypeScript peer even with
          # --omit=peer; keep the exact production closure and prove its size
          # below rather than deleting dependency bytes by guesswork.
          npm prune --omit=dev --omit=peer --ignore-scripts
          test -d node_modules/@modelcontextprotocol/sdk

      # Preflight: name the missing credential instead of dying inside Keychain.
      #
      # 2026-06-16 (run 27641268243) this job's only execution failed with
      # "SecKeychainItemImport: One or more parameters passed to a function were
      # not valid." That message reads like a malformed or expired certificate.
      # It was neither: none of the five Apple secrets had ever been set, so
      # P12_BASE64 was empty, `base64 --decode` produced a 0-byte file, and
      # `security import` rejected it as a bad parameter. The real fault was
      # six steps upstream of the error text, and the release pipeline sat
      # silently broken for six weeks because nothing said which input was absent.
      #
      # Absence must be representable. Check every secret this job consumes,
      # report ALL that are missing in one pass rather than one failure per run,
      # and never print a value.
      - name: Preflight signing and notarization credentials
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in P12_BASE64 P12_PASSWORD NOTARY_APPLE_ID NOTARY_PASSWORD TEAM_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Apple release credentials are not configured on this repository."
            echo "Missing (empty or unset):$missing"
            echo ""
            echo "Secret names, in repository Settings > Secrets and variables > Actions:"
            echo "  APPLE_DEVELOPER_ID_P12           base64 of the Developer ID Application .p12"
            echo "  APPLE_DEVELOPER_ID_P12_PASSWORD  the password used when exporting that .p12"
            echo "  APPLE_NOTARY_APPLE_ID            Apple ID used for notarytool"
            echo "  APPLE_NOTARY_PASSWORD            app-specific password for that Apple ID"
            echo "  APPLE_TEAM_ID                    Developer Team ID"
            echo ""
            echo "See .github/RELEASING.md for the export procedure."
            exit 1
          fi

          # Validate the p12 decodes and is really PKCS#12 before Keychain sees
          # it, so a truncated or mis-pasted secret reports as such rather than
          # as an opaque Keychain parameter error. Password is NOT checked here:
          # a wrong password must fail at import, not leak a distinguishing
          # signal from a step whose output is public.
          if ! printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/preflight.p12" 2>/dev/null; then
            echo "::error::APPLE_DEVELOPER_ID_P12 is not valid base64. Re-export and re-paste it."
            rm -f "$RUNNER_TEMP/preflight.p12"
            exit 1
          fi

          if [ ! -s "$RUNNER_TEMP/preflight.p12" ]; then
            echo "::error::APPLE_DEVELOPER_ID_P12 decoded to an empty file."
            rm -f "$RUNNER_TEMP/preflight.p12"
            exit 1
          fi

          if ! openssl asn1parse -inform DER -in "$RUNNER_TEMP/preflight.p12" >/dev/null 2>&1; then
            echo "::error::APPLE_DEVELOPER_ID_P12 decoded to $(wc -c < "$RUNNER_TEMP/preflight.p12" | tr -d ' ') bytes that are not a PKCS#12 container."
            rm -f "$RUNNER_TEMP/preflight.p12"
            exit 1
          fi

          rm -f "$RUNNER_TEMP/preflight.p12"
          echo "All five Apple credentials are present and the .p12 parses."

      # Presence is not validity. 2026-07-25 (run 30181951917) the step above
      # passed, the app built and signed, and the job then died at "Notarize and
      # staple" with Apple HTTP 401 "Invalid credentials": the notary secrets
      # were SET but WRONG, and the pipeline only learned that after the entire
      # build. Same failure class as the six-week silent gap that motivated the
      # presence preflight, one layer up.
      #
      # So before any build step, make the same round-trip to Apple that the
      # notarize step will make, using a cheap read-only call. `notarytool
      # history` authenticates with the identical apple-id/team-id/password
      # triple as `notarytool submit` and lists past submissions without
      # uploading anything, so it succeeds if and only if the notarize step's
      # credentials would be accepted.
      #
      # This step runs AFTER the presence checks on purpose: a missing secret
      # must still be reported as missing (by the step above), never as
      # "invalid". This step therefore only ever fires on secrets that exist
      # but are rejected by Apple. Never print a secret value; classify from
      # the HTTP status code alone and do not dump raw notarytool output
      # (it can echo the Apple ID back).
      - name: Preflight notary credential validity against Apple
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -u

          status=0
          output=$(xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" 2>&1) || status=$?

          if [ "$status" -eq 0 ]; then
            echo "Notary credentials are VALID: notarytool history round-trip to Apple succeeded."
            exit 0
          fi

          http_code=$(printf '%s' "$output" \
            | grep -oE 'HTTP status code: [0-9]{3}' \
            | head -n 1 \
            | grep -oE '[0-9]{3}' || true)

          echo "::error::Preflight check FAILED: notary credential VALIDITY (credentials are present but Apple rejected them)."
          echo "notarytool history exited with status $status before any build step ran."
          echo "The presence preflight already passed, so all five secrets are set; the notary triple (APPLE_NOTARY_APPLE_ID / APPLE_NOTARY_PASSWORD / APPLE_TEAM_ID) is being rejected or is unreachable."
          echo ""
          case "$http_code" in
            401)
              echo "Apple error class: HTTP 401 invalid credentials. The Apple ID + app-specific password + Team ID combination was rejected."
              echo "Fix: regenerate the app-specific password at appleid.apple.com (Sign-In and Security > App-Specific Passwords) and paste the NEW value into the APPLE_NOTARY_PASSWORD repository secret."
              echo "The Apple ID account password will NOT work; notarytool requires an app-specific password."
              ;;
            403)
              echo "Apple error class: HTTP 403 forbidden. Usually a pending developer-agreement or account/team access issue, not a wrong password."
              echo "Fix: sign in at developer.apple.com with the notary Apple ID and accept any pending agreements, then re-run."
              ;;
            "")
              echo "Apple error class: no HTTP status code in notarytool output. Likely a network failure, an Xcode command-line-tools problem on the runner, or a malformed invocation rather than a credential rejection."
              echo "Fix: re-run the job; if it persists, run the same notarytool history call locally with the same credentials to see the full error."
              ;;
            *)
              echo "Apple error class: HTTP $http_code (neither 401 invalid-credentials nor 403 agreement/access)."
              echo "Fix: run the same notarytool history call locally with the same credentials to see the full error."
              ;;
          esac
          exit 1

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

      # `build-signed.sh --wrapped` notarizes INLINE when NOTARYTOOL_PROFILE names
      # a stored notarytool keychain profile, and otherwise refuses, because a
      # signed-but-unnotarized .systemextension is silently uninstalled by Tahoe
      # sysextd at validation (drill 2026-06-11c, finding W6-N1). This job has no
      # such profile: it holds the raw Apple ID + app-specific password as secrets
      # and notarizes in the dedicated step below.
      #
      # `--allow-unnotarized` therefore says "this step is not the notarizing
      # step", NOT "ship it unnotarized". The guard's intent is preserved by the
      # Notarize step, which is mandatory here and fails the job if it does not
      # run. Do NOT use this flag in a path that has no following notarization.
      - name: Build, wrap, and sign
        working-directory: castle-wall-macos
        env:
          SIGNING_IDENTITY: "Developer ID Application: Erik Newton (YFQSWQ9BJN)"
          SANCTUARY_REQUIRE_BOOT_RUNTIME: "1"
          SANCTUARY_BOOT_RUNTIME_DAEMON: ${{ github.workspace }}/server/dist/boot-runtime/castle-wall-boot-daemon.js
          SANCTUARY_CLI_RUNTIME_DIR: ${{ github.workspace }}/server/dist
        run: |
          # setup-node places `node` on PATH. Resolve the exact executable here;
          # do not depend on an action-internal directory convention.
          SANCTUARY_BOOT_RUNTIME_NODE="$(command -v node)"
          export SANCTUARY_BOOT_RUNTIME_NODE
          swift build -c release
          bash scripts/build-wrapped.sh
          bash scripts/build-signed.sh --wrapped --allow-unnotarized

      - name: Assert sealed boot runtime
        working-directory: castle-wall-macos
        run: |
          APP="build/Sanctuary-CastleWall.app"
          RUNTIME="$APP/Contents/Resources/boot-runtime"
          NODE="$RUNTIME/node"
          DAEMON="$RUNTIME/castle-wall-boot-daemon.js"
          CLI_RUNTIME="$APP/Contents/Resources/cli-runtime"
          CLI="$CLI_RUNTIME/dist/cli.js"
          LAUNCHER="$APP/Contents/MacOS/sanctuary"
          MANIFEST="$APP/Contents/Resources/cli-runtime-manifest.json"
          SIGNER="$APP/Contents/MacOS/castle-wall-signer-client"
          EXPECTED_VERSION=$(node -p "require('../server/package.json').version")

          test -x "$NODE"
          test -s "$DAEMON"
          test -x "$SIGNER"
          test -s "$CLI"
          test -s "$CLI_RUNTIME/package.json"
          test -x "$LAUNCHER"
          test -s "$MANIFEST"
          test -d "$CLI_RUNTIME/node_modules/@modelcontextprotocol/sdk"
          test -d "$CLI_RUNTIME/templates"
          test -d "$CLI_RUNTIME/reference-plugin"
          test "$(stat -f '%Lp' "$NODE")" = 555
          test "$(stat -f '%Lp' "$DAEMON")" = 444
          test "$(stat -f '%Lp' "$CLI")" = 444
          test -z "$(find "$CLI_RUNTIME" -type l -print -quit)"

          codesign --verify --strict \
            --requirement='anchor apple generic and certificate leaf[subject.OU] = "YFQSWQ9BJN" and identifier "ai.sanctuaryprotocol.macos.castle-wall.node"' \
            "$NODE"
          NODE_ENTITLEMENTS="$RUNNER_TEMP/castle-wall-node-entitlements.plist"
          codesign -d --entitlements - --xml "$NODE" > "$NODE_ENTITLEMENTS" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-jit' "$NODE_ENTITLEMENTS")" = true
          test "$(plutil -p "$NODE_ENTITLEMENTS" | grep -c ' => ')" = 1
          codesign --verify --strict \
            --requirement='anchor apple generic and certificate leaf[subject.OU] = "YFQSWQ9BJN" and identifier "ai.sanctuaryprotocol.macos.castle-wall.signer-client"' \
            "$SIGNER"
          codesign --verify --strict \
            --requirement='anchor apple generic and certificate leaf[subject.OU] = "YFQSWQ9BJN" and identifier "ai.sanctuaryprotocol.macos.castle-wall.sanctuary-launcher"' \
            "$LAUNCHER"
          MACH_O_COUNT=0
          while IFS= read -r -d '' addon; do
            codesign --verify --strict \
              --requirement='anchor apple generic and certificate leaf[subject.OU] = "YFQSWQ9BJN"' \
              "$addon"
            MACH_O_COUNT=$((MACH_O_COUNT + 1))
          done < <(node scripts/list-cli-runtime-mach-o.mjs "$CLI_RUNTIME")
          test "$MACH_O_COUNT" -ge 2

          node -e '
            const { readFileSync } = require("node:fs");
            const { resolve } = require("node:path");
            const m = JSON.parse(readFileSync(resolve(process.argv[1]), "utf8"));
            const i = m.inventory;
            const roots = m.files.filter(f => {
              const s = f.path.split("/");
              return f.path === "Resources/cli-runtime/package.json" ||
                (s.at(-1) === "package.json" && (s.at(-3) === "node_modules" ||
                  (s.at(-4) === "node_modules" && s.at(-3).startsWith("@"))));
            });
            const packageJsonCount = m.files.filter(f => f.path.endsWith("/package.json")).length;
            const nestedPackageCount = roots.filter(f => f.path.split("/node_modules/").length > 2).length;
            if (i.file_count > 30000 || i.total_bytes > 420 * 1024 * 1024) process.exit(1);
            if (i.mach_o_count !== Number(process.argv[2]) || i.package_count !== roots.length) process.exit(1);
            if (i.package_json_count !== packageJsonCount || i.package_internal_json_count !== packageJsonCount - roots.length) process.exit(1);
            if (i.nested_package_count !== nestedPackageCount) process.exit(1);
            if (!i.mach_o.some(p => p.includes("/@lmdb/") && p.endsWith(".node"))) process.exit(1);
            if (!i.mach_o.some(p => p.includes("/@msgpackr-extract/") && p.endsWith(".node"))) process.exit(1);
            console.log(JSON.stringify({
              file_count: i.file_count, total_bytes: i.total_bytes,
              installed_package_roots: i.package_count,
              nested_installed_package_roots: i.nested_package_count,
              package_internal_json_excluded: i.package_internal_json_count,
              mach_o_count: i.mach_o_count,
            }));
          ' "$MANIFEST" "$MACH_O_COUNT"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SanctuaryCliRuntimeVersion' "$APP/Contents/Info.plist")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SanctuaryCastleWallSourceSHA' "$APP/Contents/Info.plist")" = "$GITHUB_SHA"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SanctuaryCliRuntimeNodeVersion' "$APP/Contents/Info.plist")" = "$("$NODE" --version)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SanctuaryCliRuntimeManifestSHA256' "$APP/Contents/Info.plist")" = "$(shasum -a 256 "$MANIFEST" | awk '{print $1}')"

          for executable in "$NODE" "$SIGNER"; do
            unsafe=$(otool -L "$executable" | awk 'NR > 1 { print $1 }' \
              | grep -Ev '^(/System/Library/|/usr/lib/)' || true)
            if [ -n "$unsafe" ]; then
              echo "::error::$executable has a non-system dynamic-library dependency: $unsafe"
              exit 1
            fi
          done

          # Exercise the copied pair without the repository or node_modules.
          # The only expected failure is the absent per-fortress boot token.
          SMOKE_DIR=$(mktemp -d "$RUNNER_TEMP/castle-wall-boot-runtime.XXXXXX")
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          cp "$NODE" "$SMOKE_DIR/node"
          cp "$DAEMON" "$SMOKE_DIR/daemon.js"
          set +e
          "$SMOKE_DIR/node" "$SMOKE_DIR/daemon.js" castle-wall daemon \
            --safe-mode --launchd --fortress "$SMOKE_DIR/fortress" >"$SMOKE_DIR/output" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::standalone boot runtime unexpectedly started without a per-fortress boot token"
            cat "$SMOKE_DIR/output"
            exit 1
          fi
          if ! grep -qi 'boot token' "$SMOKE_DIR/output"; then
            echo "::error::standalone boot runtime failed before reaching the expected boot-token custody gate"
            cat "$SMOKE_DIR/output"
            exit 1
          fi
          /usr/bin/env -i PATH=/usr/bin:/bin NODE_OPTIONS='--require=/definitely/missing' NODE_PATH=/definitely/missing \
            "$LAUNCHER" --version \
            | grep -Fx "@sanctuary-framework/mcp-server $EXPECTED_VERSION"
          "$NODE" -e '
            const load = require("node:module").createRequire(
              require("node:path").resolve(process.argv[1]),
            );
            load("lmdb");
            load("msgpackr-extract");
          ' "$CLI_RUNTIME/package.json"
          FAKE_ROOT="$SMOKE_DIR/argv0-proof"
          mkdir -p "$FAKE_ROOT/Contents/MacOS" "$FAKE_ROOT/Contents/Resources/boot-runtime" "$FAKE_ROOT/Contents/Resources/cli-runtime/dist"
          printf '#!/bin/sh\necho ATTACKER-RUNTIME\n' > "$FAKE_ROOT/Contents/Resources/boot-runtime/node"
          chmod +x "$FAKE_ROOT/Contents/Resources/boot-runtime/node"
          printf 'throw new Error("attacker runtime")\n' > "$FAKE_ROOT/Contents/Resources/cli-runtime/dist/cli.js"
          /usr/bin/env -i PATH=/usr/bin:/bin /bin/zsh -c \
            'ARGV0="$1/Contents/MacOS/sanctuary" "$2" --version' _ "$FAKE_ROOT" "$LAUNCHER" \
            | grep -Fx "@sanctuary-framework/mcp-server $EXPECTED_VERSION"

      # Fail-closed launchability assertions, BEFORE notarization spends time
      # and an Apple round-trip on a bundle that cannot launch.
      #
      # Why: the v1.7.0 and v1.7.1 release assets were signed and notarized
      # but could not launch on any Mac. Their binaries claim restricted
      # entitlements (com.apple.developer.system-extension.install plus the
      # networkextension content-filter provider), and AMFI refuses to spawn
      # a restricted-entitlement binary whose bundle has no
      # Contents/embedded.provisionprofile ("Launchd job spawn failed", RBS
      # error 5). Signing, notarization, spctl, and stapler ALL pass on such
      # a bundle; none of them checks for the profile. These assertions do.
      #
      # The profiles now live in the repo at castle-wall-macos/signing/ and
      # are embedded by build-signed.sh before codesign seals the bundle. A
      # provisioning profile is NOT a secret: it ships inside every
      # distributed app, readable by anyone who downloads the release zip,
      # and cannot sign anything.
      #
      # The script asserts, each failure naming exactly what is missing:
      #   1. Contents/embedded.provisionprofile exists in the outer app;
      #   2. the nested .systemextension has its own embedded profile
      #      (the working local build carries both);
      #   3. every restricted entitlement the signed binaries claim is
      #      covered by the embedded profile's grant (security cms -D +
      #      plist comparison);
      #   4. codesign --verify --deep --strict passes (a profile copied in
      #      AFTER signing breaks the seal and fails here).
      - name: Assert embedded provisioning profiles and entitlement coverage
        working-directory: castle-wall-macos
        run: bash scripts/verify-embedded-profiles.sh build/Sanctuary-CastleWall.app

      # Ordering matters and was wrong before: the uploaded artifact used to be a
      # zip taken BEFORE `stapler staple`, so Apple held the ticket while the
      # shipped bundle did not carry it. That bundle passes `spctl` on a machine
      # that can reach Apple and fails Gatekeeper offline, which is the worst
      # place to discover it. Staple the .app first, prove the ticket is attached
      # with `stapler validate`, and only then produce the artifact zip.
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        working-directory: castle-wall-macos
        run: |
          set -euo pipefail

          # Submission zip is a transient input to notarytool, never the artifact.
          ditto -c -k --keepParent build/Sanctuary-CastleWall.app "$RUNNER_TEMP/notarize-submission.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize-submission.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --wait
          rm -f "$RUNNER_TEMP/notarize-submission.zip"

          xcrun stapler staple build/Sanctuary-CastleWall.app

          # `stapler validate` is the check that the ticket is actually ATTACHED
          # to the bundle. `spctl` alone can pass on a networked machine via an
          # online lookup, so it cannot distinguish stapled from merely notarized.
          xcrun stapler validate build/Sanctuary-CastleWall.app
          spctl --assess --type execute --verbose=4 build/Sanctuary-CastleWall.app

          # `codesign --deep` does not reliably discover arbitrary Mach-O files
          # under Contents/Resources. Re-verify the embedded Node executable
          # after stapling so a valid outer app cannot conceal damaged runtime
          # code that launchd will later snapshot into root custody.
          codesign --verify --strict \
            --requirement='anchor apple generic and certificate leaf[subject.OU] = "YFQSWQ9BJN" and identifier "ai.sanctuaryprotocol.macos.castle-wall.node"' \
            build/Sanctuary-CastleWall.app/Contents/Resources/boot-runtime/node

          # Artifact zip is produced from the STAPLED bundle.
          ditto -c -k --keepParent build/Sanctuary-CastleWall.app build/Sanctuary-CastleWall.app.zip

          # Validate the exact bytes consumers receive, not merely the build
          # tree from which the archive was produced. Extraction must preserve
          # the nested signature and the sealed pair must still reach the
          # expected boot-token custody gate outside the repository.
          ARTIFACT_CHECK_DIR=$(mktemp -d "$RUNNER_TEMP/castle-wall-artifact.XXXXXX")
          CANONICAL_APP="/Applications/Sanctuary-CastleWall.app"
          CANONICAL_APP_INSTALLED=false
          cleanup_artifact_validation() {
            validation_status=$?
            trap - EXIT
            set +e
            cleanup_failed=false

            if [ -e "$ARTIFACT_CHECK_DIR" ]; then
              chmod -R u+rwX "$ARTIFACT_CHECK_DIR" 2>/dev/null
              if [ "$?" -ne 0 ]; then
                echo "::error::could not restore owner permissions on artifact validation directory"
                cleanup_failed=true
              fi
              rm -rf "$ARTIFACT_CHECK_DIR"
              if [ "$?" -ne 0 ]; then
                echo "::error::could not remove artifact validation directory: $ARTIFACT_CHECK_DIR"
                cleanup_failed=true
              fi
            fi

            if [ "$CANONICAL_APP_INSTALLED" = true ] && [ -e "$CANONICAL_APP" ]; then
              chmod -R u+rwX "$CANONICAL_APP" 2>/dev/null
              if [ "$?" -ne 0 ]; then
                echo "::error::could not restore owner permissions on job-installed canonical app"
                cleanup_failed=true
              fi
              rm -rf "$CANONICAL_APP"
              if [ "$?" -ne 0 ]; then
                echo "::error::could not remove job-installed canonical app: $CANONICAL_APP"
                cleanup_failed=true
              fi
            fi

            if [ "$cleanup_failed" = true ]; then
              echo "::error::release validation cleanup was incomplete; validation exit status was $validation_status"
              if [ "$validation_status" -eq 0 ]; then
                exit 1
              fi
            fi
            exit "$validation_status"
          }
          trap cleanup_artifact_validation EXIT
          ditto -x -k build/Sanctuary-CastleWall.app.zip "$ARTIFACT_CHECK_DIR"
          ARTIFACT_APP="$ARTIFACT_CHECK_DIR/Sanctuary-CastleWall.app"
          ARTIFACT_RUNTIME="$ARTIFACT_APP/Contents/Resources/boot-runtime"
          ARTIFACT_CLI_RUNTIME="$ARTIFACT_APP/Contents/Resources/cli-runtime"
          ARTIFACT_LAUNCHER="$ARTIFACT_APP/Contents/MacOS/sanctuary"
          ARTIFACT_MANIFEST="$ARTIFACT_APP/Contents/Resources/cli-runtime-manifest.json"
          EXPECTED_VERSION=$(node -p "require('../server/package.json').version")
          codesign --verify --deep --strict "$ARTIFACT_APP"
          codesign --verify --strict \
            --requirement='anchor apple generic and certificate leaf[subject.OU] = "YFQSWQ9BJN" and identifier "ai.sanctuaryprotocol.macos.castle-wall.node"' \
            "$ARTIFACT_RUNTIME/node"
          ARTIFACT_NODE_ENTITLEMENTS="$ARTIFACT_CHECK_DIR/node-entitlements.plist"
          codesign -d --entitlements - --xml "$ARTIFACT_RUNTIME/node" \
            > "$ARTIFACT_NODE_ENTITLEMENTS" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-jit' "$ARTIFACT_NODE_ENTITLEMENTS")" = true
          test "$(plutil -p "$ARTIFACT_NODE_ENTITLEMENTS" | grep -c ' => ')" = 1
          test -s "$ARTIFACT_CLI_RUNTIME/dist/cli.js"
          test -s "$ARTIFACT_CLI_RUNTIME/package.json"
          test -d "$ARTIFACT_CLI_RUNTIME/templates"
          test -d "$ARTIFACT_CLI_RUNTIME/reference-plugin"
          test -d "$ARTIFACT_CLI_RUNTIME/node_modules/@modelcontextprotocol/sdk"
          test -x "$ARTIFACT_LAUNCHER"
          test -s "$ARTIFACT_MANIFEST"
          test -z "$(find "$ARTIFACT_CLI_RUNTIME" -type l -print -quit)"
          xcrun stapler validate "$ARTIFACT_APP"
          spctl --assess --type execute --verbose=4 "$ARTIFACT_APP"

          codesign --verify --strict \
            --requirement='anchor apple generic and certificate leaf[subject.OU] = "YFQSWQ9BJN" and identifier "ai.sanctuaryprotocol.macos.castle-wall.sanctuary-launcher"' \
            "$ARTIFACT_LAUNCHER"
          ARTIFACT_MACH_O_COUNT=0
          while IFS= read -r -d '' addon; do
            codesign --verify --strict \
              --requirement='anchor apple generic and certificate leaf[subject.OU] = "YFQSWQ9BJN"' \
              "$addon"
            ARTIFACT_MACH_O_COUNT=$((ARTIFACT_MACH_O_COUNT + 1))
          done < <(node scripts/list-cli-runtime-mach-o.mjs "$ARTIFACT_CLI_RUNTIME")
          test "$ARTIFACT_MACH_O_COUNT" -ge 2
          test "$(/usr/libexec/PlistBuddy -c 'Print :SanctuaryCliRuntimeManifestSHA256' "$ARTIFACT_APP/Contents/Info.plist")" = "$(shasum -a 256 "$ARTIFACT_MANIFEST" | awk '{print $1}')"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$ARTIFACT_APP/Contents/Info.plist")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SanctuaryCastleWallSourceSHA' "$ARTIFACT_APP/Contents/Info.plist")" = "$GITHUB_SHA"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SanctuaryCliRuntimeNodeVersion' "$ARTIFACT_APP/Contents/Info.plist")" = "$("$ARTIFACT_RUNTIME/node" --version)"
          /usr/bin/env -i PATH=/usr/bin:/bin NODE_OPTIONS='--require=/definitely/missing' NODE_PATH=/definitely/missing \
            "$ARTIFACT_LAUNCHER" --version \
            | grep -Fx "@sanctuary-framework/mcp-server $EXPECTED_VERSION"
          "$ARTIFACT_RUNTIME/node" -e '
            const load = require("node:module").createRequire(
              require("node:path").resolve(process.argv[1]),
            );
            load("lmdb");
            load("msgpackr-extract");
          ' "$ARTIFACT_CLI_RUNTIME/package.json"
          FAKE_ARTIFACT_ROOT="$ARTIFACT_CHECK_DIR/argv0-proof"
          mkdir -p "$FAKE_ARTIFACT_ROOT/Contents/MacOS" "$FAKE_ARTIFACT_ROOT/Contents/Resources/boot-runtime" "$FAKE_ARTIFACT_ROOT/Contents/Resources/cli-runtime/dist"
          printf '#!/bin/sh\necho ATTACKER-RUNTIME\n' > "$FAKE_ARTIFACT_ROOT/Contents/Resources/boot-runtime/node"
          chmod +x "$FAKE_ARTIFACT_ROOT/Contents/Resources/boot-runtime/node"
          printf 'throw new Error("attacker runtime")\n' > "$FAKE_ARTIFACT_ROOT/Contents/Resources/cli-runtime/dist/cli.js"
          /usr/bin/env -i PATH=/usr/bin:/bin /bin/zsh -c \
            'ARGV0="$1/Contents/MacOS/sanctuary" "$2" --version' _ "$FAKE_ARTIFACT_ROOT" "$ARTIFACT_LAUNCHER" \
            | grep -Fx "@sanctuary-framework/mcp-server $EXPECTED_VERSION"

          test ! -e "$CANONICAL_APP"
          # From this point onward any complete or partial destination tree was
          # created by this job and is therefore safe for the EXIT trap to remove.
          CANONICAL_APP_INSTALLED=true
          ditto "$ARTIFACT_APP" "$CANONICAL_APP"
          mkdir -p "$ARTIFACT_CHECK_DIR/home" "$ARTIFACT_CHECK_DIR/fortress"
          PLAN_JSON=$(/usr/bin/env -i HOME="$ARTIFACT_CHECK_DIR/home" PATH=/usr/bin:/bin \
            SANCTUARY_STORAGE_PATH="$ARTIFACT_CHECK_DIR/fortress" \
            "$CANONICAL_APP/Contents/MacOS/sanctuary" install --profile full --harness hermes --json)
          printf '%s' "$PLAN_JSON" | EXPECTED_FORTRESS="$ARTIFACT_CHECK_DIR/fortress" node -e '
            const plan = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const argv = plan.next_action?.argv ?? [];
            const launcher = "/Applications/Sanctuary-CastleWall.app/Contents/MacOS/sanctuary";
            const expected = [
              launcher, "--fortress", process.env.EXPECTED_FORTRESS, "protect", "--hermes",
              "--no-open", "--agent-guided", "--sealed-launcher", launcher,
              "--operator-custody", "--no-provision-agent-account",
            ];
            if (plan.status !== "human_action") process.exit(1);
            if (plan.next_action?.id !== "prepare_local_keychain_session") process.exit(1);
            if (plan.next_action?.actor !== "human") process.exit(1);
            if (JSON.stringify(argv) !== JSON.stringify(expected)) process.exit(1);
            if (argv.some(arg => /(^|\/)(npm|npx|node)$/.test(arg))) process.exit(1);
            if (!plan.next_action?.secret_boundary?.includes("Do not paste")) process.exit(1);
          '

          set +e
          "$ARTIFACT_RUNTIME/node" "$ARTIFACT_RUNTIME/castle-wall-boot-daemon.js" \
            castle-wall daemon --safe-mode --launchd \
            --fortress "$ARTIFACT_CHECK_DIR/fortress" \
            >"$ARTIFACT_CHECK_DIR/runtime-output" 2>&1
          artifact_runtime_status=$?
          set -e
          if [ "$artifact_runtime_status" -eq 0 ] \
            || ! grep -qi 'boot token' "$ARTIFACT_CHECK_DIR/runtime-output"; then
            echo "::error::shipped boot runtime did not reach the expected boot-token custody gate"
            cat "$ARTIFACT_CHECK_DIR/runtime-output"
            exit 1
          fi

      # Launch smoke test: prove the exact bundle we ship can be SPAWNED.
      #
      # Mechanism: direct-exec the host binary in `--headless status` mode
      # (built for no-WindowServer contexts) under a watchdog. An AMFI spawn
      # refusal kills the process with SIGKILL before main() ever runs and
      # produces no output; measured on the broken v1.7.1 asset this is an
      # instant exit 137. So the classification is:
      #   - killed by a signal (exit >= 128) or exec failure (126/127):
      #     FAIL loudly with the signal/exit diagnosis. This is the
      #     v1.7.0/v1.7.1 defect class.
      #   - any controlled exit (0-4, the headless CLI contract codes): PASS.
      #     AMFI refusal can never produce a controlled exit, so reaching
      #     main() and returning a contract code proves spawnability.
      #   - still alive after the watchdog cap: it spawned and ran; kill it
      #     and PASS.
      #
      # What this proves and does not prove: it proves the signed, stapled
      # bundle passes the AMFI entitlement/profile check and executes our
      # code on a stock macOS runner - the exact check that killed
      # v1.7.0/v1.7.1. It does NOT prove filter enforcement, system
      # extension activation (needs one-time console consent), or a full
      # LaunchServices GUI launch (a CI runner has no interactive login
      # session to test that in); those remain hardware-drill territory.
      - name: Launch smoke test (spawnability, fail closed)
        working-directory: castle-wall-macos
        run: |
          set -uo pipefail
          BIN="build/Sanctuary-CastleWall.app/Contents/MacOS/CastleWallHostApp"
          test -x "$BIN" || { echo "::error::smoke test: host binary missing at $BIN"; exit 1; }

          "$BIN" --headless status > "$RUNNER_TEMP/smoke-out.txt" 2> "$RUNNER_TEMP/smoke-err.txt" &
          pid=$!

          # 3-second watchdog window: AMFI kills are effectively instant.
          early_death=false
          for _ in $(seq 1 30); do
            kill -0 "$pid" 2>/dev/null || { early_death=true; break; }
            sleep 0.1
          done

          we_killed=false
          if [ "$early_death" = false ]; then
            # Survived the spawn window. Allow up to 35 more seconds for the
            # headless status call (30s internal timeout) to exit on its own,
            # then reap it ourselves.
            for _ in $(seq 1 350); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.1
            done
            if kill -0 "$pid" 2>/dev/null; then
              we_killed=true
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

          set +e
          wait "$pid"
          status=$?
          set -e

          echo "--- stdout ---"; cat "$RUNNER_TEMP/smoke-out.txt" || true
          echo "--- stderr ---"; cat "$RUNNER_TEMP/smoke-err.txt" || true

          if [ "$we_killed" = true ]; then
            echo "smoke test PASS: process spawned and was still running at the watchdog cap (killed by the test, not the OS)."
            exit 0
          fi
          if [ "$status" -ge 128 ]; then
            sig=$((status - 128))
            echo "::error::smoke test FAIL: host binary died from signal $sig (exit $status). Signal 9 within the spawn window is the AMFI kill that shipped in v1.7.0/v1.7.1 (restricted entitlements without an embedded provisioning profile)."
            exit 1
          fi
          if [ "$status" -eq 126 ] || [ "$status" -eq 127 ]; then
            echo "::error::smoke test FAIL: host binary could not be executed at all (exit $status)."
            exit 1
          fi
          if [ "$status" -le 4 ]; then
            echo "smoke test PASS: controlled exit $status (headless CLI contract code); the process spawned and executed application code."
          else
            echo "smoke test PASS on spawnability: controlled exit $status (outside the 0-4 contract range, logged for the record); the process spawned and executed application code."
          fi

      - name: Upload signed artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Sanctuary-CastleWall-${{ inputs.version_tag || github.event.release.tag_name }}
          path: |
            castle-wall-macos/build/Sanctuary-CastleWall.app.zip
          retention-days: 90

      - name: SHA-256
        working-directory: castle-wall-macos
        run: shasum -a 256 build/Sanctuary-CastleWall.app.zip | tee build/sha256.txt

      - name: Cleanup signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
