name: Castle Wall macOS Release Build

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag (e.g., v1.4.0)"
        required: true
        type: string
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build-sign-notarize:
    # macOS 26 runner required: castle-wall-macos/Package.swift declares
    # .macOS("26.0") + tools 6.2 and depends on Apple's Containerization library
    # (README: macOS 26). Older runners (macos-15 / Xcode 16.x ship Swift 6.1 +
    # the macOS 15 SDK) fail at toolchain resolution and cannot compile against
    # the macOS 26 SDK, regardless of an installed toolchain. Matches the
    # PR-check workflow (castle-wall-macos.yml, PR #376) and COWORK lesson #78.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build, wrap, and sign
        working-directory: castle-wall-macos
        env:
          SIGNING_IDENTITY: "Developer ID Application: Erik Newton (YFQSWQ9BJN)"
        run: |
          swift build -c release
          bash scripts/build-wrapped.sh
          bash scripts/build-signed.sh --wrapped

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        working-directory: castle-wall-macos
        run: |
          ditto -c -k --keepParent build/Sanctuary-CastleWall.app build/Sanctuary-CastleWall.app.zip
          xcrun notarytool submit build/Sanctuary-CastleWall.app.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple build/Sanctuary-CastleWall.app
          spctl --assess --type execute --verbose=4 build/Sanctuary-CastleWall.app

      - name: Upload signed artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sanctuary-CastleWall-${{ inputs.version_tag || github.event.release.tag_name }}
          path: |
            castle-wall-macos/build/Sanctuary-CastleWall.app.zip
          retention-days: 90

      - name: SHA-256
        working-directory: castle-wall-macos
        run: shasum -a 256 build/Sanctuary-CastleWall.app.zip | tee build/sha256.txt

      - name: Cleanup signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
