name: Verify Fail Before

on:
  pull_request:
    branches: [main]
    paths:
      # Must match the CHANGED_SRC filter in scripts/verify-fail-before.sh: the
      # guard only reasons about TypeScript source, so a docs-only edit under
      # server/src (for example server/src/README.md) must not trigger it.
      # Failure mode when these drift apart: the job starts on a PR with no
      # TypeScript change and reds asking for a failing test that cannot exist.
      # Both the flat and nested forms are listed on purpose. GitHub's `**`
      # spans slashes, so `server/src/**/*.ts` requires at least one directory
      # level and would silently skip top-level files such as
      # server/src/index.ts. Under-triggering disables the guard without any
      # visible signal, which is worse than the over-trigger being fixed here.
      - "server/src/*.ts"
      - "server/src/*.tsx"
      - "server/src/**/*.ts"
      - "server/src/**/*.tsx"
      - "server/test/**/*.test.ts"
      - "scripts/verify-fail-before.sh"
      - ".github/workflows/verify-fail-before.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-fail-before:
    name: verify-fail-before
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Verify changed tests fail before source fix
        env:
          SKIP_FAIL_BEFORE: ${{ vars.SKIP_FAIL_BEFORE }}
          SKIP_REASON: ${{ vars.SKIP_FAIL_BEFORE_REASON }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            scripts/verify-fail-before.sh "origin/${{ github.base_ref }}"
          else
            scripts/verify-fail-before.sh "origin/main"
          fi
