name: Verify Fail Before

on:
  pull_request:
    branches: [main]
    paths:
      # Must match the CHANGED_SRC filter in scripts/verify-fail-before.sh,
      # which is a DOCUMENTATION DENYLIST, not an extension allowlist: every
      # file under server/src triggers this job except prose, because behavior
      # there also lives in .mjs plugin executables, .yaml policy templates,
      # .json template payloads and trust anchors, .rs probe loaders, and
      # .txt/.hosts rules data. An allowlist of `.ts`/`.tsx` here would let a
      # PR touching only those files skip the guard entirely.
      # Failure mode when these drift apart: over-trigger reds the job on a PR
      # with no behavior change, asking for a failing test that cannot exist;
      # under-trigger disables the guard with no visible signal at all, which is
      # the worse half and the reason the default is now "guard it".
      # Both the flat and nested negations are listed on purpose. GitHub's `**`
      # spans slashes, so `server/src/**/*.md` requires at least one directory
      # level and would silently skip top-level files such as
      # server/src/README.md, leaving the over-trigger in place for exactly the
      # file that motivated the exemption.
      - "server/src/**"
      - "!server/src/*.md"
      - "!server/src/**/*.md"
      - "server/test/**/*.test.ts"
      - "scripts/verify-fail-before.sh"
      # The guard's own guard. Without this entry a change to the harness alone
      # would not run it, which is the same shape of silence the guard exists to
      # prevent: a check that stops running emits no signal that it stopped.
      - "scripts/verify-fail-before-self-test.sh"
      - ".github/workflows/verify-fail-before.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-fail-before:
    name: verify-fail-before
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runs BEFORE the Node setup on purpose: the harness drives
      # verify-fail-before.sh against disposable git fixtures with a fake `npx`
      # on PATH, so it needs neither Node nor `npm ci`, takes a few seconds, and
      # a broken guard should red before two minutes of install.
      #
      # This step is the harness's only consumer. Its absence was the defect it
      # now closes: the self-tests existed, passed, and were invoked by no
      # workflow, no npm script, and no hook, so a change reverting the guard
      # would have reddened nothing. It is deliberately a step in this job
      # rather than a job of its own, because a new job name is a new check that
      # every already-open PR would have to be updated to acquire.
      - name: Self-test the fail-before guard
        run: bash scripts/verify-fail-before-self-test.sh

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Verify changed tests fail before source fix
        env:
          SKIP_FAIL_BEFORE: ${{ vars.SKIP_FAIL_BEFORE }}
          SKIP_REASON: ${{ vars.SKIP_FAIL_BEFORE_REASON }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            scripts/verify-fail-before.sh "origin/${{ github.base_ref }}"
          else
            scripts/verify-fail-before.sh "origin/main"
          fi
