name: Verify Fail Before

on:
  pull_request:
    branches: [main]
    paths:
      # Must match the CHANGED_SRC filter in scripts/verify-fail-before.sh,
      # which is a DOCUMENTATION DENYLIST, not an extension allowlist: every
      # file under server/src triggers this job except prose, because behavior
      # there also lives in .mjs plugin executables, .yaml policy templates,
      # .json template payloads and trust anchors, .rs probe loaders, and
      # .txt/.hosts rules data. An allowlist of `.ts`/`.tsx` here would let a
      # PR touching only those files skip the guard entirely.
      # Failure mode when these drift apart: over-trigger reds the job on a PR
      # with no behavior change, asking for a failing test that cannot exist;
      # under-trigger disables the guard with no visible signal at all, which is
      # the worse half and the reason the default is now "guard it".
      # Both the flat and nested negations are listed on purpose. GitHub's `**`
      # spans slashes, so `server/src/**/*.md` requires at least one directory
      # level and would silently skip top-level files such as
      # server/src/README.md, leaving the over-trigger in place for exactly the
      # file that motivated the exemption.
      - "server/src/**"
      - "!server/src/*.md"
      - "!server/src/**/*.md"
      - "server/test/**/*.test.ts"
      - "scripts/verify-fail-before.sh"
      - ".github/workflows/verify-fail-before.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-fail-before:
    name: verify-fail-before
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Verify changed tests fail before source fix
        env:
          SKIP_FAIL_BEFORE: ${{ vars.SKIP_FAIL_BEFORE }}
          SKIP_REASON: ${{ vars.SKIP_FAIL_BEFORE_REASON }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            scripts/verify-fail-before.sh "origin/${{ github.base_ref }}"
          else
            scripts/verify-fail-before.sh "origin/main"
          fi
