name: Keychain Linux Real-Backend Integration

# Exercises the production secret-tool shell-out path in
# server/src/wrap/passphrase.ts against a real libsecret-compatible
# Secret Service backend on every push and pull request that touches the
# Linux keychain code. Closes the v0.10.1 / v1.0.2 backlog item (b) CI
# gap diagnosed in PR #151 and tracked in issue #153.
#
# Backend choice: pass-secret-service, a libsecret-compatible Secret
# Service implementation backed by `pass` (GPG-encrypted password store).
# Unlike gnome-keyring, pass-secret-service has no GUI prompter
# requirement and creates collections without confirmation, so it works
# on headless Ubuntu runners. Four CI iterations against gnome-keyring
# in PR #151 confirmed that its CreateCollection D-Bus call requires a
# graphical prompter that ubuntu-latest does not provide.
#
# The production code is unchanged and unaware of the backend choice; it
# shells out to `secret-tool`, which speaks the libsecret D-Bus protocol
# to whichever Secret Service implementation has claimed
# org.freedesktop.secrets on the session bus. Real desktop sessions
# still use gnome-keyring, KDE Wallet, or KeePassXC; this workflow
# exercises the same wire protocol against pass-secret-service so the
# shell-out shape (binary path, exit-code semantics, stdin handling,
# attribute serialization) gets a real-D-Bus regression test in
# automated CI.
#
# The mock test at server/test/keychain-linux-secret-service.test.ts
# remains authoritative for unit-level behavior and runs in standard CI
# on every PR via ci.yml. This workflow is the second layer, for
# shell-out drift the mocks cannot see.
#
# Setup lives in .github/actions/setup-linux-secret-service, shared with
# ci.yml, test-baseline-guard.yml, and publish-on-tag.yml. This workflow
# used to carry its own copy of the whole stack (apt, venv, the
# pass-secret-service source patches, GPG, `pass init`, daemon start,
# smoke test) wrapped in `dbus-run-session -- bash -e -c '...'`. Two
# copies of a 120-line setup drift, and they had already: the inline copy
# ran the disposable-keyring provisioning inside `export VAR="$(...)"`,
# where a command substitution masks the exit status from `set -e`, so a
# provisioning failure produced an empty token and the job sailed on to
# run a suite that skipped every case.
#
# Failure mode to recognize: if this job reports zero real-backend tests,
# the setup action is what to read, not this file. The suite prints its
# own skip reason on any Linux host that has secret-tool and a bus.

on:
  push:
    branches: [main]
    paths:
      - "server/src/wrap/passphrase.ts"
      - "server/src/wrap/keychain-exec.ts"
      - "server/test/keychain-linux-real-backend-integration.test.ts"
      - "server/test/keychain-linux-real-backend-integration.expected-cases"
      - "server/test/keychain-linux-secret-service.test.ts"
      - "server/test/setup/keychain-fake.ts"
      - "server/test/support/real-backend-guard.ts"
      - "server/package.json"
      - "server/package-lock.json"
      - ".github/workflows/keychain-linux-real-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/src/wrap/passphrase.ts"
      - "server/src/wrap/keychain-exec.ts"
      - "server/test/keychain-linux-real-backend-integration.test.ts"
      - "server/test/keychain-linux-real-backend-integration.expected-cases"
      - "server/test/keychain-linux-secret-service.test.ts"
      - "server/test/setup/keychain-fake.ts"
      - "server/test/support/real-backend-guard.ts"
      - "server/package.json"
      - "server/package-lock.json"
      - ".github/workflows/keychain-linux-real-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-backend-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Installs libsecret + pass-secret-service, starts a session bus,
      # and smoke-tests it, exporting DBUS_SESSION_BUS_ADDRESS. It fails
      # the job on any problem rather than continuing degraded, because a
      # missing Secret Service makes the suite skip and a fully skipped
      # suite still exits 0. Whether the keyring counts as disposable is
      # decided by server/test/support/real-backend-guard.ts from
      # GITHUB_ACTIONS, not by anything this action exports.
      - name: Install libsecret + Secret Service backend
        uses: ./.github/actions/setup-linux-secret-service

      - name: Install npm deps
        working-directory: server
        run: npm ci

      - name: Build
        working-directory: server
        run: npm run build

      - name: Run real-backend integration test against pass-secret-service
        working-directory: server
        # NO_COLOR / FORCE_COLOR=0 keep vitest ANSI-free so the summary grep
        # below can parse it, exactly as test-baseline-guard.yml does for its
        # own gates. Without this, vitest prints
        # `Tests \e[22m \e[1m\e[32m5 passed\e[39m`, so the pattern misses a
        # run that passed all five and the job reports the opposite of what
        # happened.
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail
          npm test -- keychain-linux-real-backend-integration.test.ts 2>&1 \
            | tee /tmp/real-backend-vitest.log
          status="${PIPESTATUS[0]}"
          if [ "$status" != "0" ]; then
            exit "$status"
          fi

          # A skipped suite exits 0, so the point of this workflow can
          # evaporate silently. Requiring merely "some tests passed" is not
          # enough: vitest reports `Tests  1 passed | 4 skipped` when four of
          # the five cases vanish, and that satisfies any "N passed" pattern.
          # So require the EXACT count.
          #
          # The expectation lives in
          # test/keychain-linux-real-backend-integration.expected-cases, which
          # test/wrap/keychain-exec-guard.test.ts holds equal to the number of
          # `it(` cases in the suite. Adding a case therefore fails in ordinary
          # CI until the file is bumped, rather than silently reopening this
          # hole here.
          #
          # Failure mode: a mismatch means either a case was added without
          # bumping the count, or cases are being skipped at runtime. The suite
          # prints its own skip reason, so read that first.
          expected="$(tr -d '[:space:]' \
            < test/keychain-linux-real-backend-integration.expected-cases)"
          if ! grep -qE "Tests[[:space:]]+${expected} passed \(${expected}\)" \
               /tmp/real-backend-vitest.log; then
            echo "real-backend suite did not report exactly ${expected} passing tests." >&2
            echo "A skipped or partially-skipped suite still exits 0, so this is the check that catches it." >&2
            echo "Skip conditions: linux + secret-tool + DBUS_SESSION_BUS_ADDRESS + an ephemeral CI runner." >&2
            grep -E "^[[:space:]]*Tests|real-backend. skipping" /tmp/real-backend-vitest.log >&2 || true
            exit 1
          fi
