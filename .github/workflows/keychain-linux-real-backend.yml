name: Keychain Linux Real-Backend Integration

# Exercises the Linux Secret Service path in passphrase.ts against a real
# secret-tool CLI plus a real gnome-keyring-daemon running on a per-job
# dbus-run-session bus. Closes the gap carried since v0.10.1 PR #60 (mock
# coverage only) and full-sweep #45 (P1).
#
# This workflow runs in addition to the standard CI workflow. The mock test
# at server/test/keychain-linux-secret-service.test.ts remains authoritative
# for unit-level behavior; this job catches regressions in the shell-out
# shape that mocks cannot see.

on:
  push:
    branches: [main]
    paths:
      - 'server/src/cocoon/passphrase.ts'
      - 'server/test/keychain-linux-real-backend-integration.test.ts'
      - '.github/workflows/keychain-linux-real-backend.yml'
  pull_request:
    paths:
      - 'server/src/cocoon/passphrase.ts'
      - 'server/test/keychain-linux-real-backend-integration.test.ts'
      - '.github/workflows/keychain-linux-real-backend.yml'

jobs:
  real-backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Secret Service stack
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus dbus-x11 \
            gnome-keyring \
            libsecret-1-0 \
            libsecret-tools

      - name: Install npm deps
        working-directory: server
        run: npm ci

      - name: Build
        working-directory: server
        run: npm run build

      - name: Run real-backend integration test
        # Bring up D-Bus session bus, gnome-keyring-daemon, and verify
        # secret-tool round-trip BEFORE running the integration suite.
        # Two earlier attempts (combined --start --unlock under
        # dbus-run-session, and the dual-call jaraco/keyring pattern)
        # both produced the same failure: tests 1, 2, and 4 fell
        # through to fallback file because secret-tool store exited
        # non-zero. The dual-call pattern's first --unlock invocation
        # transiently starts a daemon, so the second --start sees
        # `discover_other_daemon: 1` and does not re-register the
        # secrets component on the bus, leaving the default collection
        # locked.
        #
        # This shape uses --replace --start in a single call so the
        # daemon is forced to take over the secrets role on the bus,
        # then drops a smoke test against the live secret-tool CLI to
        # surface keyring failure before the integration tests run
        # (the smoke test gives a single-line diagnostic of which
        # layer is broken: env vars, daemon registration, or write
        # path).
        run: |
          set -e
          mkdir -p "$HOME/.local/share/keyrings"
          chmod 700 "$HOME/.local/share/keyrings"
          rm -f "$HOME/.local/share/keyrings"/*.keyring 2>/dev/null || true

          eval "$(dbus-launch --sh-syntax)"
          eval "$(printf "" | gnome-keyring-daemon --replace --start --components=secrets,pkcs11,ssh)"
          export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
          printf "" | gnome-keyring-daemon --unlock || true

          echo "=== Environment ==="
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL"
          pgrep -af gnome-keyring-daemon || echo "(no daemon process)"

          echo "=== secret-tool smoke test ==="
          if printf "smokevalue" | secret-tool store --label="smoke" service smoke-svc account smoke-acct; then
            echo "  store: OK"
          else
            echo "  store: FAILED (exit $?)"
            exit 1
          fi
          smoke_value=$(secret-tool lookup service smoke-svc account smoke-acct || echo "")
          if [ "$smoke_value" = "smokevalue" ]; then
            echo "  lookup: OK"
          else
            echo "  lookup: FAILED (got '$smoke_value')"
            exit 1
          fi
          secret-tool clear service smoke-svc account smoke-acct || true
          echo "=== smoke test passed ==="

          cd server && npm test -- keychain-linux-real-backend-integration.test.ts
