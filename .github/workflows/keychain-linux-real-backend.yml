name: Keychain Linux Real-Backend Integration

# Exercises the Linux Secret Service path in passphrase.ts against a real
# secret-tool CLI plus a real gnome-keyring-daemon running on a per-job
# dbus-run-session bus. Closes the gap carried since v0.10.1 PR #60 (mock
# coverage only) and full-sweep #45 (P1).
#
# This workflow runs in addition to the standard CI workflow. The mock test
# at server/test/keychain-linux-secret-service.test.ts remains authoritative
# for unit-level behavior; this job catches regressions in the shell-out
# shape that mocks cannot see.

on:
  push:
    branches: [main]
    paths:
      - 'server/src/cocoon/passphrase.ts'
      - 'server/test/keychain-linux-real-backend-integration.test.ts'
      - '.github/workflows/keychain-linux-real-backend.yml'
  pull_request:
    paths:
      - 'server/src/cocoon/passphrase.ts'
      - 'server/test/keychain-linux-real-backend-integration.test.ts'
      - '.github/workflows/keychain-linux-real-backend.yml'

jobs:
  real-backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Secret Service stack
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus dbus-x11 \
            gnome-keyring \
            libsecret-1-0 \
            libsecret-tools

      - name: Install npm deps
        working-directory: server
        run: npm ci

      - name: Build
        working-directory: server
        run: npm run build

      - name: Run real-backend integration test
        # Canonical dual-call pattern used by python-keyring's CI
        # (https://github.com/jaraco/keyring/blob/main/.github/workflows/main.yml).
        # Three steps in one shell so env vars from each eval persist
        # into the npm test child process:
        #
        #   1. dbus-launch starts a session bus and exports
        #      DBUS_SESSION_BUS_ADDRESS / DBUS_SESSION_BUS_PID via
        #      --sh-syntax for eval.
        #   2. First gnome-keyring-daemon --unlock initializes the
        #      login keyring with an empty password (no display needed
        #      because empty pw skips the prompter entirely).
        #   3. Second gnome-keyring-daemon --start --components=secrets
        #      daemonizes the secrets component against the bus and
        #      exports GNOME_KEYRING_CONTROL plus SSH_AUTH_SOCK.
        #
        # An earlier attempt combined --start --unlock in a single call
        # under dbus-run-session; that leaves the default keyring
        # collection locked even though the login keyring is unlocked,
        # so secret-tool store fires the gcr-prompter which fails with
        # exit 1 on a headless runner. The dual-call pattern with empty
        # password unlocks both the login and default collections.
        run: |
          eval $(dbus-launch --sh-syntax)
          eval $(echo -n "" | gnome-keyring-daemon --unlock)
          eval $(echo -n "" | gnome-keyring-daemon --start --components=secrets)
          cd server && npm test -- keychain-linux-real-backend-integration.test.ts
