name: Setup Linux Secret Service
description: Install libsecret tooling and start a headless Secret Service backend for CI tests.
runs:
  using: composite
  steps:
    - name: Install libsecret and pass-secret-service prerequisites
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          dbus \
          dbus-x11 \
          gnupg \
          pass \
          libsecret-1-dev \
          libsecret-tools \
          python3-venv \
          python3-dev \
          libcairo2-dev \
          libgirepository1.0-dev \
          pkg-config \
          gir1.2-glib-2.0

    - name: Install pass-secret-service
      shell: bash
      run: |
        set -euo pipefail
        python3 -m venv "$HOME/pss-venv"
        "$HOME/pss-venv/bin/pip" install --quiet --upgrade pip wheel
        "$HOME/pss-venv/bin/pip" install --quiet \
          "pygobject<3.50" \
          cryptography \
          pass-secret-service

        SESSION_FILE="$(find "$HOME/pss-venv/lib" -path '*/pass_secret_service/interfaces/session.py' -print -quit)"
        if [ -z "$SESSION_FILE" ]; then
          echo "could not locate pass_secret_service session.py inside venv" >&2
          exit 1
        fi
        sed -i '/^from cryptography\.utils import int_from_bytes$/d' "$SESSION_FILE"
        sed -i 's/\bint_from_bytes\b/int.from_bytes/g' "$SESSION_FILE"
        sed -i 's|password = secret\[2\]|password = bytes(secret[2])|' "$SESSION_FILE"
        sed -i "s|int\.from_bytes(input, 'big')|int.from_bytes(bytes(input), 'big')|" "$SESSION_FILE"
        echo "$HOME/pss-venv/bin" >> "$GITHUB_PATH"

    - name: Initialize ephemeral pass store
      shell: bash
      run: |
        set -euo pipefail
        GNUPGHOME="${GITHUB_WORKSPACE}/.gnupg-ci"
        echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
        export GNUPGHOME

        mkdir -p "$GNUPGHOME"
        chmod 700 "$GNUPGHOME"
        echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
        gpgconf --kill gpg-agent || true

        cat > "$GNUPGHOME/key-batch" <<'EOF'
        %no-protection
        Key-Type: RSA
        Key-Length: 2048
        Name-Real: Sanctuary CI
        Name-Email: ci@sanctuary-framework.invalid
        Expire-Date: 0
        %commit
        EOF
        gpg --batch --pinentry-mode loopback --gen-key "$GNUPGHOME/key-batch"

        GPG_KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
        if [ -z "$GPG_KEY" ]; then
          echo "GPG key generation produced no fingerprint" >&2
          exit 1
        fi
        pass init "$GPG_KEY"

    - name: Start Secret Service backend
      shell: bash
      run: |
        set -euo pipefail
        eval "$(dbus-launch --sh-syntax)"
        echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
        echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"

        "$HOME/pss-venv/bin/pass_secret_service" > /tmp/pass-secret-service.log 2>&1 &
        PSS_PID=$!
        echo "PASS_SECRET_SERVICE_PID=$PSS_PID" >> "$GITHUB_ENV"

        for i in $(seq 1 40); do
          if dbus-send --session --print-reply \
               --dest=org.freedesktop.secrets \
               /org/freedesktop/secrets \
               org.freedesktop.DBus.Peer.Ping >/dev/null 2>&1; then
            echo "pass-secret-service registered on session bus (attempt $i)"
            break
          fi
          if [ "$i" = "40" ]; then
            echo "pass-secret-service did not register within 20s" >&2
            cat /tmp/pass-secret-service.log >&2 || true
            exit 1
          fi
          sleep 0.5
        done

        printf "smokevalue" | secret-tool store --label=smoke \
          service smoke-svc account smoke-acct
        smoke_value="$(secret-tool lookup service smoke-svc account smoke-acct)"
        if [ "$smoke_value" != "smokevalue" ]; then
          echo "smoke lookup mismatch: expected smokevalue, got $smoke_value" >&2
          cat /tmp/pass-secret-service.log >&2 || true
          exit 1
        fi
        secret-tool clear service smoke-svc account smoke-acct

        # Mint the run-specific disposable-keyring proof, AFTER the smoke test
        # showed this action's own backend is the one answering on the bus.
        # Single script, shared with
        # .github/workflows/keychain-linux-real-backend.yml, so the two
        # provisioning sites cannot drift apart. It stores a fresh nonce INTO
        # this keyring and records it next to the live bus address;
        # server/test/support/real-backend-guard.ts reads the nonce back through
        # secret-tool and refuses to take the in-memory credential store off
        # unless it matches. The old value here was a literal "1", which a
        # developer's stale shell export satisfied just as well.
        #
        # Failure mode: the script exits non-zero on every problem rather than
        # emitting a weaker token, because a missing declaration errors nothing
        # on its own. The integration file simply skips, the suite stays green,
        # and the loss shows up only as a lower passing count that the
        # exact-match floor in .github/workflows/test-baseline-guard.yml
        # rejects.
        # A bare assignment, deliberately. `export VAR="$(cmd)"` takes its exit
        # status from `export`, not from cmd, so `set -e` does NOT abort when
        # the provisioning fails: you get an empty token and a job that carries
        # on to run a suite that skips everything. That is exactly what happened
        # in the copy of this setup that used to live inline in
        # keychain-linux-real-backend.yml. A plain `var="$(cmd)"` propagates
        # cmd's status, so a failure stops the job here, where the error is.
        token_path="$("${GITHUB_WORKSPACE}/scripts/ci/provision-disposable-keyring.sh")"
        echo "SANCTUARY_TEST_DISPOSABLE_KEYRING=$token_path" >> "$GITHUB_ENV"
