name: Implementation Experience
description: Share findings from building against the Sanctuary Framework interfaces.
title: "[Implementation] "
labels: ["implementation"]
body:
  - type: textarea
    id: what-you-built
    attributes:
      label: What did you build?
      description: Brief description of your implementation — what it does, what stack it uses, what layers it touches.
    validations:
      required: true
  - type: checkboxes
    id: layers-implemented
    attributes:
      label: Which layers did you implement against?
      options:
        - label: "L1: Cognitive Sovereignty (StateStore, IdentityRoot)"
        - label: "L2: Operational Isolation (ExecutionEnvironment, ResourceGate)"
        - label: "L3: Selective Disclosure (ProofEngine, DisclosureController, SecureChannel)"
        - label: "L4: Verifiable Reputation (ReputationStore, DisputeResolution, TrustBootstrap)"
  - type: textarea
    id: what-worked
    attributes:
      label: What worked well?
      description: Which interfaces were clear and implementable? Which properties were well-specified?
    validations:
      required: false
  - type: textarea
    id: what-didnt
    attributes:
      label: What didn't work or was missing?
      description: Where did you hit gaps, ambiguities, or impractical requirements? This is the most valuable part of your report.
    validations:
      required: true
  - type: textarea
    id: technology-notes
    attributes:
      label: Technology notes
      description: What specific technologies did you use at each layer (e.g., KERI for identity, Intel TDX for isolation, Groth16 for proofs)? Any interoperability findings?
    validations:
      required: false
  - type: dropdown
    id: publish-sim
    attributes:
      label: Would you publish a Sanctuary Interface Manifest (SIM) for your implementation?
      options:
        - "Yes — I'd like guidance on the format"
        - "Maybe — depends on how formal it needs to be"
        - "No — just sharing findings"
    validations:
      required: false
