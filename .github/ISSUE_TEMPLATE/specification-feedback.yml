name: Specification Feedback
description: Report a gap, ambiguity, error, or conflict in the Sanctuary Framework specification.
title: "[Spec] "
labels: ["specification"]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Which layer or section is affected?
      options:
        - "L1: Cognitive Sovereignty"
        - "L2: Operational Isolation"
        - "L3: Selective Disclosure"
        - "L4: Verifiable Reputation"
        - "Composition (Part III)"
        - "Governance (Part IV)"
        - "Implementation Guidance (Part V)"
        - "Design Principles (Part I)"
        - "Multiple layers / cross-cutting"
    validations:
      required: true
  - type: dropdown
    id: feedback-type
    attributes:
      label: What kind of feedback is this?
      options:
        - Gap — something is missing
        - Ambiguity — something is unclear or could be read multiple ways
        - Error — something is technically incorrect
        - Conflict — the spec conflicts with an existing standard or itself
        - Enhancement — a property, interface, or principle that should be added
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue. Reference specific section numbers (e.g., S1.3, I2.1, C2) where possible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed resolution
      description: If you have a suggestion for how to address this, describe it here. Not required — identifying the problem is valuable on its own.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to related standards, implementations, or prior art that are relevant.
    validations:
      required: false
