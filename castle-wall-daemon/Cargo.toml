[package]
name = "castle-wall-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Sanctuary Castle Wall filter daemon (Castle Architecture Layer 1)."
license = "Apache-2.0"
publish = false

[lib]
name = "castle_wall_daemon"
path = "src/lib.rs"

[[bin]]
name = "castle-wall-daemon"
path = "src/main.rs"

[[bin]]
name = "sanctuary-jail"
path = "src/bin/sanctuary-jail.rs"

[[bin]]
name = "sanctuary-plugin-launcher"
path = "src/bin/sanctuary-plugin-launcher.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["rand_core", "std"] }
rand_core = { version = "0.6", features = ["std"] }
sha2 = "=0.10.9"
hex = "0.4"
base64 = "0.22"
thiserror = "1.0"
nix = { version = "=0.27.1", default-features = false, features = ["fs", "user", "signal", "socket", "process", "poll", "net", "sched", "mount", "resource"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.10"
nfq = "=0.2.5"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
