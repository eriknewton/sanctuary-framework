alert_name: Sanctuary deny burst
alert_category: Audit
severity: SEV_0x0_LOW
execution_mode: scheduled
search_window: 5m
xql_query: |
  datamodel dataset = xdm
  | filter sanctuary.audit.decision = "deny"
  | bin _time span = 5m
  | comp count() as deny_count by _time, xdm.source.user.username
  | filter deny_count >= 5
alert_fields:
  - _time
  - xdm.source.user.username
  - sanctuary.audit.decision
  - xdm.event.operation
